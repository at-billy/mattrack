async function claimBootstrapAdmin() {
  if(hasAdmin()) { toast('An admin already exists.'); renderNav(); return; }
  if(!await confirmModal(`Claim admin role for "${state.user.username}"? This is only possible while no admins exist.`)) return;
  try {
    const updated=await convexMutation('users:claimBootstrapAdmin',{sessionToken:state.sessionToken});
    state.user=updated;
    toast('Admin role claimed!');
    await refreshAll();
    goTo('admin');
  } catch(e){
    if(e.message.includes('ADMIN_EXISTS')) toast('An admin already exists — cannot claim.');
    else notifyError(e);
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
// ─── CUSTOM SELECT WIDGET ───────────────────────────────────────────────────
// Enhances every native <select> with a styled, themed dropdown whose open list
// matches the design. The native <select> is kept (hidden) as the value-holder, so
// all existing onchange handlers keep working. Panel renders to <body> (fixed) to
// escape modal scroll-clipping. Auto-applies to dynamically-added selects.
(function(){
  let open=null; // { sel, wrap, trigger, panel, opts, active, reposition }

  function labelOf(sel){ const o=sel.options[sel.selectedIndex]; return o?o.textContent:''; }

  function closeOpen(refocus){
    if(!open) return;
    const o=open; open=null;
    o.panel.remove();
    o.wrap.classList.remove('open');
    o.trigger.setAttribute('aria-expanded','false');
    window.removeEventListener('scroll', o.reposition, true);
    window.removeEventListener('resize', o.reposition);
    if(refocus){ try{ o.trigger.focus({preventScroll:true}); }catch(e){} }
  }

  function reposition(trigger, panel){
    const r=trigger.getBoundingClientRect();
    panel.style.position='fixed';
    panel.style.left=r.left+'px';
    panel.style.width=r.width+'px';
    const below=window.innerHeight-r.bottom;
    if(below < 220 && r.top > below){
      panel.style.top='auto';
      panel.style.bottom=(window.innerHeight-r.top+2)+'px';
      panel.style.maxHeight=Math.min(300, r.top-12)+'px';
    } else {
      panel.style.bottom='auto';
      panel.style.top=(r.bottom-1)+'px';
      panel.style.maxHeight=Math.min(300, below-12)+'px';
    }
  }

  const CS_SEARCH_MIN=12;   // show a search box when the list is longer than this
  const CS_RENDER_CAP=200;  // cap rendered options for very long lists

  function visEls(){ return open ? [...open.listWrap.querySelectorAll('.cs-option')] : []; }
  function setActiveEl(el){
    if(!open) return;
    open.listWrap.querySelectorAll('.cs-option.cs-active').forEach(x=>x.classList.remove('cs-active'));
    if(el){ el.classList.add('cs-active'); scrollPanelTo(el); open.active=visEls().indexOf(el); }
    else open.active=-1;
  }
  // Scroll the active option into view WITHIN the panel only — never the page
  // behind it (which made the background jump).
  function scrollPanelTo(el){
    const p=open&&open.panel; if(!p||!el) return;
    const pr=p.getBoundingClientRect(), er=el.getBoundingClientRect();
    const stick=open.searchInput?((p.querySelector('.cs-searchwrap')||{}).offsetHeight||0):0;
    if(er.top < pr.top+stick) p.scrollTop -= (pr.top+stick - er.top);
    else if(er.bottom > pr.bottom) p.scrollTop += (er.bottom - pr.bottom);
  }
  function moveActive(delta){ const els=visEls(); if(!els.length) return; let i=(open.active<0?-1:open.active)+delta; if(i<0)i=0; if(i>=els.length)i=els.length-1; setActiveEl(els[i]); }
  function chooseActive(){ const els=visEls(); if(open && open.active>=0 && els[open.active]) choose(Number(els[open.active].dataset.idx)); else closeOpen(true); }

  function choose(i){
    if(!open) return;
    const sel=open.sel;
    if(i>=0 && i<sel.options.length){ sel.selectedIndex=i; sel.dispatchEvent(new Event('change',{bubbles:true})); }
    closeOpen(true);
  }

  function renderOptions(query){
    if(!open) return;
    const sel=open.sel, list=open.listWrap, q=(query||'').trim().toLowerCase();
    list.innerHTML=''; let shown=0, more=0;
    for(let i=0;i<sel.options.length;i++){
      const o=sel.options[i]; const txt=o.textContent||'';
      if(q && !txt.toLowerCase().includes(q)) continue;
      if(shown>=CS_RENDER_CAP){ more++; continue; }
      const el=document.createElement('div');
      el.className='cs-option'; el.setAttribute('role','option'); el.dataset.idx=String(i);
      el.setAttribute('aria-selected', o.selected?'true':'false'); el.textContent=txt;
      el.addEventListener('mousedown',(e)=>{ e.preventDefault(); choose(i); });
      el.addEventListener('mousemove',()=>setActiveEl(el));
      list.appendChild(el); shown++;
    }
    if(!shown){ const e=document.createElement('div'); e.className='cs-empty'; e.textContent='No matches'; list.appendChild(e); }
    else if(more){ const e=document.createElement('div'); e.className='cs-more'; e.textContent=`+${more} more — keep typing`; list.appendChild(e); }
    const selEl=list.querySelector('.cs-option[aria-selected="true"]');
    setActiveEl(selEl || list.querySelector('.cs-option'));
  }

  function openPanel(sel, wrap, trigger){
    closeOpen(false);
    const panel=document.createElement('div');
    panel.className='cs-panel'; panel.setAttribute('role','listbox');
    const searchable = sel.options.length > CS_SEARCH_MIN;
    let searchInput=null;
    if(searchable){
      const sw=document.createElement('div'); sw.className='cs-searchwrap';
      searchInput=document.createElement('input'); searchInput.type='text'; searchInput.className='cs-search';
      searchInput.placeholder='Type to search…'; searchInput.autocomplete='off'; searchInput.spellcheck=false;
      sw.appendChild(searchInput); panel.appendChild(sw);
    }
    const listWrap=document.createElement('div'); listWrap.className='cs-list';
    panel.appendChild(listWrap);
    document.body.appendChild(panel);
    wrap.classList.add('open'); trigger.setAttribute('aria-expanded','true');
    const rep=()=>reposition(trigger,panel);
    open={ sel, wrap, trigger, panel, listWrap, searchInput, active:-1, reposition:rep };
    renderOptions(''); rep();
    window.addEventListener('scroll', rep, true); window.addEventListener('resize', rep);
    if(searchInput){
      searchInput.addEventListener('input',()=>{ renderOptions(searchInput.value); rep(); });
      searchInput.addEventListener('keydown',(e)=>{
        if(e.key==='ArrowDown'){ e.preventDefault(); moveActive(1); }
        else if(e.key==='ArrowUp'){ e.preventDefault(); moveActive(-1); }
        else if(e.key==='Enter'){ e.preventDefault(); chooseActive(); }
        else if(e.key==='Escape'){ e.preventDefault(); closeOpen(true); }
      });
      setTimeout(()=>{ try{ searchInput.focus({preventScroll:true}); }catch(e){} },0);
    }
  }

  function enhance(sel){
    if(sel.dataset.csOn || sel.multiple) return;
    sel.dataset.csOn='1';
    const wrap=document.createElement('div'); wrap.className='cs-wrap';
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    sel.classList.add('cs-native'); sel.setAttribute('aria-hidden','true'); sel.tabIndex=-1;
    const trigger=document.createElement('button');
    trigger.type='button'; trigger.className='cs-trigger';
    trigger.setAttribute('aria-haspopup','listbox'); trigger.setAttribute('aria-expanded','false');
    const lbl=document.createElement('span'); lbl.className='cs-label'; lbl.textContent=labelOf(sel)||' ';
    trigger.appendChild(lbl);
    wrap.appendChild(trigger);

    if(sel.disabled) trigger.disabled=true;
    const isOpen=()=> open && open.trigger===trigger;
    trigger.addEventListener('click',(e)=>{ e.preventDefault(); isOpen()?closeOpen(false):openPanel(sel,wrap,trigger); });
    trigger.addEventListener('keydown',(e)=>{
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){
        e.preventDefault();
        if(!isOpen()){ openPanel(sel,wrap,trigger); return; }
        moveActive(e.key==='ArrowDown'?1:-1);
      } else if(e.key==='Enter'||e.key===' '){
        e.preventDefault();
        if(!isOpen()) openPanel(sel,wrap,trigger); else chooseActive();
      } else if(e.key==='Escape'){ if(isOpen()){ e.preventDefault(); closeOpen(true); } }
      else if(e.key==='Home'){ if(isOpen()){ e.preventDefault(); const els=visEls(); if(els[0]) setActiveEl(els[0]); } }
      else if(e.key==='End'){ if(isOpen()){ e.preventDefault(); const els=visEls(); if(els.length) setActiveEl(els[els.length-1]); } }
      else if(!isOpen() && e.key.length===1){ // closed: type-ahead jumps to first match
        const ch=e.key.toLowerCase();
        for(let k=0;k<sel.options.length;k++){
          if((sel.options[k].textContent||'').trim().toLowerCase().startsWith(ch)){ sel.selectedIndex=k; sel.dispatchEvent(new Event('change',{bubbles:true})); break; }
        }
      }
    });
    // Keep the trigger label in sync when the value or options change in code.
    sel.addEventListener('change',()=>{ lbl.textContent=labelOf(sel)||' '; });
    new MutationObserver(()=>{ lbl.textContent=labelOf(sel)||' '; }).observe(sel,{childList:true});
  }

  document.addEventListener('mousedown',(e)=>{
    if(open && !open.panel.contains(e.target) && !open.wrap.contains(e.target)) closeOpen(false);
  });

  // Escape closes only the open dropdown (capture-phase so it pre-empts the modal's
  // Escape handler) — works even when the trigger isn't focused (mouse-opened on macOS).
  document.addEventListener('keydown',(e)=>{
    if(open && e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeOpen(true); }
  }, true);

  function enhanceAll(root){ (root||document).querySelectorAll('select:not([data-cs-on])').forEach(enhance); }
  new MutationObserver((muts)=>{
    for(const m of muts) for(const n of m.addedNodes){
      if(n.nodeType!==1) continue;
      if(n.tagName==='SELECT') enhance(n);
      else if(n.querySelectorAll) n.querySelectorAll('select:not([data-cs-on])').forEach(enhance);
    }
  }).observe(document.documentElement,{childList:true,subtree:true});
  enhanceAll();
})();

async function init(){
  if(!CONVEX_URL){showSetup();return;}
  const token=localStorage.getItem('mattrack_token');
  if(token){
    try{

      if(user){state.user=user;state.sessionToken=token;showApp();return;}

  showAuth();
}

/* ── PRIMARY NAV SCROLL BEHAVIOUR ───────────────────────────────────
   Primary nav (MAT/TASK/CRAFT/LOG):
     - Snaps to 10% sliver on scroll down past 40px
     - On scroll up: slides back in direct proportion to upward scroll
       distance — no easing, items move at exactly scroll speed.
       Fully back after RETURN_RANGE px of upscroll from wherever you are.
   Subnav:
     - Hides on scroll down past 40px
     - Only reappears when scrolled back near the top (scrollY < SUBNAV_THRESHOLD)
─────────────────────────────────────────────────────────────────── */
(function(){
  const TRANSLATE_CAP    = 0.9;   // hide 90%, always show bottom 10%
  const RETURN_RANGE     = 120;   // px of upscroll needed to fully return
  const SUBNAV_THRESHOLD = 60;    // px — subnav returns only when close to top

  let HEADER_H     = 0;
  let MAX_TRANSLATE = 0;
  let primaryHidden = false;
  let subnavHidden  = false;
  let returnAnchor  = null;  // scrollY when upscroll started
  let lastScrollY   = window.scrollY;

  function setup(updateMargin){
    const primary  = document.getElementById('nav-primary');
    const pageWrap = document.getElementById('page-wrap');
    const nav      = document.getElementById('nav');
    if(!primary || !pageWrap || !nav) return;

    primary.style.height = '';
    const item = primary.querySelector('.nav-main');
    HEADER_H      = item ? item.offsetHeight : 160;
    MAX_TRANSLATE = HEADER_H * TRANSLATE_CAP;
    primary.style.height = HEADER_H + 'px';

    if(updateMargin || !pageWrap.style.marginTop){
      pageWrap.style.marginTop = nav.offsetHeight + 'px';
    }
    document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
  }

  function setPrimaryTranslate(translateY, withTransition){
    const primary = document.getElementById('nav-primary');
    if(!primary) return;
    primary.querySelectorAll('.nav-main').forEach(el => {
      el.style.transition = withTransition ? 'transform 0.18s ease' : 'none';
      el.style.transform  = el.classList.contains('active')
        ? 'translate(0,0)'
        : `translate(0,-${translateY}px)`;
    });
  }

  function applySubnav(hide){
    if(subnavHidden === hide) return;
    subnavHidden = hide;
    const sub = document.getElementById('nav-sub');
    if(!sub) return;
    sub.style.transition    = 'opacity 0.18s ease';
    sub.style.opacity       = hide ? '0' : '1';
    sub.style.pointerEvents = hide ? 'none' : '';
  }

  let ticking = false;

  function update(){
    const scrollY   = window.scrollY;
    const goingDown = scrollY > lastScrollY;
    lastScrollY     = scrollY;

    // Primary nav
    if(!primaryHidden){
      if(goingDown && scrollY > 40){
        primaryHidden = true;
        returnAnchor  = null;
        setPrimaryTranslate(MAX_TRANSLATE, true); // snap hidden
      }
    } else {
      if(goingDown){
        // Scrolled back down while returning — reset anchor, snap hidden
        returnAnchor = null;
        setPrimaryTranslate(MAX_TRANSLATE, true);
      } else {
        // Scrolling up — track distance from where upscroll started
        if(returnAnchor === null) returnAnchor = scrollY;
        const upScrolled = returnAnchor - scrollY;
        const progress   = Math.min(1, upScrolled / RETURN_RANGE);
        setPrimaryTranslate((1 - progress) * MAX_TRANSLATE, false);
        if(progress >= 1){ primaryHidden = false; returnAnchor = null; }
      }
    }

    // Subnav: hide going down, only return when close to top
    if(goingDown && scrollY > 40)       applySubnav(true);
    else if(scrollY < SUBNAV_THRESHOLD) applySubnav(false);

    ticking = false;
  }

  window.addEventListener('scroll', () => {
    if(!ticking){ requestAnimationFrame(update); ticking = true; }
  }, { passive: true });

  window.addEventListener('resize', () => { setup(true); }, { passive: true });

  window._navScrollUpdate = function(){
    setup(false);
    // Re-apply current states without transition after re-render
    const upScrolled = (returnAnchor !== null) ? (returnAnchor - window.scrollY) : 0;
    const progress   = primaryHidden ? Math.min(1, upScrolled / RETURN_RANGE) : 1;
    setPrimaryTranslate(primaryHidden ? (1 - progress) * MAX_TRANSLATE : 0, false);
    const sub = document.getElementById('nav-sub');
    if(sub){
      sub.style.transition    = 'none';
      sub.style.opacity       = subnavHidden ? '0' : '1';
      sub.style.pointerEvents = subnavHidden ? 'none' : '';
    }
  };
})();
</script>
