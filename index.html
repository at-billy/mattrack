<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATTRACK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#e50000;--mid:#999;}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:#fff;color:#000;font-size:14px;line-height:1.4;}

#nav{display:flex;align-items:baseline;border-bottom:2px solid #000;padding:0 40px;flex-wrap:wrap;}
#nav .brand{font-size:30px;font-weight:900;letter-spacing:-1px;padding:18px 40px 18px 0;}
.nav-item{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:22px 18px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;user-select:none;}
.nav-item:hover{color:#555;}
.nav-item.active{border-bottom-color:#000;}
#nav .user-area{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;padding:0 0 0 20px;}
.role-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid #000;}
.role-tag.crafter{border-color:var(--red);color:var(--red);}
.live-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.live-dot{animation:pulse 2s infinite;}

.page{padding:40px 40px 80px;max-width:1400px;}
.page-title{font-size:52px;font-weight:900;letter-spacing:-2px;margin-bottom:6px;line-height:1;}
.page-sub{font-size:13px;color:var(--mid);margin-bottom:40px;}
hr.thick{border:none;border-top:2px solid #000;margin:32px 0;}
hr.thin{border:none;border-top:1px solid #e0e0e0;margin:0;}

button{font-family:inherit;cursor:pointer;border:none;outline:none;}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:9px 18px;}
.btn-black{background:#000;color:#fff;}
.btn-black:hover{background:#222;}
.btn-outline{background:#fff;color:#000;border:1.5px solid #000;}
.btn-outline:hover{background:#f5f5f5;}
.btn-red{background:var(--red);color:#fff;}
.btn-red:hover{background:#c00;}
.btn-sm{padding:5px 10px;font-size:10px;}
.btn-ghost{background:none;color:var(--mid);border:1px solid #ddd;padding:5px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.btn-ghost:hover{border-color:#000;color:#000;}
.btn-max{background:#000;color:#fff;padding:0 16px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid #000;white-space:nowrap;}
.btn-max:hover{background:#333;}

label.lbl{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;color:#555;}
input[type=text],input[type=password],input[type=number],select{
  display:block;width:100%;border:1.5px solid #000;padding:9px 12px;font-size:13px;font-family:inherit;background:#fff;appearance:none;-webkit-appearance:none;outline:none;}
input:focus,select:focus{border-color:var(--red);}
input::placeholder{color:#bbb;}
.field{margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}

.panel{border:1.5px solid #000;padding:28px;}
.collapsible{display:none;}
.collapsible.open{display:block;}

table{width:100%;border-collapse:collapse;}
thead th{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;border-bottom:2px solid #000;text-align:left;white-space:nowrap;}
tbody td{padding:11px 12px;border-bottom:1px solid #e8e8e8;vertical-align:middle;}
tbody tr:hover{background:#fafafa;}
.empty{padding:60px 0;text-align:center;color:var(--mid);font-size:13px;}

.q{display:inline-block;padding:2px 7px;font-size:11px;font-weight:700;background:#000;color:#fff;}
.unit-tag{display:inline-block;padding:1px 5px;font-size:10px;font-weight:700;letter-spacing:.06em;border:1px solid #ccc;color:#666;margin-left:4px;}
.cat-tag{display:inline-block;padding:1px 5px;font-size:10px;font-weight:700;letter-spacing:.06em;background:#f0f0f0;color:#555;}
.item-cat-tag{display:inline-block;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#000;color:#fff;}

.craft-box{border:2px solid #000;padding:24px;margin-bottom:32px;}
.craft-box.err{border-color:var(--red);}
.q-big{font-size:52px;font-weight:900;letter-spacing:-2px;line-height:1;}

.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;}
.badge-crafted{background:var(--red);color:#fff;}
.badge-material_added{background:#000;color:#fff;}
.badge-material_removed,.badge-item_created{background:#888;color:#fff;}
.badge-user_joined{background:#e8e8e8;color:#555;}

.center-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;}
.auth-box{width:100%;max-width:380px;}
.auth-logo{font-size:40px;font-weight:900;letter-spacing:-2px;text-align:center;margin-bottom:48px;}
.tabs{display:flex;border-bottom:2px solid #000;margin-bottom:28px;}
.tab-btn{flex:1;padding:12px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;color:var(--mid);}
.tab-btn.active{border-bottom-color:#000;color:#000;}
.err-msg{font-size:12px;color:var(--red);margin-bottom:12px;display:none;}
.chk-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer;}
.chk-row input{width:auto;flex-shrink:0;}
.chk-row span{font-size:13px;}

.setup-note{font-size:12px;color:#888;margin-top:16px;line-height:1.7;}
.code-block{background:#f5f5f5;border:1px solid #ddd;padding:8px 12px;font-family:monospace;font-size:12px;margin:8px 0;}

#toast{position:fixed;bottom:28px;right:28px;background:#000;color:#fff;padding:12px 20px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:none;z-index:999;}
.search-row{display:flex;gap:12px;align-items:center;margin-bottom:24px;}
.search-row input{max-width:260px;margin:0;}

.unit-inline{font-size:11px;font-weight:700;color:#888;margin-left:4px;}
.loc-display{font-size:12px;color:#555;}
.sys-badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#333;padding:1px 5px;margin-right:4px;}
.sys-badge.pyro{background:#c05000;}
.sys-badge.nyx{background:#005080;}

.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px;}
.filter-tab{padding:5px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid #ddd;background:#fff;color:#888;cursor:pointer;}
.filter-tab.active{border-color:#000;background:#000;color:#fff;}
.filter-tab:hover:not(.active){border-color:#999;color:#000;}

.hint-box{background:#f5f5f5;border-left:3px solid #000;padding:10px 14px;font-size:11px;color:#555;margin-top:8px;line-height:1.7;}
.hint-box strong{color:#000;}
</style>
</head>
<body>

<div id="root"></div>
<div id="toast"></div>

<script>
// ─── STATIC DATA ─────────────────────────────────────────────────────────────
const SC_CATALOG = [
  // Ores — SCU (decimals allowed)
  { cat:'Ores', name:'Agricium',      unit:'SCU' },
  { cat:'Ores', name:'Aluminium',     unit:'SCU' },
  { cat:'Ores', name:'Aslarite',      unit:'SCU' },
  { cat:'Ores', name:'Beryl',         unit:'SCU' },
  { cat:'Ores', name:'Bexalite',      unit:'SCU' },
  { cat:'Ores', name:'Borase',        unit:'SCU' },
  { cat:'Ores', name:'Copper',        unit:'SCU' },
  { cat:'Ores', name:'Corundum',      unit:'SCU' },
  { cat:'Ores', name:'Gold',          unit:'SCU' },
  { cat:'Ores', name:'Hephaestanite', unit:'SCU' },
  { cat:'Ores', name:'Ice',           unit:'SCU' },
  { cat:'Ores', name:'Iron',          unit:'SCU' },
  { cat:'Ores', name:'Laranite',      unit:'SCU' },
  { cat:'Ores', name:'Lindinium',     unit:'SCU' },
  { cat:'Ores', name:'Ouratite',      unit:'SCU' },
  { cat:'Ores', name:'Quantainium',   unit:'SCU' },
  { cat:'Ores', name:'Quartz',        unit:'SCU' },
  { cat:'Ores', name:'Riccite',       unit:'SCU' },
  { cat:'Ores', name:'Savrilium',     unit:'SCU' },
  { cat:'Ores', name:'Silicon',       unit:'SCU' },
  { cat:'Ores', name:'Stileron',      unit:'SCU' },
  { cat:'Ores', name:'Taranite',      unit:'SCU' },
  { cat:'Ores', name:'Tin',           unit:'SCU' },
  { cat:'Ores', name:'Titanium',      unit:'SCU' },
  { cat:'Ores', name:'Torite',        unit:'SCU' },
  { cat:'Ores', name:'Tungsten',      unit:'SCU' },
  // Gems — UNIT (whole amounts)
  { cat:'Gems', name:'Aphorite',      unit:'UNIT' },
  { cat:'Gems', name:'Beradom',       unit:'UNIT' },
  { cat:'Gems', name:'Carinite',      unit:'UNIT' },
  { cat:'Gems', name:'Carinite Pure', unit:'UNIT' },
  { cat:'Gems', name:'Dolivine',      unit:'UNIT' },
  { cat:'Gems', name:'Feynmaline',    unit:'UNIT' },
  { cat:'Gems', name:'Glacosite',     unit:'UNIT' },
  { cat:'Gems', name:'Hadanite',      unit:'UNIT' },
  { cat:'Gems', name:'Jaclium',       unit:'UNIT' },
  { cat:'Gems', name:'Janalite',      unit:'UNIT' },
  { cat:'Gems', name:'Sadaryx',       unit:'UNIT' },
  { cat:'Gems', name:'Saldynium',     unit:'UNIT' },
];

const ITEM_CATEGORIES = [
  { id:'fps_armour',     label:'FPS Armour' },
  { id:'fps_weapon',     label:'FPS Weapon' },
  { id:'ship_component', label:'Ship Component' },
  { id:'ship_weapon',    label:'Ship Weapon' },
];

const SYSTEMS = {
  Stanton: [
    'Area 18','Lorville','Orison','New Babbage',
    'Everus Harbor','Baijini Point','Port Tressler','Grim Hex','Seraphim Station',
    'ARC-L1 Wide Forest Station','ARC-L2 Lively Pathway Station',
    'ARC-L3 Modern Express Station','ARC-L4 Faint Glen Station','ARC-L5 Yellow Core Station',
    'CRU-L1 Ambitious Dream Station','CRU-L4 Shallow Fields Station','CRU-L5 Beautiful Glen Station',
    'HUR-L1 Green Glade Station','HUR-L2 Faithful Dream Station',
    'HUR-L3 Thundering Express Station','HUR-L4 Melodic Fields Station','HUR-L5 High Course Station',
    'MIC-L1 Shallow Frontier Station','MIC-L2 Long Forest Station',
    'MIC-L3 Endless Odyssey Station','MIC-L4 Red Crossroads Station','MIC-L5 Modern Icarus Station',
    'Nyx Gateway (Stanton side)','Pyro Gateway (Stanton side)',
  ],
  Pyro: [
    'Ruin Station','Checkmate Station','Orbituary','Patch City',
    'Endgame','Gaslight',"Rat's Nest",'Dudley & Daughters',
    'Megumi Refueling',"Rod's Fuel 'n Supplies",'Starlight Service Station',
    'Stanton Gateway (Pyro side)','Nyx Gateway (Pyro side)',
  ],
  Nyx: [
    'Levski',
    "People's Service Station Alpha","People's Service Station Delta",
    "People's Service Station Lambda","People's Service Station Theta",
    'Pyro Gateway (Nyx side)','Stanton Gateway (Nyx side)',
  ],
};

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function catLookup(name) { return SC_CATALOG.find(m => m.name === name) || null; }
function unitFor(name)   { return catLookup(name)?.unit || 'UNIT'; }
function sysBadge(sys) {
  const cls = sys ? sys.toLowerCase() : '';
  return `<span class="sys-badge ${cls}">${esc(sys)}</span>`;
}
function itemCatLabel(id) {
  return ITEM_CATEGORIES.find(c => c.id === id)?.label || id || '—';
}

// ─── CONFIG / STATE ───────────────────────────────────────────────────────────
let CONVEX_URL = localStorage.getItem('mattrack_url') || '';
let currentPage = 'materials';
const state = { user: null, stock: [], craftItems: [], archive: [] };
let craftState = { itemId: null, mode: 'best', qMin: 850, qMax: 1000, quantity: 1, plan: null };
let itemsFilter = 'all';
let pollTimer = null;

// ─── CONVEX HTTP HELPERS ──────────────────────────────────────────────────────
async function convexQuery(path, args = {}) {
  const r = await fetch(`${CONVEX_URL}/api/query`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ path, args, format:'json' }),
  });
  const d = await r.json();
  if (d.status !== 'success') throw new Error(d.errorMessage || 'Query failed');
  return d.value;
}
async function convexMutation(path, args = {}) {
  const r = await fetch(`${CONVEX_URL}/api/mutation`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ path, args, format:'json' }),
  });
  const d = await r.json();
  if (d.status !== 'success') throw new Error(d.errorMessage || 'Mutation failed');
  return d.value;
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
async function hashPwd(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw+'|mattrack_v1'));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtDate = d => new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const fmtDT   = d => new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function toast(msg, dur=2800) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',dur);
}
function showErr(id, msg) { const el=document.getElementById(id); if(el){el.textContent=msg;el.style.display='block';} }

// ─── CATALOG SELECT HTML ──────────────────────────────────────────────────────
function catalogOptgroups(extraOption = '') {
  const cats = [...new Set(SC_CATALOG.map(m => m.cat))];
  return `<option value="">Select material…</option>
    ${cats.map(cat => `<optgroup label="${cat}">
      ${SC_CATALOG.filter(m=>m.cat===cat).map(m=>
        `<option value="${esc(m.name)}">${esc(m.name)}</option>`).join('')}
    </optgroup>`).join('')}
    ${extraOption}`;
}

// ─── LOCATION SELECT HTML ─────────────────────────────────────────────────────
function locationOptions(system) {
  const locs = SYSTEMS[system] || [];
  return `<option value="">Select location…</option>${locs.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join('')}`;
}

// ─── POLLING / DATA ───────────────────────────────────────────────────────────
async function refreshAll(silent=false) {
  try {
    const [stock, items, archive] = await Promise.all([
      convexQuery('materials:getAvailable'),
      convexQuery('craftItems:getAll'),
      convexQuery('archive:getAll'),
    ]);
    state.stock      = stock  || [];
    state.craftItems = items  || [];
    state.archive    = archive|| [];
    updateLiveView();
  } catch(e) { if(!silent) console.warn('Refresh:', e.message); }
}
function startPolling() { refreshAll(); pollTimer=setInterval(()=>refreshAll(true),5000); }
function stopPolling()  { if(pollTimer) clearInterval(pollTimer); }

function updateLiveView() {
  if (currentPage==='materials') {
    const av=state.stock.filter(m=>m.status==='available');
    const t=document.getElementById('mat-table'); if(t) t.innerHTML=renderMatTable(av);
    const s=document.getElementById('mat-count'); if(s) s.textContent=`${av.length} entr${av.length===1?'y':'ies'} in stock`;
  }
  if (currentPage==='items') {
    const el=document.getElementById('items-list'); if(el) el.innerHTML=renderItemsList();
    const s=document.getElementById('items-count'); if(s) s.textContent=`${state.craftItems.length} item${state.craftItems.length!==1?'s':''} defined`;
  }
  if (currentPage==='archive') {
    const el=document.getElementById('archive-table'); if(el) el.innerHTML=renderArchiveTable();
  }
  if (currentPage==='craft' && craftState.itemId) recomputePlan();
}

// ─── ROUTER ───────────────────────────────────────────────────────────────────
function goTo(tab) { currentPage=tab; renderNav(); renderPage(); }

// ─── SETUP ────────────────────────────────────────────────────────────────────
function showSetup() {
  stopPolling();
  document.getElementById('root').innerHTML = `
    <div class="center-screen">
      <div class="auth-box" style="max-width:480px;">
        <div class="auth-logo">MATTRACK</div>
        <div style="font-size:13px;color:#555;margin-bottom:24px;text-align:center;">Connect to your Convex backend.</div>
        <div class="field">
          <label class="lbl">Convex Deployment URL</label>
          <input type="text" id="setup-url" placeholder="https://happy-animal-123.convex.cloud" value="${esc(CONVEX_URL)}">
        </div>
        <div class="err-msg" id="setup-err"></div>
        <button class="btn btn-black" style="width:100%;justify-content:center;" onclick="saveSetup()">Connect</button>
        <div class="setup-note">
          <strong>How to get your URL:</strong><br>
          1. In the <code>material-tracker/</code> folder run:<br>
          <div class="code-block">npm install &amp;&amp; npx convex dev</div>
          2. Copy the <strong>CONVEX_URL</strong> shown in the terminal.<br>
          3. Paste it above and click Connect.
        </div>
      </div>
    </div>`;
  document.getElementById('setup-url').addEventListener('keydown', e=>{ if(e.key==='Enter') saveSetup(); });
}

async function saveSetup() {
  const url = document.getElementById('setup-url').value.trim().replace(/\/$/,'');
  if (!url.startsWith('https://')) { showErr('setup-err','URL must start with https://'); return; }
  try {
    document.getElementById('setup-err').style.display='none';
    await fetch(`${url}/api/query`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:'materials:getCatalog',args:{},format:'json'})});
    CONVEX_URL=url; localStorage.setItem('mattrack_url',url);
    await convexMutation('materials:seedCatalog');
    showAuth();
  } catch(e) { showErr('setup-err','Could not connect. Check the URL.'); }
}

// ─── AUTH ─────────────────────────────────────────────────────────────────────
function showAuth(tab='signin') {
  stopPolling();
  document.getElementById('root').innerHTML = `
    <div class="center-screen">
      <div class="auth-box">
        <div class="auth-logo">MATTRACK</div>
        <div class="tabs">
          <button class="tab-btn${tab==='signin'?' active':''}" onclick="showAuth('signin')">Sign In</button>
          <button class="tab-btn${tab==='signup'?' active':''}" onclick="showAuth('signup')">Sign Up</button>
        </div>
        ${tab==='signin'?`
          <div class="field"><label class="lbl">Username</label><input id="si-user" type="text" autocomplete="username" placeholder="username"></div>
          <div class="field"><label class="lbl">Password</label><input id="si-pass" type="password" autocomplete="current-password" placeholder="password"></div>
          <div class="err-msg" id="si-err"></div>
          <button class="btn btn-black" style="width:100%;justify-content:center;" onclick="doSignIn()">Sign In</button>
          <div style="margin-top:12px;font-size:11px;color:#999;text-align:center;">
            Wrong URL? <span style="cursor:pointer;text-decoration:underline;" onclick="showSetup()">Change setup</span>
          </div>
        `:`
          <div class="field"><label class="lbl">Username</label><input id="su-user" type="text" placeholder="choose a username"></div>
          <div class="field"><label class="lbl">Password</label><input id="su-pass" type="password" placeholder="create a password"></div>
          <div class="field">
            <label class="lbl">Roles</label>
            <label class="chk-row"><input type="checkbox" id="su-prov" checked><span>Material Provider — add &amp; manage stock</span></label>
            <label class="chk-row"><input type="checkbox" id="su-craft"><span>Crafter — use materials to craft items</span></label>
          </div>
          <div class="err-msg" id="su-err"></div>
          <button class="btn btn-black" style="width:100%;justify-content:center;" onclick="doSignUp()">Create Account</button>
        `}
      </div>
    </div>`;
  setTimeout(()=>{
    const p=document.getElementById(tab==='signin'?'si-pass':'su-pass');
    if(p) p.addEventListener('keydown',e=>{if(e.key==='Enter') tab==='signin'?doSignIn():doSignUp();});
  },0);
}

async function doSignIn() {
  const username=(document.getElementById('si-user')||{value:''}).value.trim();
  const password=(document.getElementById('si-pass')||{value:''}).value;
  if(!username||!password){showErr('si-err','Fill in all fields');return;}
  try {
    const ph=await hashPwd(password);
    const user=await convexQuery('users:authenticate',{username,passwordHash:ph});
    if(!user){showErr('si-err','Invalid username or password');return;}
    state.user=user; localStorage.setItem('mattrack_uid',user._id); showApp();
  } catch(e){showErr('si-err',e.message);}
}

async function doSignUp() {
  const username=(document.getElementById('su-user')||{value:''}).value.trim();
  const password=(document.getElementById('su-pass')||{value:''}).value;
  const isProv=(document.getElementById('su-prov')||{checked:true}).checked;
  const isCraft=(document.getElementById('su-craft')||{checked:false}).checked;
  if(!username||!password){showErr('su-err','Fill in all fields');return;}
  if(!isProv&&!isCraft){showErr('su-err','Select at least one role');return;}
  try {
    const ph=await hashPwd(password);
    const roles=[...(isProv?['provider']:[]),...(isCraft?['crafter']:[])];
    const user=await convexMutation('users:signUp',{username,passwordHash:ph,roles});
    await convexMutation('archive:addLog',{type:'user_joined',userId:user._id,userName:username,details:{roles}});
    state.user=user; localStorage.setItem('mattrack_uid',user._id); showApp();
  } catch(e){
    showErr('su-err',e.message.includes('USERNAME_TAKEN')?'Username already taken':e.message);
  }
}

async function doLogout() { stopPolling(); state.user=null; localStorage.removeItem('mattrack_uid'); showAuth(); }

// ─── APP SHELL ────────────────────────────────────────────────────────────────
function showApp() {
  document.getElementById('root').innerHTML=`<div id="nav"></div><div id="page-wrap"></div>`;
  renderNav(); renderPage(); startPolling();
}
function renderNav() {
  const u=state.user; if(!u) return;
  const tabs=[['materials','Materials'],['craft','Craft'],['items','Items'],['archive','Log']];
  document.getElementById('nav').innerHTML=`
    <div class="brand">MATTRACK</div>
    ${tabs.map(([id,lbl])=>`<div class="nav-item${currentPage===id?' active':''}" onclick="goTo('${id}')">${lbl}</div>`).join('')}
    <div class="user-area">
      <span class="live-dot"></span>
      <span style="font-weight:700;">${esc(u.username)}</span>

async function addMaterial() {
  const u=state.user;
  const category=(document.getElementById('mat-cat-sel')||{value:'Ores'}).value;
  let name=(document.getElementById('mat-name-sel')||{value:''}).value;
  let unit=category==='Gems'?'UNIT':'SCU';

    name=(document.getElementById('mat-new-name')||{value:''}).value.trim();
    if(!name){alert('Enter material name');return;}
  } else if (!name) {
    alert('Select a material'); return;
  } else {
    const entry=catLookup(name);
    if(entry){ unit=entry.unit; }
  }
  const qual=parseInt((document.getElementById('mat-quality')||{value:''}).value);
  const qty=parseFloat((document.getElementById('mat-qty')||{value:''}).value);
  const system=(document.getElementById('mat-system')||{value:''}).value;
  const location=(document.getElementById('mat-location')||{value:''}).value;
  if(!name||isNaN(qual)||isNaN(qty)||!system||!location){alert('Fill in all fields');return;}
  if(qual<0||qual>1000){alert('Quality must be 0–1000');return;}
  if(qty<=0){alert('Quantity must be greater than 0');return;}
  try {
    if(!SC_CATALOG.find(m=>m.name===name))
      await convexMutation('materials:addToCatalog',{name,category,unit});
    await convexMutation('materials:add',{materialName:name,category,unit,quality:qual,quantity:qty,system,location,ownerId:u._id,ownerName:u.username});

let _planTimer=null;
function schedulePlan(){ clearTimeout(_planTimer); _planTimer=setTimeout(recomputePlan,300); }

function recomputePlan() {
  if(!craftState.itemId) return;
  const item=state.craftItems.find(i=>i._id===craftState.itemId); if(!item) return;
  if(craftState.mode==='range'){
    craftState.qMin=parseInt((document.getElementById('q-min')||{value:'0'}).value)||0;
    craftState.qMax=parseInt((document.getElementById('q-max')||{value:'1000'}).value)||1000;
  } else {
    craftState.qMin=0; craftState.qMax=1000; // best mode uses per-material threshold
  }
  const qty=Math.max(1,parseInt((document.getElementById('craft-qty')||{value:'1'}).value)||1);
  craftState.quantity=qty;
  craftState.plan=calcPlan(item,state.stock,craftState.mode,craftState.qMin,craftState.qMax,qty);
  // Update MAX button with live count
  const maxCount=calcMaxCrafts(item,state.stock,craftState.mode,craftState.qMin,craftState.qMax);
  const maxBtn=document.getElementById('max-btn');
  if(maxBtn) maxBtn.textContent=maxCount>0?`↑ MAX (${maxCount})`:'↑ MAX';
  const sa=document.getElementById('craft-summary-area'); if(sa) sa.innerHTML=renderCraftSummary(craftState.plan,maxCount);
  const da=document.getElementById('craft-detail-area'); if(da) da.innerHTML=renderCraftDetail(craftState.plan);
}

// Calculate max complete crafts available with current quality filter
function calcMaxCrafts(item, stock, mode, qMin, qMax) {
  if(!item.requirements.length) return 0;
  let maxCrafts = Infinity;
  for(const req of item.requirements){
    let pool=stock.filter(m=>m.materialName===req.materialName&&m.status==='available');
    if(mode==='range') {
      pool=pool.filter(m=>m.quality>=qMin&&m.quality<=qMax);
    } else {
      // best mode: within 50 of the best in this pool
      const best=pool.length>0?Math.max(...pool.map(m=>m.quality)):0;
      pool=pool.filter(m=>m.quality>=best-50);
    }
    const totalAvail=pool.reduce((s,m)=>s+m.quantity,0);
    if(req.quantity>0) maxCrafts=Math.min(maxCrafts, Math.floor(totalAvail/req.quantity));
    else maxCrafts=0;
  }
  return maxCrafts===Infinity?0:Math.max(0,maxCrafts);
}

function setMaxCrafts() {
  if(!craftState.itemId){ toast('Select an item first.'); return; }
  const item=state.craftItems.find(i=>i._id===craftState.itemId); if(!item) return;
  if(craftState.mode==='range'){
    craftState.qMin=parseInt((document.getElementById('q-min')||{value:'0'}).value)||0;
    craftState.qMax=parseInt((document.getElementById('q-max')||{value:'1000'}).value)||1000;
  }
  const max=calcMaxCrafts(item,state.stock,craftState.mode,craftState.qMin,craftState.qMax);
  if(max<=0){ toast('Not enough materials for even 1 craft with current quality settings.'); return; }
  const el=document.getElementById('craft-qty');
  if(el) el.value=max;
  craftState.quantity=max;
  recomputePlan();
}

function calcPlan(item, stock, mode, qMin, qMax, quantity=1) {
  const plan={item,quantity,canCraft:true,requirements:[],avgQuality:0,_qSum:0,_qUsed:0};
  for(const req of item.requirements){
    const totalNeeded=req.quantity*quantity;
    let pool=stock.filter(m=>m.materialName===req.materialName&&m.status==='available');
    if(mode==='range') {
      pool=pool.filter(m=>m.quality>=qMin&&m.quality<=qMax);
    } else {
      // best mode: within 50 of the best in this pool
      const best=pool.length>0?Math.max(...pool.map(m=>m.quality)):0;
      pool=pool.filter(m=>m.quality>=best-50);
    }
    pool.sort((a,b)=>b.quality-a.quality);
    let needed=totalNeeded;
    const batches=[];
    let qSum=0;
    for(const b of pool){
      if(needed<=0) break;
      const use=Math.min(needed,b.quantity);
      batches.push({stockId:b._id,materialName:b.materialName,unit:b.unit,quality:b.quality,quantityUse:use,quantityAvail:b.quantity,system:b.system,location:b.location,ownerName:b.ownerName,ownerId:b.ownerId});
      qSum+=b.quality*use; needed-=use;
    }
    const fulfilled=totalNeeded-needed;
    const avgQ=fulfilled>0?Math.round(qSum/fulfilled):0;
    plan.requirements.push({materialName:req.materialName,unit:req.unit,needed:totalNeeded,fulfilled,shortfall:needed,batches,avgQuality:avgQ,ok:needed<=0.0001});
    if(needed>0.0001) plan.canCraft=false;
    plan._qSum+=qSum; plan._qUsed+=fulfilled;
  }
  plan.avgQuality=plan._qUsed>0?Math.round(plan._qSum/plan._qUsed):0;
  return plan;
}

function qualLabel(q){if(q>=900)return'Exceptional';if(q>=750)return'High';if(q>=500)return'Standard';if(q>=250)return'Low';return'Poor';}

function renderCraftSummary(plan, maxCraftable){
  const ok=plan.canCraft;
  const qty=plan.quantity||1;
  const catLabel=plan.item.category?itemCatLabel(plan.item.category):'';
  const maxStr=maxCraftable!=null?maxCraftable:calcMaxCrafts(plan.item,state.stock,craftState.mode,craftState.qMin,craftState.qMax);
  return `<div class="craft-box${ok?'':' err'}">
    <div style="font-size:22px;font-weight:700;margin-bottom:2px;">${esc(plan.item.name)}</div>
    ${catLabel?`<div style="font-size:11px;color:#999;margin-bottom:14px;">${esc(catLabel)}</div>`:''}
    <div style="font-size:11px;font-weight:700;letter-spacing:.1em;color:${ok?'#000':'var(--red)'};">${ok?`CRAFTABLE &times;${qty}`:'INSUFFICIENT MATERIALS'}</div>
    ${ok?`<div style="font-size:12px;color:#999;margin-top:4px;margin-bottom:16px;">Max craftable with current stock: <strong style="color:#000;">${maxStr}</strong></div>`:''}
    <hr class="thin" style="margin:16px 0;">
    <div style="font-size:10px;font-weight:700;letter-spacing:.1em;color:#999;margin-bottom:4px;text-transform:uppercase;">Avg. Craft Quality</div>
    <div class="q-big">${ok?plan.avgQuality:'—'}</div>
    ${ok?`<div style="font-size:11px;color:#999;margin-top:4px;">${qualLabel(plan.avgQuality)}</div>`:''}
  </div>`;
}

function matCatTag(materialName) {
  const entry=catLookup(materialName);
  if(!entry) return '';
  const label=entry.cat==='Ores'?'ORE':'GEM';
  return `<span style="font-size:10px;font-weight:700;letter-spacing:.06em;border:1.5px solid #000;padding:1px 5px;margin-left:6px;">${label}</span>`;
}

function renderCraftDetail(plan){
  const qty=plan.quantity||1;
  let html=`<hr class="thick">
  <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:24px;">
    Material Requirements &mdash; ${qty}&times; ${esc(plan.item.name).toUpperCase()}
  </div>`;
  for(const req of plan.requirements){
    const clr=req.ok?'#000':'var(--red)';
    html+=`<div style="border-bottom:1px solid #e8e8e8;padding:20px 0;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">
        <div style="font-size:17px;font-weight:700;">${esc(req.materialName)}${matCatTag(req.materialName)}</div>
        <div style="font-size:12px;color:${clr};">${req.ok
          ?`${req.fulfilled}&thinsp;/&thinsp;${req.needed} ${esc(req.unit)} &nbsp;&middot;&nbsp; avg quality <strong>${req.avgQuality}</strong>`
          :`${req.fulfilled}&thinsp;/&thinsp;${req.needed} ${esc(req.unit)} available &mdash; short <strong>${Math.round(req.shortfall*100)/100}</strong>`}</div>
      </div>`;
    if(req.batches.length){
      html+=`<table style="font-size:12px;">
        <thead><tr><th>Quality</th><th>Use</th><th>Available</th><th>System</th><th>Location</th><th>Owner</th></tr></thead>
        <tbody>${req.batches.map(b=>`<tr>
          <td><span class="q">${b.quality}</span></td>
          <td style="font-weight:600;">${b.quantityUse} <span class="unit-inline">${esc(b.unit)}</span></td>
          <td style="color:#999;">${b.quantityAvail} total</td>
          <td>${sysBadge(b.system)}</td>
          <td style="color:#555;">${esc(b.location)}</td>
          <td>${esc(b.ownerName)}</td>
        </tr>`).join('')}</tbody></table>`;
    } else {
      html+=`<div style="font-size:12px;color:var(--red);">No suitable materials found in stock.</div>`;
    }
    html+=`</div>`;
  }
  if(plan.canCraft){
    html+=`<div style="margin-top:28px;padding-top:24px;border-top:1px solid #000;">
      <button class="btn btn-red" onclick="executeCraft()">Mark Materials as Used${qty>1?` (${qty}× craft)`:''}
      </button>
      <div style="font-size:11px;color:#999;margin-top:8px;">Consumes the listed materials and records this craft in the log.</div>
    </div>`;
  }
  return html;
}

async function executeCraft(){
  const plan=craftState.plan; if(!plan||!plan.canCraft) return;
  const qty=plan.quantity||1;
  if(!confirm(`Confirm crafting ${qty>1?qty+'× ':''}"${plan.item.name}"?\n\nThe listed materials will be consumed.`)) return;
  const u=state.user;
  const batches=plan.requirements.flatMap(r=>r.batches.map(b=>({stockId:b.stockId,quantityUse:b.quantityUse})));
  const materialsDetail=plan.requirements.flatMap(r=>r.batches.map(b=>({
    materialName:b.materialName,unit:b.unit,quality:b.quality,quantityUsed:b.quantityUse,
    system:b.system,location:b.location,ownerName:b.ownerName,
  })));
  try {
    await convexMutation('materials:executeCraft',{
      batches,itemName:plan.item.name,avgQuality:plan.avgQuality,
      userId:u._id,userName:u.username,materialsDetail,
    });
    craftState={itemId:null,mode:'best',qMin:850,qMax:1000,quantity:1,plan:null};
    toast('Crafted! Materials logged.');
    await refreshAll();
    goTo('archive');
  } catch(e){alert(e.message);}
}

// ─── ARCHIVE PAGE ─────────────────────────────────────────────────────────────
function pageArchive(){
  return `
    <div class="page-title">LOG</div>
    <div class="page-sub">${state.archive.length} action${state.archive.length!==1?'s':''} recorded</div>
    <div id="archive-table">${renderArchiveTable()}</div>`;
}
function renderArchiveTable(){
  if(!state.archive.length) return `<div class="empty">No actions logged yet.</div>`;
  const labels={crafted:'Crafted',material_added:'Added',material_removed:'Removed',item_created:'New Item',user_joined:'Joined'};
  return `<table>
    <thead><tr><th>Date</th><th>Action</th><th>User</th><th>Details</th></tr></thead>
    <tbody>${state.archive.map(e=>`<tr>
      <td style="font-size:11px;color:#999;white-space:nowrap;">${fmtDT(e._creationTime)}</td>
      <td><span class="badge badge-${e.type}">${labels[e.type]||e.type}</span></td>
      <td style="font-weight:600;font-size:13px;">${esc(e.userName)}</td>
      <td style="font-size:12px;color:#555;">${fmtArchiveDetails(e)}</td>
    </tr>`).join('')}</tbody></table>`;
}
function fmtArchiveDetails(e){
  const d=e.details||{};
  switch(e.type){
    case 'material_added':
      return `${esc(d.materialName)} &middot; ${d.quantity} ${esc(d.unit||'')} &middot; q${d.quality} &middot; ${sysBadge(d.system)}${esc(d.location)}`;
    case 'material_removed':
      return `${esc(d.materialName)} &middot; ${d.quantity} ${esc(d.unit||'')} &middot; ${sysBadge(d.system)}${esc(d.location)}`;
    case 'crafted':
      const lines=(d.materialsUsed||[]).map(m=>`${esc(m.materialName)} &times;${m.quantityUsed}${esc(m.unit||'')} (q${m.quality}, ${esc(m.ownerName)}, ${sysBadge(m.system)}${esc(m.location)})`).join(' | ');
      return `<strong>${esc(d.itemName)}</strong> &middot; avg q${d.avgQuality}<br><span style="font-size:11px;color:#aaa;">${lines}</span>`;
    case 'item_created':
      return `${esc(d.itemName)} &middot; ${(d.requirements||[]).map(r=>`${esc(r.materialName)}&times;${r.quantity}${esc(r.unit||'')}`).join(', ')}`;
    case 'user_joined':
      return `Roles: ${(d.roles||[]).join(', ')}`;
    default: return JSON.stringify(d);
  }
}

// ─── SHARED HELPERS ───────────────────────────────────────────────────────────
function togglePanel(id){
  const el=document.getElementById(id); if(!el) return;
  const wasOpen=el.classList.contains('open');
  el.classList.toggle('open');
  if(!wasOpen&&id==='add-item-panel'){
    const rr=document.getElementById('req-rows'); if(rr){rr.innerHTML='';addReqRow();}
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  if(!CONVEX_URL){showSetup();return;}
  const uid=localStorage.getItem('mattrack_uid');
  if(uid){
    try{
      const user=await convexQuery('users:getById',{userId:uid});
      if(user){state.user=user;showApp();return;}
    }catch(e){/* fall through */}
  }
  showAuth();
}
init();
</script>
