function renderCompCatalogList(lotteryId) {
  let filtered=COMPONENTS_CATALOG;
  if(lotteryCompTypeFilter!=='all') filtered=filtered.filter(c=>c.type===lotteryCompTypeFilter);
  if(lotteryCompSizeFilter!=='all') filtered=filtered.filter(c=>c.size===parseInt(lotteryCompSizeFilter));
  if(lotteryCompGradeFilter!=='all') filtered=filtered.filter(c=>c.tier===lotteryCompGradeFilter);
  if(lotteryCompSearch.trim()) {
    const q=lotteryCompSearch.trim().toLowerCase();
    filtered=filtered.filter(c=>c.name.toLowerCase().includes(q)||c.gradeName.toLowerCase().includes(q));
  }
  if(!filtered.length) return `<div style="padding:20px;font-size:18px;color:var(--fg);">No components match.</div>`;
  return filtered.map(c=>{
    const defVal=compDefaultValue(c);
    const itemId=`${c.type}_${c.name.replace(/\s+/g,'_')}_${c.grade}_${c.size}_${c.tier}`;
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border-m);">
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;">
          <span style="font-size:18px;font-weight:700;color:var(--fg);" class="comp-grade-${c.grade.toLowerCase()}">${esc(c.name)}</span>
          <span style="font-size:18px;color:var(--fg);">S${c.size}<span class="tier-${c.tier.toLowerCase()}"> ${c.tier}</span></span>
        </div>
        <div style="font-size:18px;color:var(--fg);opacity:.7;">${esc(c.typeName)} &middot; ${esc(c.gradeName)}</div>
      </div>
      <input type="number" id="add-val-${esc(itemId)}" value="${defVal}" min="1" style="width:72px;margin:0;padding:4px 6px;font-size:18px;" onclick="event.stopPropagation()">
      <button class="btn btn-black btn-sm" style="white-space:nowrap;" onclick="addLotteryItem('${esc(lotteryId)}','${esc(itemId)}','${esc(c.name)}','${esc(c.type)}','${esc(c.typeName)}','${esc(c.grade)}',${c.size},'${esc(c.tier)}')">Add</button>
    </div>`;
  }).join('');
}

function renderLotteryOpenDetail(l, myPick) {
  const u=state.user;
  const pkgs=l.packages||[];
  const pickedCount=pkgs.filter(p=>p.pickedBy).length;

  return `
    <div style="margin-bottom:24px;padding:20px;background:var(--bg2);border-left:4px solid #22c55e;">
      <div style="font-size:18px;font-weight:700;">Lottery is open! ${pickedCount}/${pkgs.length} packages claimed.</div>
      ${myPick?`<div style="margin-top:6px;font-size:18px;color:#22c55e;">You have claimed Package ${myPick.pkgId.replace('pkg_','#')} (value: ${myPick.totalValue.toLocaleString()} pts)</div>`
        :`<div style="margin-top:6px;font-size:18px;">Pick any available package below.</div>`}
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;">
      ${pkgs.map(pkg=>renderPackageCard(pkg,l,myPick,false)).join('')}
    </div>`;
}

function renderLotteryClosedDetail(l) {
  const pkgs=l.packages||[];
  const pickedCount=pkgs.filter(p=>p.pickedBy).length;

  return `
    <div style="margin-bottom:24px;padding:20px;background:var(--bg2);border-left:4px solid #555;">
      <div style="font-size:18px;font-weight:700;">Lottery closed. ${pickedCount}/${pkgs.length} packages were claimed.</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;">
      ${pkgs.map(pkg=>renderPackageCard(pkg,l,null,true)).join('')}
    </div>`;
}

function renderPackageCard(pkg, lottery, myPick, readOnly) {
  const u=state.user;
  const isPicked=!!pkg.pickedBy;
  const isMine=pkg.pickedBy===u._id;
  const canPick=!readOnly&&lottery.status==='open'&&!isPicked&&!myPick;

  return `<div class="pkg-card${isMine?' mine':isPicked?' picked':''}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
      <div>
        <span style="font-size:20px;font-weight:900;">Package ${pkg.pkgId.replace('pkg_','#')}</span>
        <span style="font-size:18px;margin-left:8px;font-weight:700;">${pkg.totalValue.toLocaleString()} pts</span>
      </div>
      ${isMine?`<span style="font-size:18px;font-weight:700;color:#22c55e;">✓ Yours</span>`:''}
      ${isPicked&&!isMine?`<span style="font-size:18px;color:var(--fg);">claimed by <strong>${esc(pkg.pickedByName||'?')}</strong></span>`:''}
    </div>
    <div style="margin-bottom:10px;">
      ${pkg.items.map(item=>`
        <div class="pkg-item-row">
          <span style="font-size:18px;color:var(--fg);min-width:70px;font-size:9px;" class="comp-type-badge">${esc(item.typeName)}</span>
          <span style="font-weight:700;flex:1;font-size:18px;" class="comp-grade-${item.grade.toLowerCase()}">${esc(item.name)}</span>
          <span style="font-size:18px;color:var(--fg);">S${item.size}<span class="tier-${item.tier.toLowerCase()}"> ${item.tier}</span></span>
          <span style="font-size:18px;color:var(--fg);">${item.value} pts</span>
        </div>`).join('')}
    </div>
    ${canPick?`<button class="btn btn-black" style="width:100%;justify-content:center;" onclick="doPickPackage('${esc(lottery._id)}','${esc(pkg.pkgId)}')">Pick this Package</button>`:''}
  </div>`;
}

function setLotCompType(lotteryId, t) {
  lotteryCompTypeFilter=t;
  // Reset sub-filters when type changes
  lotteryCompSizeFilter='all';
  lotteryCompGradeFilter='all';
  lotteryCompSearch='';
  // Re-render the right panel only by re-rendering the full detail page
  const pw=document.getElementById('page-wrap');
  if(pw) pw.innerHTML=`<div class="page">${pageLottery()}</div>`;
}
function setLotCompSize(lotteryId, s) {
  lotteryCompSizeFilter=s;
  const pw=document.getElementById('page-wrap');
  if(pw) pw.innerHTML=`<div class="page">${pageLottery()}</div>`;
}
function setLotCompGrade(lotteryId, g) {
  lotteryCompGradeFilter=g;
  const pw=document.getElementById('page-wrap');
  if(pw) pw.innerHTML=`<div class="page">${pageLottery()}</div>`;
}

function backToLotteryList() {
  lotteryView='list'; lotteryDetailId=null; renderPage();
}

function openCreateLotteryModal() {
  showModal(`
    <div class="modal-title">New Lottery</div>
    <div class="field">
      <label class="lbl">Title</label>
      <input type="text" id="nl-title" placeholder="e.g. Weekly Component Drop" autofocus>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-black" onclick="confirmCreateLottery()">Create</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>`);
}

async function confirmCreateLottery() {
  const title=(document.getElementById('nl-title')||{value:''}).value.trim();
  if(!title){alert('Enter a lottery title');return;}
  try {
    const id=await convexMutation('lotteries:create',{sessionToken:state.sessionToken,title});
    closeModal();
    toast('Lottery created');
    await refreshAll();
    lotteryDetailId=id;
    lotteryView='detail';
    renderPage();
  } catch(e){alert(e.message);}
}

async function addLotteryItem(lotteryId, itemId, name, type, typeName, grade, size, tier) {
  const valEl=document.getElementById('add-val-'+itemId);
  const value=parseInt(valEl?valEl.value:'100')||100;
  const item={id:itemId+'_'+Date.now(),name,type,typeName,grade,size:parseInt(size),tier,value};
  try {
    await convexMutation('lotteries:addItem',{sessionToken:state.sessionToken,lotteryId,item});
    toast(`${name} added`);
    await refreshAll();
    // Re-render the detail page in place
    const pw=document.getElementById('page-wrap');
    if(pw) pw.innerHTML=`<div class="page">${pageLottery()}</div>`;
  } catch(e){alert(e.message);}
}

async function removeLotteryItem(lotteryId, itemId) {
  try {
    await convexMutation('lotteries:removeItem',{sessionToken:state.sessionToken,lotteryId,itemId});
    await refreshAll();
    const pw=document.getElementById('page-wrap');
    if(pw) pw.innerHTML=`<div class="page">${pageLottery()}</div>`;
  } catch(e){alert(e.message);}
}

async function updateItemValue(lotteryId, itemId, rawVal) {
  const value=parseInt(rawVal)||1;
  try {
    await convexMutation('lotteries:updateItemValue',{sessionToken:state.sessionToken,lotteryId,itemId,value});
    await refreshAll();
    // Don't re-render whole page — just update the state silently
  } catch(e){alert(e.message);}
}

async function doGeneratePackages(lotteryId) {
  const n=parseInt((document.getElementById('pkg-count')||{value:'2'}).value)||2;
  if(n<2||n>20){alert('Package count must be 2–20');return;}
  try {
    await convexMutation('lotteries:generatePackages',{sessionToken:state.sessionToken,lotteryId,packageCount:n});
    toast(`${n} packages generated`);
    await refreshAll();
    const pw=document.getElementById('page-wrap');
    if(pw) pw.innerHTML=`<div class="page">${pageLottery()}</div>`;
  } catch(e){alert(e.message);}
}

async function confirmOpenLottery(lotteryId) {
  if(!confirm('Open this lottery for member picking? This will make it visible to all.')) return;
  try {
    await convexMutation('lotteries:openLottery',{sessionToken:state.sessionToken,lotteryId});
    toast('Lottery opened');
    await refreshAll();
    renderPage();
  } catch(e){alert(e.message);}
}

async function confirmCloseLottery(lotteryId) {
  if(!confirm('Close this lottery? Members will no longer be able to pick packages.')) return;
  try {
    await convexMutation('lotteries:closeLottery',{sessionToken:state.sessionToken,lotteryId});
    toast('Lottery closed');
    await refreshAll();
    renderPage();
  } catch(e){alert(e.message);}
}

async function confirmBackToDraft(lotteryId) {
  if(!confirm('Revert to draft? This will clear all picks.')) return;
  try {
    await convexMutation('lotteries:backToDraft',{sessionToken:state.sessionToken,lotteryId});
    toast('Reverted to draft');
    await refreshAll();
    renderPage();
  } catch(e){alert(e.message);}
}

async function doPickPackage(lotteryId, pkgId) {
  if(!confirm('Pick this package? You can only pick once.')) return;
  try {
    await convexMutation('lotteries:pickPackage',{sessionToken:state.sessionToken,lotteryId,pkgId});
    toast('Package picked! 🎉');
    await refreshAll();
    renderPage();
  } catch(e){alert(e.message);}
}

async function deleteLottery(lotteryId) {
  if(!confirm('Delete this lottery? This cannot be undone.')) return;
  try {
    await convexMutation('lotteries:remove',{sessionToken:state.sessionToken,lotteryId});
    toast('Lottery deleted');
    lotteryView='list'; lotteryDetailId=null;
    await refreshAll();
    renderPage();
  } catch(e){alert(e.message);}
}

async function claimBootstrapAdmin() {
  if(hasAdmin()) { toast('An admin already exists.'); renderNav(); return; }
  if(!confirm(`Claim admin role for "${state.user.username}"? This is only possible while no admins exist.`)) return;
  try {
    const updated=await convexMutation('users:claimBootstrapAdmin',{sessionToken:state.sessionToken});
    state.user=updated;
    toast('Admin role claimed!');
    await refreshAll();
    goTo('admin');
  } catch(e){
    if(e.message.includes('ADMIN_EXISTS')) toast('An admin already exists — cannot claim.');
    else alert(e.message);
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  if(!CONVEX_URL){showSetup();return;}
  const token=localStorage.getItem('mattrack_token');
  if(token){
    try{
      const user=await convexQuery('sessions:whoami',{token});
      if(user){state.user=user;state.sessionToken=token;showApp();return;}
    }catch(e){/* fall through */}
  }
  localStorage.removeItem('mattrack_token');
  showAuth();
}
init();

/* ── OMA-STYLE FIXED NAV — exact spec implementation ─────────────── */
(function(){
  const SCROLL_RANGE  = 100;   // px of scroll to reach full translation
  const TRANSLATE_CAP = 0.9;   // 90% up → bottom 10% sliver always visible

  /* nav-primary item height (vw-based, remeasured on resize) */
  let ITEM_H      = 0;
  let MAX_TRANSLATE = 0;

  /* ── measure & lock the primary-nav height ──────────────────────── */
  function setup(updateMargin=true){
    const primary  = document.getElementById('nav-primary');
    const pageWrap = document.getElementById('page-wrap');
    const nav      = document.getElementById('nav');
    if(!primary || !pageWrap || !nav) return;

    /* unlock height so we can remeasure after re-render */
    primary.style.height = '';
    const item = primary.querySelector('.nav-main');
    ITEM_H       = item ? item.offsetHeight : 120;
    MAX_TRANSLATE = ITEM_H * TRANSLATE_CAP;

    /* lock nav-primary to measured height so overflow:hidden clips correctly */
    primary.style.height = ITEM_H + 'px';

    /* push page content below the entire fixed nav — only on first load & resize
       to avoid a vertical jump whenever subnav changes between sections */
    if(updateMargin || !pageWrap.style.marginTop){
      pageWrap.style.marginTop = nav.offsetHeight + 'px';
    }
  }

  /* ── scroll handler (rAF-throttled, direction-aware) ────────────── */
  let lastScrollY = window.scrollY;
  let ticking     = false;

  function update(){
    const scrollY  = window.scrollY;
    const progress = Math.min(scrollY / SCROLL_RANGE, 1);
    const translateY  = progress * MAX_TRANSLATE;

    /* inactive .nav-main items: translate up, clip in overflow:hidden */
    const primary = document.getElementById('nav-primary');
    if(primary){
      primary.querySelectorAll('.nav-main').forEach(el => {
        el.style.transition = 'none';
        el.style.transform  = el.classList.contains('active')
          ? 'translate(0px,0px)'
          : `translate(0px,-${translateY}px)`;
      });
    }

    /* topbar + subnav: fade out (doesn't affect layout) */
    const topbar = document.getElementById('nav-topbar');
    const sub    = document.getElementById('nav-sub');
    const alpha  = 1 - progress;
    if(topbar){ topbar.style.opacity = alpha; topbar.style.pointerEvents = progress > 0.5 ? 'none' : ''; }
    if(sub)   { sub.style.opacity    = alpha; sub.style.pointerEvents    = progress > 0.5 ? 'none' : ''; }

    lastScrollY = scrollY;
    ticking     = false;
  }

  window.addEventListener('scroll', () => {
    if(!ticking){ requestAnimationFrame(update); ticking = true; }
  }, { passive: true });

  window.addEventListener('resize', () => { setup(true); update(); }, { passive: true });

  /* called by renderNav() after every re-render — re-syncs transforms but does NOT
     recalculate margin-top (that would shift the page on every navigation) */
  window._navScrollUpdate = function(){ setup(false); update(); };
})();
</script>
