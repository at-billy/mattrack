function searchGet(scope){ return SEARCH[scope] || (SEARCH[scope]={active:false,text:''}); }
function searchReset(scope){ SEARCH[scope]={active:false,text:''}; }
function searchMatch(scope,...fields){ const q=(searchGet(scope).text||'').trim().toLowerCase(); if(!q) return true; return fields.some(f=>String(f==null?'':f).toLowerCase().includes(q)); }
function searchToggle(scope,rerender){ const st=searchGet(scope); st.active=!st.active; if(!st.active) st.text=''; rerender(); const i=document.getElementById('search-'+scope); if(i) i.focus(); }
function searchType(scope,val,rerenderList){ searchGet(scope).text=val; rerenderList(); const i=document.getElementById('search-'+scope); if(i){ i.focus(); try{i.setSelectionRange(val.length,val.length);}catch(e){} } }
// Renders the controls row (filter buttons + Search toggle) and, when open, the input.
function searchBar(scope, filtersHtml, placeholder, onToggle, onInput){
  const st=searchGet(scope);
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--space-4);align-items:center;">
      ${filtersHtml||''}
      <div style="flex:1;"></div>
      <button class="btn-ghost btn-sm${st.active?' active':''}" onclick="${onToggle}">${st.active?'Close Search':'Search'}</button>
    </div>${st.active?`<div style="margin-bottom:20px;"><input id="search-${scope}" type="text" placeholder="${esc(placeholder||'Search…')}" value="${esc(st.text)}" style="width:100%;max-width:400px;" oninput="${onInput}"></div>`:''}`;
}

// ── per-page filter + sort state ──
let pkF='open', pkSortCol='location', pkSortDir='asc';   // Pickup
let trF='open', trSortCol='stage', trSortDir='asc';      // Transfers
let cfF='open';                                          // Crafting — admin order filter
let cfInvF='available', cfInvSortCol='name', cfInvSortDir='asc'; // Crafting — crafter inventory
let dsF='instock', dsSortCol='name', dsSortDir='asc';    // Distribution
function setWoView(v){ woView=v; pkF='open'; trF='open'; cfF='open'; cfInvF='available'; dsF='instock'; searchReset('wo'); renderNav(); renderPage(); }
function reWoBody(){ const l=document.getElementById('wo-list'); if(l) l.innerHTML=renderWoListActive(); const d=document.getElementById('wo-dist'); if(d) d.innerHTML=renderDistribution(); }
function toggleWoSearch(){ searchToggle('wo', rerenderWo); }
function woSearchInput(v){ searchType('wo', v, reWoBody); }
function setPkF(f){ pkF=f; rerenderWo(); }
function setTrF(f){ trF=f; rerenderWo(); }
function setCfF(f){ cfF=f; rerenderWo(); }
function setCfInvF(f){ cfInvF=f; rerenderWo(); }
function setDsF(f){ dsF=f; rerenderWo(); }
function setPkSort(c){ if(pkSortCol===c) pkSortDir=(pkSortDir==='asc'?'desc':'asc'); else { pkSortCol=c; pkSortDir='asc'; } reListWo(); }
function setTrSort(c){ if(trSortCol===c) trSortDir=(trSortDir==='asc'?'desc':'asc'); else { trSortCol=c; trSortDir='asc'; } reListWo(); }
function setCfInvSort(c){ if(cfInvSortCol===c) cfInvSortDir=(cfInvSortDir==='asc'?'desc':'asc'); else { cfInvSortCol=c; cfInvSortDir='asc'; } reListWo(); }
function setDsSort(c){ if(dsSortCol===c) dsSortDir=(dsSortDir==='asc'?'desc':'asc'); else { dsSortCol=c; dsSortDir='asc'; } const l=document.getElementById('wo-dist'); if(l) l.innerHTML=renderDistribution(); }
function reListWo(){ const l=document.getElementById('wo-list'); if(l) l.innerHTML=renderWoListActive(); }
function rerenderWo(){
  const c=document.getElementById('wo-controls'); if(c) c.innerHTML=renderWoControls();
  reListWo();
  const d=document.getElementById('wo-dist'); if(d) d.innerHTML=renderDistribution();
}

// ── shared workorder actions ──
async function woAccept(id){ try{ await convexMutation('workorders:claim',{sessionToken:state.sessionToken,id}); toast('Accepted — agreed to collect'); await refreshAll(); renderPage(); }catch(e){ notifyError(e); } }
async function woComplete(id){
  const wo=state.workorders.find(w=>w._id===id); const k=wo?wo.kind:'';
  const msg = k==='delivery' ? 'Confirm you received these materials? They move to At Base, held by you.'
            : k==='move' ? 'Confirm you collected these finished goods from the crafter? They move into your hold and a distribution delivery is created.'
            : k==='distribution' ? 'Confirm you received these finished goods? They move into your stockpile.'
            : 'Confirm you met the gatherer and collected these materials? They move into your hold and a delivery is created for crafters.';
  if(!await confirmModal(msg)) return;
  const done = k==='delivery'?'Received at base':k==='move'?'Collected — distribution delivery created':k==='distribution'?'Received into stockpile':'Collected';
  try{ await convexMutation('workorders:complete',{sessionToken:state.sessionToken,id}); toast(done); await refreshAll(); renderPage(); }catch(e){ notifyError(e); }
}
async function woAbandon(id){ if(!await confirmModal('Abandon this? It goes back to open for someone else.')) return; try{ await convexMutation('workorders:unclaim',{sessionToken:state.sessionToken,id}); toast('Released'); await refreshAll(); renderPage(); }catch(e){ notifyError(e); } }
async function woDelete(id){ if(!await confirmModal('Delete this workorder permanently?')) return; try{ await convexMutation('workorders:remove',{sessionToken:state.sessionToken,id}); toast('Deleted'); await refreshAll(); renderPage(); }catch(e){ notifyError(e); } }

// ── Craft orders (the crafter's task) ──
function craftMatQ(s){ return s.qualityStep!=null?s.qualityStep:(s.qualityValue!=null?s.qualityValue:0); }
function craftAvail(item, order){
  if(!item||!item.recipe||!item.recipe.length) return 0;
  const u=state.user;
  const minQ=(order&&order.minQuality!=null)?order.minQuality:1, maxQ=(order&&order.maxQuality!=null)?order.maxQuality:10;
  const myMats=state.stock.filter(s=>s.kind==='material'&&s.status==='at_base'&&s.heldBy===u.username&&craftMatQ(s)>=minQ&&craftMatQ(s)<=maxQ);
  return Math.floor(Math.min(...item.recipe.map(r=>{ const have=myMats.filter(s=>s.name===r.materialName).reduce((a,s)=>a+s.qty,0); return r.qty>0?(have+1e-9)/r.qty:Infinity; })));
}
function qualityRangeLabel(o){
  if(o.minQuality!=null&&o.maxQuality!=null) return o.minQuality===o.maxQuality?qBandLabel(o.minQuality):`${qBandLabel(o.minQuality)} – ${qBandLabel(o.maxQuality)}`;
  if(o.minQuality!=null) return `${qBandLabel(o.minQuality)} and up`;
  if(o.maxQuality!=null) return `up to ${qBandLabel(o.maxQuality)}`;
  return 'any quality';
}
function craftersLabel(o){
  const names=(o.crafters||[]).map(c=>c.userName).join(', '); const n=(o.crafters||[]).length;
  if(o.maxCrafters!=null) return `${n}/${o.maxCrafters} crafter${o.maxCrafters===1?'':'s'}${names?' — '+esc(names):''}`;
  return names?`${n} on it — ${esc(names)}`:'no crafters yet';
}
// Admin's demand list (the craft orders). Crafters don't see this — they craft
// via the Craft modal off their own inventory page.
function renderCraftOrders(){
  const u=state.user;
  let orders=state.workorders.filter(w=>w.kind==='craft'&&w.status===cfF&&searchMatch('wo', w.itemName, w.priority));
  orders=orders.sort((a,b)=>((CRAFT_PRIO[a.priority]??2)-(CRAFT_PRIO[b.priority]??2))||(b._creationTime-a._creationTime));
  if(!orders.length) return `<div class="empty">No ${cfF==='open'?'open':'completed'} craft orders${searchGet('wo').text?' match your search':(cfF==='open'&&isAdmin(u)?' — add one above':'')}.</div>`;
  return `<div>${orders.map(o=>{
    const item=state.catalog.items.find(it=>it.name===o.itemName);
    const recipe=item?item.recipe:[];
    const recipeHtml=recipe.length?recipe.map(r=>`${esc(r.materialName)} ×${r.qty}`).join(', '):'<span style="color:var(--red);">no recipe</span>';
    return `<div style="padding:var(--space-4) 0;border-bottom:1px solid var(--border-m);display:flex;gap:var(--space-4);flex-wrap:wrap;align-items:flex-start;">
      <div style="flex:1;min-width:240px;">
        <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;">
          ${priorityTag(o.priority)}
          <span style="font-weight:900;font-size:var(--text-md);">${esc(o.itemName||'—')}</span>
          <span style="font-size:var(--text-sm);color:var(--fg);">${o.qtyDone||0}/${o.qtyNeeded||0} done${o.status==='done'?' · complete':''}</span>
        </div>
        <div style="font-size:var(--text-sm);color:var(--fg);margin-top:var(--space-1);">Recipe: ${recipeHtml}</div>
        <div style="font-size:var(--text-sm);color:var(--mid);margin-top:var(--space-1);">Materials ${qualityRangeLabel(o)} &middot; ${craftersLabel(o)}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;">
        ${(isAdmin(u)||o.createdBy===u._id)?`<button class="btn-del" onclick="woDelete('${esc(o._id)}')" aria-label="Delete">&times;</button>`:''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

// Crafter's own page: the items they've crafted. "Send" hands them to logistics
// (the Move leg), who deliver them to a distributor.
function renderCraftInventory(){
  const u=state.user;
  const locked=lockedStockSet();
  let rows=state.stock.filter(s=>s.kind==='item'&&s.status==='crafted'&&(isAdmin(u)||s.heldBy===u.username)&&searchMatch('wo', s.name, s.location, s.heldBy));
  rows = cfInvF==='shipping' ? rows.filter(s=>locked.has(s._id)) : rows.filter(s=>!locked.has(s._id));
  const val=(s,c)=>{ switch(c){ case 'qty':return s.qty||0; case 'quality':return s.qualityValue!=null?s.qualityValue:-1; case 'location':return s.location||''; case 'heldby':return s.heldBy||''; default:return s.name||''; } };
  rows=[...rows].sort((a,b)=>cmpVals(val(a,cfInvSortCol),val(b,cfInvSortCol),cfInvSortDir));
  if(!rows.length) return `<div class="empty">${cfInvF==='shipping'?'Nothing waiting on logistics right now.':'No finished items yet. Hit “Craft” to make what’s being asked for.'}</div>`;
  const canSend=isCrafter(u)||isAdmin(u);
  const cols=[['name','Item'],['qty','Qty'],['quality','Quality'],['location','Location']].concat(isAdmin(u)?[['heldby','Held By']]:[]);
  return `<table class="cards"><thead><tr>${cols.map(([c,l])=>sortTh('setCfInvSort',cfInvSortCol,cfInvSortDir,c,l)).join('')}<th></th></tr></thead><tbody>${rows.map(s=>`<tr>
    <td data-label="Item" style="font-weight:700;">${esc(s.name)}</td>
    <td data-label="Qty" style="font-weight:700;">${s.qty} <span style="font-weight:400;color:var(--fg);font-size:var(--text-sm);">${esc(s.unit)}</span></td>
    <td data-label="Quality" style="font-size:var(--text-sm);color:var(--fg);">${s.qualityValue!=null?`Q ${s.qualityValue}`:'—'}</td>
    <td data-label="Location" style="font-size:var(--text-md);">${esc(s.location||'—')}${s.system?` <span class="sys-badge">${esc(s.system)}</span>`:''}</td>
    ${isAdmin(u)?`<td data-label="Held By">${esc(s.heldBy)}</td>`:''}
    <td data-label="" style="white-space:nowrap;">${cfInvF==='shipping'?`<span style="font-size:var(--text-sm);color:var(--mid);text-transform:uppercase;letter-spacing:.04em;">With logistics</span>`:(canSend?`<button class="btn btn-black btn-sm" onclick="doSendOne('${esc(s._id)}')">Send</button>`:'')}</td>
  </tr>`).join('')}</tbody></table>`;
}
async function doSendOne(id){
  try{ const out=await convexMutation('workorders:createMove',{sessionToken:state.sessionToken,stockIds:[id]}); toast(`Sent to logistics (${out.sent})`); await refreshAll(); renderPage(); }catch(e){ notifyError(e); }
}

// Crafter's "Craft" button → modal of what's being asked for, craft right there.
function openCraftModal(){
  const orders=state.workorders.filter(w=>w.kind==='craft'&&w.status==='open')
    .sort((a,b)=>((CRAFT_PRIO[a.priority]??2)-(CRAFT_PRIO[b.priority]??2))||(b._creationTime-a._creationTime));
  if(!orders.length){ showModal(`<div class="modal-title">Craft</div><div class="empty">Nothing is being asked for right now.</div><div style="margin-top:14px;"><button class="btn btn-outline" onclick="closeModal()">Close</button></div>`); return; }
  const u=state.user;
  showModal(`
    <div class="modal-title">What's being asked for</div>
    <div style="max-height:60vh;overflow:auto;">${orders.map(o=>{
      const item=state.catalog.items.find(it=>it.name===o.itemName);
      const recipe=item?item.recipe:[];
      const remaining=(o.qtyNeeded||0)-(o.qtyDone||0);
      const avail=Math.min(craftAvail(item,o),remaining);
      const joined=(o.crafters||[]); const isMember=joined.some(c=>c.userId===u._id||c.userName===u.username);
      const full = o.maxCrafters!=null && !isMember && joined.length>=o.maxCrafters;
      const recipeHtml=recipe.length?recipe.map(r=>`${esc(r.materialName)} ×${r.qty}`).join(', '):'<span style="color:var(--red);">no recipe</span>';
      return `<div style="padding:14px 0;border-bottom:1px solid var(--border-m);">
        <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;">${priorityTag(o.priority)}<span style="font-weight:900;">${esc(o.itemName)}</span><span style="font-size:var(--text-sm);color:var(--fg);">${o.qtyDone||0}/${o.qtyNeeded||0} done</span></div>
        <div style="font-size:var(--text-sm);color:var(--fg);margin-top:var(--space-1);">Recipe: ${recipeHtml}</div>
        <div style="font-size:var(--text-sm);color:var(--mid);margin-top:var(--space-1);">Materials ${qualityRangeLabel(o)} &middot; ${craftersLabel(o)}</div>
        ${full
          ? `<div style="font-size:var(--text-sm);color:var(--red);margin-top:var(--space-1);">This order is full — no more crafters can join.</div>`
          : `<div style="font-size:var(--text-sm);color:var(--fg);margin-top:var(--space-1);">You can craft ${avail} now from your materials${o.minQuality!=null||o.maxQuality!=null?` at ${qualityRangeLabel(o)}`:' at base'}</div>
        ${avail>0?`<div style="margin-top:var(--space-2);display:flex;gap:6px;align-items:center;"><input id="cqm-${o._id}" type="number" min="1" max="${avail}" value="1" style="width:72px;"><button class="btn btn-black btn-sm" onclick="doCraftModal('${esc(o._id)}')">Craft</button></div>`:''}`}
      </div>`;
    }).join('')}</div>
    <div style="margin-top:var(--space-3);"><button class="btn btn-outline" onclick="closeModal()">Close</button></div>`);
}
async function doCraftModal(orderId){
  const inp=document.getElementById('cqm-'+orderId); const count=Math.max(1, Number(inp?inp.value:1)||1);
  try{ const out=await convexMutation('workorders:craftItem',{sessionToken:state.sessionToken,orderId,count}); toast(`Crafted ${out.crafted}${out.quality!=null?' · Q'+out.quality:''}`); closeModal(); await refreshAll(); renderPage(); }catch(e){ notifyError(e); }
}
function openCraftOrderModal(){
  const items=[...state.catalog.items].sort((a,b)=>a.name.localeCompare(b.name));
  const qOpts=label=>`<option value="">${label}</option>`+QUALITY_BANDS.map((b,i)=>`<option value="${i+1}">${b}</option>`).join('');
  showModal(`
    <div class="modal-title">New craft order</div>
    <div class="field"><label class="lbl">Item</label><select id="co-item" onchange="coRecipe()">${items.map(it=>`<option value="${esc(it.name)}">${esc(it.name)}</option>`).join('')}</select></div>
    <div id="co-recipe" style="font-size:var(--text-sm);color:var(--mid);margin:-18px 0 var(--space-5);"></div>
    <div class="grid2">
      <div class="field"><label class="lbl">Quantity</label><input id="co-qty" type="number" min="1" value="1"></div>
      <div class="field"><label class="lbl">Priority</label><select id="co-prio"><option value="urgent">Urgent</option><option value="high">High</option><option value="normal" selected>Normal</option><option value="whenever">Whenever</option></select></div>
    </div>
    <div class="grid2">
      <div class="field"><label class="lbl">Max crafters</label><input id="co-max" type="number" min="1" placeholder="no limit"></div>
      <div class="field"><label class="lbl">Material quality</label>
        <div style="display:flex;gap:6px;align-items:center;">
          <select id="co-minq">${qOpts('min')}</select><span style="color:var(--mid);">–</span><select id="co-maxq">${qOpts('max')}</select>
        </div>
      </div>
    </div>
    <div class="err-msg" id="co-err"></div>
    <div style="display:flex;gap:10px;margin-top:var(--space-2);">
      <button class="btn btn-black" onclick="saveCraftOrder()">Create</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>`);
  coRecipe();
}
function coRecipe(){
  const el=document.getElementById('co-recipe'); if(!el) return;
  const name=(document.getElementById('co-item')||{value:''}).value;
  const item=state.catalog.items.find(it=>it.name===name);
  const recipe=item?item.recipe:[];
  el.innerHTML = recipe.length ? `Needs: ${recipe.map(r=>`${esc(r.materialName)} ×${r.qty}`).join(', ')}` : `<span style="color:var(--red);">No recipe on file for this item.</span>`;
}
async function saveCraftOrder(){
  const V=x=>(document.getElementById(x)||{value:''}).value;
  const itemName=V('co-item'); const qtyNeeded=Number(V('co-qty')); const priority=V('co-prio');
  if(!itemName){ showErr('co-err','Pick an item'); return; }
  if(!(qtyNeeded>0)){ showErr('co-err','Quantity must be greater than 0'); return; }
  const args={sessionToken:state.sessionToken,itemName,qtyNeeded,priority};
  if(V('co-max')) args.maxCrafters=Number(V('co-max'));
  if(V('co-minq')) args.minQuality=Number(V('co-minq'));
  if(V('co-maxq')) args.maxQuality=Number(V('co-maxq'));
  if(args.minQuality!=null&&args.maxQuality!=null&&args.minQuality>args.maxQuality){ showErr('co-err','Min quality can’t exceed max quality'); return; }
  try{ await convexMutation('workorders:createCraftOrder',args); toast('Craft order created'); closeModal(); await refreshAll(); renderPage(); }catch(e){ showErr('co-err',e.message); }
}

// ── Page + controls ──
function pageWorkorders(){
  const u=state.user;
  const wa=workViewsAllowed(u);
  if(!wa.length){ currentPage='overview'; return pageOverview(); }
  if(!wa.includes(woView)) woView=wa[0];
  if(woView==='crafting'){
    const amCrafter=isCrafter(u);
    let lead, btn='';
    if(amCrafter){
      lead='Your crafted items';
      btn=`<button class="btn btn-black" onclick="openCraftModal()">Craft</button>${isAdmin(u)?`<button class="btn btn-outline" style="margin-left:var(--space-2);" onclick="openCraftOrderModal()">+ Craft Order</button>`:''}`;
    } else {
      const craftOpen=state.workorders.filter(w=>w.kind==='craft'&&w.status==='open').length;
      lead=`${craftOpen} open craft order${craftOpen===1?'':'s'}`;
      btn=isAdmin(u)?`<button class="btn btn-black" onclick="openCraftOrderModal()">+ Craft Order</button>`:'';
    }
    return `
      <div class="page-head">
        <div class="page-head-left"><div class="page-lead">${lead}</div></div>
        ${btn}
      </div>
      <div id="wo-content" style="margin-top:var(--space-6);">
        <div id="wo-controls">${renderWoControls()}</div>
        <div id="wo-list">${renderWoListActive()}</div>
      </div>`;
  }
  if(woView==='distribution'){
    return `
      <div class="page-head"><div class="page-head-left"><div class="page-lead">Distribution</div></div></div>
      <div id="wo-content" style="margin-top:var(--space-6);">
        <div id="wo-controls">${renderWoControls()}</div>
        <div id="wo-dist">${renderDistribution()}</div>
      </div>`;
  }
  let lead;
  if(woView==='pickup'){
    const n=state.workorders.filter(w=>w.kind==='pickup'&&w.status==='open').length;
    lead=`${n} open pickup${n===1?'':'s'}`;
  } else {
    const n=transferActiveCount();
    lead=`${n} transfer${n===1?'':'s'} in progress`;
  }
  return `
    <div class="page-head">
      <div class="page-head-left"><div class="page-lead">${lead}</div></div>
    </div>
    <div id="wo-content" style="margin-top:var(--space-6);">
      <div id="wo-controls">${renderWoControls()}</div>
      <div id="wo-list">${renderWoListActive()}</div>
    </div>`;
}
function renderWoControls(){
  const u=state.user;
  const b=(setter,cur,id,l)=>`<button class="btn-ghost btn-sm${cur===id?' active':''}" onclick="${setter}('${id}')">${l}</button>`;
  let filters='';
  if(woView==='pickup')     filters=`${b('setPkF',pkF,'open','Open')}${b('setPkF',pkF,'claimed','Accepted')}${b('setPkF',pkF,'done','Done')}`;
  else if(woView==='transfers')  filters=`${b('setTrF',trF,'open','Open')}${b('setTrF',trF,'inprogress','In Progress')}${b('setTrF',trF,'done','Done')}`;
  else if(woView==='crafting')   filters=isCrafter(u)
    ? `${b('setCfInvF',cfInvF,'available','Finished')}${b('setCfInvF',cfInvF,'shipping','Shipping')}`
    : `${b('setCfF',cfF,'open','Open')}${b('setCfF',cfF,'done','Done')}`;
  else if(woView==='distribution') filters=`${b('setDsF',dsF,'available','Available')}${b('setDsF',dsF,'instock','In Stockpile')}${b('setDsF',dsF,'handedout','Handed Out')}`;
  return searchBar('wo', filters, 'Search…', 'toggleWoSearch()', 'woSearchInput(this.value)');
}
function renderWoListActive(){
  if(woView==='pickup') return renderPickupTable();
  if(woView==='transfers') return renderTransfers();
  if(woView==='crafting') return isCrafter(state.user)?renderCraftInventory():renderCraftOrders();
  return '';
}

// ── Pickup table (gatherer → logistics) ──
function renderPickupTable(){
  const u=state.user;
  const val=(w,c)=>{ switch(c){ case 'status':return ({open:0,claimed:1,done:2})[w.status]??9; case 'accepted':return w.claimedByName||''; case 'by':return w.createdByName||''; case 'items':return (w.report||w.items||[]).length; default:return w.location||''; } };
  let rows=state.workorders.filter(w=>w.kind==='pickup'&&w.status===pkF
      &&searchMatch('wo', w.location, w.createdByName, w.claimedByName, (w.report||[]).map(r=>r.what+' '+r.type).join(' ')))
    .sort((a,b)=>cmpVals(val(a,pkSortCol),val(b,pkSortCol),pkSortDir));
  if(!rows.length) return `<div class="empty">No ${pkF==='open'?'open':pkF==='claimed'?'accepted':'completed'} pickups${searchGet('wo').text?' match your search':''}.</div>`;
  const cols=[['location','Location'],['items','Reported'],['status','Status'],['accepted','Accepted by'],['by','By']];
  return `<table class="cards"><thead><tr>${cols.map(([c,l])=>sortTh('setPkSort',pkSortCol,pkSortDir,c,l)).join('')}<th></th></tr></thead><tbody>${rows.map(w=>{
    const canAct=isAdmin(u)||hasRole(u,'logistics');
    const mine=w.claimedById===u._id;
    const canAccept=w.status==='open'&&canAct;
    const canFinish=w.status==='claimed'&&(isAdmin(u)||mine);
    const canDelete=w.status==='done'&&(isAdmin(u)||w.createdBy===u._id);

      || (w.items||[]).map(it=>`${esc(it.name)}${it.qualityStep?` · ${qBandLabel(it.qualityStep)}`:''} ×${it.qty} ${esc(it.unit)}`).join('<br>') || '—';
    return `<tr>
      <td data-label="Location" style="font-weight:700;">${esc(w.location||'—')}${w.system?` <span class="sys-badge">${esc(w.system)}</span>`:''}${w.note?`<div style="font-size:var(--text-sm);font-weight:400;color:var(--fg);">${esc(w.note)}</div>`:''}</td>
      <td data-label="Reported" style="font-size:var(--text-sm);color:var(--fg);">${reportHtml}</td>

        ${canDelete?`<button class="btn-del" onclick="woDelete('${esc(w._id)}')" aria-label="Delete">&times;</button>`:''}
      </td></tr>`;
  }).join('')}</tbody></table>`;
}

// ── Transfers table (every custody hand-off: deliveries, moves, distributions, borrows) ──
const TRANSFER_KINDS=['delivery','move','distribution','borrow'];
// who may accept an OPEN transfer of each kind (borrow is accepted by the specific holder)
function transferAcceptRole(kind){ return kind==='delivery'?'crafter':kind==='move'?'logistics':kind==='distribution'?'distributor':''; }
function transferBucket(w){ if(w.status==='done') return 'done'; if(w.status==='claimed') return 'inprogress'; return 'open'; }
function transferVisible(w,u){
  if(isAdmin(u)) return true;
  if(w.createdBy===u._id||w.claimedById===u._id) return true;
  if(w.kind==='borrow') return w.giverName===u.username||w.giverId===u._id; // the lender
  if(w.status==='open' && hasRole(u, transferAcceptRole(w.kind))) return true;
  return false;
}
function transferActiveCount(){ const u=state.user; return state.workorders.filter(w=>TRANSFER_KINDS.includes(w.kind)&&w.status!=='done'&&transferVisible(w,u)).length; }
function transferFields(w){
  const what=(w.items||[]).map(it=>`${esc(it.name)}${it.qualityStep!=null?` · ${qBandLabel(it.qualityStep)}`:''} ×${it.qty}`).join(', ')||'—';
  if(w.kind==='borrow') return { what, from:w.giverName||'—', to:w.createdByName||'—', stage:woStatusLabel(w.status), stageOrder:({open:0,claimed:1,done:2})[w.status]??9, type:'Borrow' };
  const to = w.claimedByName || (w.kind==='delivery'?'any crafter':w.kind==='move'?'any logistics':'any distributor');
  const type = w.kind==='delivery'?'Delivery':w.kind==='move'?'Move':'Distribution';
  const from = (w.kind==='move' && w.giverName) ? w.giverName : (w.createdByName||'—');
  return { what, from, to, stage:woStatusLabel(w.status), stageOrder:({open:0,claimed:1,done:2})[w.status]??9, type, destLocation:w.destLocation };
}
function renderTransfers(){
  const u=state.user;
  const val=(w,c)=>{ const f=transferFields(w); return c==='stage'?f.stageOrder:(f[c]||''); };
  let rows=state.workorders.filter(w=>TRANSFER_KINDS.includes(w.kind)&&transferVisible(w,u)&&transferBucket(w)===trF&&(()=>{const f=transferFields(w);return searchMatch('wo', f.what, f.from, f.to, f.stage, f.type);})())
    .sort((a,b)=>cmpVals(val(a,trSortCol),val(b,trSortCol),trSortDir));
  if(!rows.length) return `<div class="empty">No ${trF==='open'?'open':trF==='inprogress'?'in-progress':'completed'} transfers${searchGet('wo').text?' match your search':''}.</div>`;
  const cols=[['what','What'],['from','From'],['to','To'],['stage','Stage']];
  return `<table class="cards"><thead><tr>${cols.map(([c,l])=>sortTh('setTrSort',trSortCol,trSortDir,c,l)).join('')}<th></th></tr></thead><tbody>${rows.map(w=>{
    const f=transferFields(w);
    let acts='';
    if(w.kind==='borrow'){
      const iAmLender=w.giverName===u.username||w.giverId===u._id;
      const iAmBorrower=w.createdBy===u._id;
      if(w.status==='open'&&(iAmLender||isAdmin(u))) acts+=`<button class="btn btn-black btn-sm" style="margin-right:var(--space-1);" onclick="doAcceptBorrow('${esc(w._id)}')">Accept</button>`;
      if(w.status==='claimed'&&(iAmBorrower||isAdmin(u))) acts+=`<button class="btn btn-black btn-sm" style="margin-right:var(--space-1);" onclick="doConfirmBorrow('${esc(w._id)}')">Confirm receipt</button>`;
      if(w.status==='claimed'&&(iAmLender||isAdmin(u))) acts+=`<button class="btn btn-outline btn-sm" onclick="woAbandon('${esc(w._id)}')">Abandon</button>`;
      if(w.status!=='done'&&(iAmBorrower||isAdmin(u))) acts+=`<button class="btn-del" onclick="woDelete('${esc(w._id)}')" aria-label="Cancel">&times;</button>`;
    } else {
      const mine=w.claimedById===u._id;
      const canAccept = w.status==='open' && (isAdmin(u)||hasRole(u, transferAcceptRole(w.kind)));
      const canFinish = w.status==='claimed' && (isAdmin(u)||mine);
      const canDelete = w.status==='done' && (isAdmin(u)||w.createdBy===u._id);
      const acceptCall = w.kind==='distribution' ? `openDistAccept('${esc(w._id)}')` : `woAccept('${esc(w._id)}')`;
      if(canAccept) acts+=`<button class="btn btn-black btn-sm" style="margin-right:var(--space-1);" onclick="${acceptCall}">Accept</button>`;
      if(canFinish){ acts+=`<button class="btn btn-black btn-sm" style="margin-right:var(--space-1);" onclick="woComplete('${esc(w._id)}')">Confirm ${w.kind==='move'?'collected':'receipt'}</button>`; acts+=`<button class="btn btn-outline btn-sm" onclick="woAbandon('${esc(w._id)}')">Abandon</button>`; }
      if(canDelete) acts+=`<button class="btn-del" onclick="woDelete('${esc(w._id)}')" aria-label="Delete">&times;</button>`;
    }
    return `<tr>
      <td data-label="What" style="font-weight:700;">${f.what}<div style="font-size:var(--text-xs);font-weight:400;color:var(--mid);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;">${f.type}${f.destLocation?` → ${esc(f.destLocation)}`:''}</div></td>
      <td data-label="From">${esc(f.from)}</td>
      <td data-label="To">${esc(f.to)}</td>
      <td data-label="Stage" style="font-size:var(--text-sm);font-weight:700;letter-spacing:.04em;text-transform:uppercase;">${esc(f.stage)}</td>
      <td data-label="" style="white-space:nowrap;">${acts||'—'}</td>
    </tr>`;
  }).join('')}</tbody></table>`;
}

function stockSortVal(s,col){ switch(col){ case 'kind': return s.kind||''; case 'quality': return s.qualityValue!=null?s.qualityValue:(s.qualityStep!=null?s.qualityStep:-1); case 'qty': return s.qty||0; case 'location': return s.location||''; case 'heldBy': return s.heldBy||''; case 'status': return STOCK_STATUS_DEFS.findIndex(x=>x.id===s.status); default: return s.name||''; } }
function toggleStockSearch(){ stockSearchActive=!stockSearchActive; if(!stockSearchActive) stockSearch=''; rerenderStock(); }

function stockRows(){
  let rows=state.stock.filter(s=>s.kind===(stockView==='items'?'item':'material'));

async function saveStock(id){
  const V=x=>(document.getElementById(x)||{value:''}).value;
  const kind=V('st-kind'), name=V('st-name').trim();
  if(!name){ showErr('st-err','Pick a name'); return; }
  const inCatalog = kind==='material' ? state.catalog.materials.some(x=>x.name===name) : state.catalog.items.some(x=>x.name===name);
  if(!inCatalog){ showErr('st-err','Pick a name from the list'); return; }
  const qty=Number(V('st-qty'));
  if(!(qty>0)){ showErr('st-err','Quantity must be greater than 0'); return; }
  const unit=V('st-unit')||'SCU';
  const heldBy=V('st-held').trim();
  const location=V('st-loc');
  const status = id ? V('st-status') : 'reported';   // new stock is always reported
  const note=V('st-note').trim();
  let category='', system, qualityStep, qualityValue;
  if(kind==='material'){
    const m=state.catalog.materials.find(x=>x.name===name); category=m?m.category:'';
    qualityStep=Number(V('st-q'))||undefined;
    if(m && qualityStep){ const qq=(m.qualities||[]).find(q=>q.step===qualityStep); qualityValue=qq?qq.value:undefined; }
  } else {
    const it=state.catalog.items.find(x=>x.name===name); category=it?it.category:'';
  }
  const loc=state.catalog.locations.find(l=>l.name===location); system=loc?loc.system:undefined;
  try{
    if(id){
      await convexMutation('stock:update',{sessionToken:state.sessionToken,id,qty,qualityStep,qualityValue,location,system,heldBy,status,note:note||undefined});
    } else {
      await convexMutation('stock:create',{sessionToken:state.sessionToken,kind,name,category,qualityStep,qualityValue,qty,unit,location,system,heldBy,status,note:note||undefined});
    }
    toast('Stock saved'); closeModal(); await refreshAll(); renderPage();
  }catch(e){ showErr('st-err', e.message); }
}
async function deleteStock(id,name){
  if(!await confirmModal(`Remove "${name}" from the ledger?`)) return;
  try{ await convexMutation('stock:remove',{sessionToken:state.sessionToken,id}); toast('Stock removed'); await refreshAll(); renderPage(); }catch(e){ notifyError(e); }
}

// ─── CATALOG (reference databanks: materials, items+recipes, locations) ─────────
let catalogTab = 'materials';
let catalogSearch = '';
let catalogSearchActive = false;
let catalogItemFilter = 'all';   // item category group
let catalogMatFilter = 'all';    // material type
let catalogLocFilter = 'all';    // location system
const MAT_TYPES = ['Mineable','Salvage','Loot'];
const CAT_UNITS = ['SCU','UNIT'];
// Refined-material quality bands (the in-game quality-% ranges). A stock row
// stores the band index (step 1..8); the per-material value comes from the
// catalog. Keep in sync with QUALITY_BANDS in convex/_constants.ts.
const QUALITY_BANDS = ['0–399','400–599','600–699','700–799','800–899','900–949','950–998','999–1000'];
// Short label for a band step (1-based). Falls back to "Q{step}" if out of range.
function qBandLabel(step){ const i=Number(step); return (i>=1&&i<=QUALITY_BANDS.length)?QUALITY_BANDS[i-1]:('Q'+step); }
const CAT_LIST_CAP = 300; // cap rows when the filtered list is still large
const CAT_ITEM_GROUPS = ['FPS Armour','FPS Weapons','Vehicle Components','Vehicle Weapons','Other'];
function catItemGroup(c){
  c=c||'';
  if(c==='FPSArmours') return 'FPS Armour';
  if(c==='FPSWeapons') return 'FPS Weapons';
  if(c.startsWith('Veh. Comp')) return 'Vehicle Components';
  if(c.startsWith('Veh. Weapons')) return 'Vehicle Weapons';
  return 'Other';
}
function setCatalogTab(t){ catalogTab=t; catalogSearch=''; catalogSearchActive=false; catalogItemFilter='all'; catalogMatFilter='all'; catalogLocFilter='all'; renderPage(); renderNav(); }
function setCatItemFilter(g){ catalogItemFilter=g; rerenderCatalog(); }
function setCatMatFilter(t){ catalogMatFilter=t; rerenderCatalog(); }
function setCatLocFilter(s){ catalogLocFilter=s; rerenderCatalog(); }
function toggleCatalogSearch(){ catalogSearchActive=!catalogSearchActive; if(!catalogSearchActive) catalogSearch=''; rerenderCatalog(); }
function catalogSearchInput(v){ catalogSearch=v; const l=document.getElementById('catalog-list'); if(l) l.innerHTML=renderCatalogList(); }
function rerenderCatalog(){
  const c=document.getElementById('catalog-controls'); if(c) c.innerHTML=renderCatalogControls();
  const l=document.getElementById('catalog-list'); if(l) l.innerHTML=renderCatalogList();
  if(catalogSearchActive){ const inp=document.getElementById('cat-search'); if(inp){ inp.focus(); const x=inp.value; try{inp.setSelectionRange(x.length,x.length);}catch(e){} } }
}

// Rows for the active tab after category/type/system filter + search, sorted by name.
function catRows(){
  const cat=state.catalog||{materials:[],items:[],locations:[]};
  let rows;
  if(catalogTab==='materials'){ rows=cat.materials; if(catalogMatFilter!=='all') rows=rows.filter(m=>(m.category||'Uncategorized')===catalogMatFilter); }
  else if(catalogTab==='items'){ rows=cat.items; if(catalogItemFilter!=='all') rows=rows.filter(it=>catItemGroup(it.category)===catalogItemFilter); }
  else { rows=cat.locations; if(catalogLocFilter!=='all') rows=rows.filter(l=>(l.system||'')===catalogLocFilter); }
  const q=catalogSearch.trim().toLowerCase();
  if(q) rows=rows.filter(r=>r.name.toLowerCase().includes(q));
  return [...rows].sort((a,b)=>a.name.localeCompare(b.name));
}

function pageCatalog(){
  const u=state.user;
  if(!isAdmin(u)){ currentPage='overview'; return pageOverview(); }
  const cat=state.catalog||{materials:[],items:[],locations:[]};
  const counts={materials:cat.materials.length,items:cat.items.length,locations:cat.locations.length};
  const addLabel={materials:'Material',items:'Item',locations:'Location'}[catalogTab];
  const addFn={materials:'openMaterialModal()',items:'openItemModal()',locations:'openLocationModal()'}[catalogTab];
  const tab=(id,label)=>`<button class="btn-ghost btn-sm${catalogTab===id?' active':''}" onclick="setCatalogTab('${id}')">${label} (${counts[id]})</button>`;
  return `
    <div class="page-head">
      <div class="page-head-left"><div class="page-lead">Databanks</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-outline" onclick="importCatalogSeed()">Import seed data</button>
        <button class="btn btn-black" onclick="${addFn}">+ Add ${addLabel}</button>
      </div>
    </div>
    <div id="catalog-content" style="margin-top:32px;">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center;">
        ${tab('materials','Materials')}${tab('items','Items')}${tab('locations','Locations')}
      </div>
      <div id="catalog-controls">${renderCatalogControls()}</div>
      <div id="catalog-list">${renderCatalogList()}</div>
    </div>`;
}

// Per-tab filter buttons + a Search toggle button (navytrack inventory pattern).
function renderCatalogControls(){
  const cat=state.catalog||{materials:[],items:[],locations:[]};
  const fbtn=(active,onclick,label)=>`<button class="btn-ghost btn-sm${active?' active':''}" onclick="${onclick}">${esc(label)}</button>`;
  let buttons='';
  if(catalogTab==='items'){
    const present=new Set(cat.items.map(it=>catItemGroup(it.category)));
    const groups=CAT_ITEM_GROUPS.filter(g=>present.has(g));
    buttons=fbtn(catalogItemFilter==='all',"setCatItemFilter('all')",'All')+groups.map(g=>fbtn(catalogItemFilter===g,`setCatItemFilter('${escJs(g)}')`,g)).join('');
  } else if(catalogTab==='materials'){
    const cats=[...new Set(cat.materials.map(m=>m.category||'Uncategorized'))].sort();
    buttons=fbtn(catalogMatFilter==='all',"setCatMatFilter('all')",'All')+cats.map(c=>fbtn(catalogMatFilter===c,`setCatMatFilter('${escJs(c)}')`,c)).join('');
  } else {
    const systems=[...new Set(cat.locations.map(l=>l.system).filter(Boolean))].sort();
    buttons=fbtn(catalogLocFilter==='all',"setCatLocFilter('all')",'All')+systems.map(s=>fbtn(catalogLocFilter===s,`setCatLocFilter('${escJs(s)}')`,s)).join('');
  }
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center;">
      ${buttons}
      <div style="flex:1;"></div>
      <button class="btn-ghost btn-sm${catalogSearchActive?' active':''}" onclick="toggleCatalogSearch()">${catalogSearchActive?'Close Search':'Search'}</button>
    </div>
    ${catalogSearchActive?`<div style="margin-bottom:20px;"><input id="cat-search" type="text" placeholder="Search ${catalogTab}…" value="${esc(catalogSearch)}" style="width:100%;max-width:400px;" oninput="catalogSearchInput(this.value)"></div>`:''}`;
}

function renderCatalogList(){
  if(catalogTab==='materials') return renderCatMaterials(catRows());
  if(catalogTab==='items') return renderCatItems(catRows());
  return renderCatLocations(catRows());
}

function renderCatMaterials(rows){
  if(!state.catalog.materials.length) return `<div class="empty">No materials yet. Add one, or import the seed data.</div>`;
  if(!rows.length) return `<div class="empty">No materials match this filter.</div>`;
  return `<table class="cards">
    <thead><tr><th>Material</th><th>Type</th><th>Category</th><th>Unit</th><th>Value by quality band</th><th></th></tr></thead>
    <tbody>${rows.map(m=>`<tr>
      <td data-label="Material" style="font-weight:700;">${esc(m.name)}</td>
      <td data-label="Type">${esc(m.type)}</td>
      <td data-label="Category">${esc(m.category||'—')}</td>
      <td data-label="Unit">${esc(m.unit)}</td>
      <td data-label="Quality" style="font-size:var(--text-sm);color:var(--fg);">${[...(m.qualities||[])].sort((a,b)=>a.step-b.step).map(q=>q.value).join(' · ')||'—'}</td>
      <td data-label="" style="white-space:nowrap;">
        <button class="btn btn-outline btn-sm" style="margin-right:4px;" onclick="openMaterialModal('${esc(m._id)}')">Edit</button>
        <button class="btn-del" onclick="deleteCatMaterial('${esc(m._id)}','${escJs(m.name)}')" aria-label="Delete">&times;</button>
      </td>
    </tr>`).join('')}</tbody></table>`;
}

function renderCatItems(all){
  if(!state.catalog.items.length) return `<div class="empty">No craftable items yet. Add a blueprint, or import the seed data.</div>`;
  if(!all.length) return `<div class="empty">No items match this filter.</div>`;
  const capped = all.length>CAT_LIST_CAP;
  const rows = capped ? all.slice(0,CAT_LIST_CAP) : all;
  const note = capped ? `<div style="font-size:var(--text-sm);color:var(--fg);margin-bottom:10px;">Showing ${CAT_LIST_CAP} of ${all.length} — narrow with a category or search.</div>` : '';
  return note + `<table class="cards">
    <thead><tr><th>Item</th><th>Category</th><th>Recipe</th><th></th></tr></thead>
    <tbody>${rows.map(it=>`<tr>
      <td data-label="Item" style="font-weight:700;">${esc(it.name)}</td>
      <td data-label="Category">${esc(it.category||'—')}</td>
      <td data-label="Recipe" style="font-size:var(--text-sm);color:var(--fg);">${(it.recipe||[]).map(r=>`${esc(r.materialName)} ×${r.qty} ${esc(r.unit)}`).join(', ')||'—'}</td>
      <td data-label="" style="white-space:nowrap;">
        <button class="btn btn-outline btn-sm" style="margin-right:4px;" onclick="openItemModal('${esc(it._id)}')">Edit</button>
        <button class="btn-del" onclick="deleteCatItem('${esc(it._id)}','${escJs(it.name)}')" aria-label="Delete">&times;</button>
      </td>
    </tr>`).join('')}</tbody></table>`;
}

function renderCatLocations(rows){
  if(!state.catalog.locations.length) return `<div class="empty">No locations yet.</div>`;
  if(!rows.length) return `<div class="empty">No locations match this filter.</div>`;
  return `<table class="cards">
    <thead><tr><th>Location</th><th>System</th><th>Base</th><th></th></tr></thead>
    <tbody>${rows.map(l=>`<tr>
      <td data-label="Location" style="font-weight:700;">${esc(l.name)}</td>
      <td data-label="System">${esc(l.system||'—')}</td>
      <td data-label="Base">${l.isBase?'<span class="item-cat-tag">Base</span>':'—'}</td>
      <td data-label="" style="white-space:nowrap;">
        <button class="btn btn-outline btn-sm" style="margin-right:4px;" onclick="openLocationModal('${esc(l._id)}')">Edit</button>
        <button class="btn-del" onclick="deleteCatLocation('${esc(l._id)}','${escJs(l.name)}')" aria-label="Delete">&times;</button>
      </td>
    </tr>`).join('')}</tbody></table>`;
}

// ── Material modal ──
function openMaterialModal(id){
  const m = id ? state.catalog.materials.find(x=>x._id===id) : null;
  const q = {}; if(m) for(const x of (m.qualities||[])) q[x.step]=x.value;
  const qInputs = QUALITY_BANDS.map((band,i)=>{const s=i+1;return `<div style="display:flex;align-items:center;gap:8px;">
    <span style="width:74px;font-size:var(--text-sm);color:var(--fg);white-space:nowrap;">${band}</span>
    <input id="mq-${s}" type="number" step="any" placeholder="—" value="${m&&q[s]!=null?q[s]:''}" style="width:100%;">
  </div>`;}).join('');
  showModal(`
    <div class="modal-title">${m?'Edit material':'New material'}</div>
    <div class="field"><label class="lbl">Name</label><input id="m-name" type="text" value="${m?esc(m.name):''}" placeholder="e.g. Hadanite"></div>
    <div class="grid2">
      <div class="field"><label class="lbl">Type</label><select id="m-type">${MAT_TYPES.map(t=>`<option${m&&m.type===t?' selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label class="lbl">Unit</label><select id="m-unit">${CAT_UNITS.map(t=>`<option${m&&m.unit===t?' selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label class="lbl">Category</label><input id="m-cat" type="text" value="${m?esc(m.category||''):''}" placeholder="e.g. Ores"></div>
    <div class="field"><label class="lbl">Value by quality band</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:6px;">${qInputs}</div>
      <div style="font-size:var(--text-sm);color:var(--fg);margin-top:6px;">Per-unit value (0–1000) at each in-game quality band. Leave a band blank if the material can't reach it.</div>
    </div>
    <div class="err-msg" id="m-err"></div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-black" onclick="saveCatMaterial(${m?`'${esc(m._id)}'`:'null'})">Save</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>`);
}
async function saveCatMaterial(id){
  const name=(document.getElementById('m-name')||{value:''}).value.trim();
  const type=document.getElementById('m-type').value;
  const unit=document.getElementById('m-unit').value;
  const category=document.getElementById('m-cat').value.trim();
  if(!name){showErr('m-err','Name is required');return;}
  const qualities=QUALITY_BANDS.map((_,i)=>{const el=document.getElementById('mq-'+(i+1));const raw=el?el.value.trim():'';return raw===''?null:{step:i+1,value:Number(raw)};}).filter(q=>q&&Number.isFinite(q.value));
  try{
    await convexMutation('catalog:upsertMaterial',{sessionToken:state.sessionToken,id:id||undefined,name,type,category,unit,qualities});
    toast('Material saved'); closeModal(); await refreshAll(); renderPage();
  }catch(e){showErr('m-err',e.message);}
}
async function deleteCatMaterial(id,name){
  if(!await confirmModal(`Delete material "${name}" from the databank?`)) return;
  try{ await convexMutation('catalog:deleteMaterial',{sessionToken:state.sessionToken,id}); toast('Material deleted'); await refreshAll(); renderPage(); }catch(e){notifyError(e);}
}

// ── Item / recipe modal ──
function recipeRowHtml(materials, r){
  const opts=materials.map(m=>`<option value="${esc(m.name)}"${r&&r.materialName===m.name?' selected':''}>${esc(m.name)}</option>`).join('');
  return `<div class="recipe-row" style="display:flex;gap:6px;margin-bottom:6px;align-items:center;">
    <select class="rr-mat" style="flex:1;"><option value="">— material —</option>${opts}</select>
    <input class="rr-qty" type="number" step="any" placeholder="qty" value="${r?r.qty:''}" style="width:90px;">
    <select class="rr-unit" style="width:90px;">${CAT_UNITS.map(t=>`<option${r&&r.unit===t?' selected':''}>${t}</option>`).join('')}</select>
    <button class="btn-del" onclick="this.closest('.recipe-row').remove()" aria-label="Remove">&times;</button>
  </div>`;
}
function addRecipeRow(){
  const box=document.getElementById('recipe-rows'); if(!box) return;
  box.insertAdjacentHTML('beforeend', recipeRowHtml(state.catalog.materials, null));
}

  const it = id ? state.catalog.items.find(x=>x._id===id) : null;

  const rows = (it&&it.recipe&&it.recipe.length?it.recipe:[null]).map(r=>recipeRowHtml(mats,r)).join('');

    <div class="field"><label class="lbl">Category</label><input id="it-cat" type="text" value="${it?esc(it.category||''):''}" placeholder="e.g. fps_weapon"></div>
    <div class="field"><label class="lbl">Recipe (materials needed)</label>
      ${mats.length?`<div id="recipe-rows" style="margin-top:6px;">${rows}</div>
      <button class="btn-ghost btn-sm" style="margin-top:6px;" onclick="addRecipeRow()">+ Add material</button>`

  try{
    await convexMutation('catalog:upsertItem',{sessionToken:state.sessionToken,id:id||undefined,name,category,recipe});
    toast('Item saved'); closeModal(); await refreshAll(); renderPage();
  }catch(e){showErr('it-err',e.message);}
}
async function deleteCatItem(id,name){

  try{ await convexMutation('catalog:deleteItem',{sessionToken:state.sessionToken,id}); toast('Item deleted'); await refreshAll(); renderPage(); }catch(e){notifyError(e);}

// ── Seed import ──
async function importCatalogSeed(){
  if(!await confirmModal('Import the seed materials, blueprints and locations? Existing names are skipped.')) return;
  try{
    const res=await fetch('seed/catalog-seed.json',{cache:'no-store'});
    if(!res.ok) throw new Error('Could not load seed file');
    const seed=await res.json();
    const materials=(seed.materials||[]).map(m=>({name:m.name,type:m.type||'Mineable',category:m.category||'',unit:m.unit||'SCU',qualities:Array.isArray(m.qualities)?m.qualities.map(q=>({step:Number(q.step),value:Number(q.value)})):undefined}));
    const items=(seed.items||[]).map(i=>({name:i.name,category:i.category||'',recipe:(i.recipe||[]).map(r=>({materialName:r.materialName,qty:Number(r.qty),unit:r.unit||'SCU'}))}));
    const locations=(seed.locations||[]).map(l=>({name:l.name,system:l.system||undefined,isBase:!!l.isBase}));
    // The item list is large — send materials/locations once, then items in chunks.
    toast('Importing… this can take a moment');
    const CHUNK=200; const chunks=[];
    for(let i=0;i<items.length;i+=CHUNK) chunks.push(items.slice(i,i+CHUNK));
    if(!chunks.length) chunks.push([]);
    let mat=0,it=0,loc=0;
    for(let i=0;i<chunks.length;i++){
      const payload={sessionToken:state.sessionToken,items:chunks[i]};
      if(i===0){ payload.materials=materials; payload.locations=locations; }
      const out=await convexMutation('catalog:importCatalog',payload);
      mat+=out.matAdded||0; it+=out.itemAdded||0; loc+=out.locAdded||0;
    }
    toast(`Imported ${mat} materials, ${it} items, ${loc} locations`);
    await refreshAll(); renderPage();
  }catch(e){ notifyError(e); }
}

// ─── MODAL UTILS ─────────────────────────────────────────────────────────────
let _modalLastFocus = null;
function showModal(html) {
  const box=document.getElementById('modal-box');
  const overlay=document.getElementById('modal-overlay');
  _modalLastFocus = document.activeElement;
  if(box){
    box.setAttribute('role','dialog');
    box.setAttribute('aria-modal','true');
    box.innerHTML=`<button onclick="closeModal()" style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:var(--text-lg);cursor:pointer;color:var(--fg);line-height:1;padding:4px 8px;" aria-label="Close">&times;</button>${html}`;
  }
  if(overlay) overlay.classList.add('open');
  // Move focus into the dialog (first real field, not the close button).
  setTimeout(()=>{
    if(!box) return;
    const first=box.querySelector('input,textarea,select:not(.cs-native),.cs-trigger,[contenteditable="true"]')
      || box.querySelector('button:not([aria-label="Close"])') || box;
    try{ first.focus(); }catch(e){}
  },0);
}
let _modalOnClose = null;
function closeModal() {
  const overlay=document.getElementById('modal-overlay');
  if(overlay) overlay.classList.remove('open');
  if(_modalLastFocus && _modalLastFocus.focus){ try{_modalLastFocus.focus(); }catch(e){} }
  _modalLastFocus=null;
  const cb=_modalOnClose; _modalOnClose=null;
  if(cb) cb();   // notify a pending confirmModal that the dialog was dismissed
}
function modalOverlayClick(e) {
  // clicking backdrop no longer closes — use the X button instead
}

// Styled, promise-based replacement for native confirm(). Resolves true/false.
// Accepts a message string or { title, body, confirmLabel, cancelLabel, danger }.
function confirmModal(opts){
  const o = (typeof opts==='string') ? { body: opts } : (opts || {});
  const title = o.title || 'Please confirm';
  const body = o.body || 'Are you sure?';
  const confirmLabel = o.confirmLabel || 'Confirm';
  const cancelLabel = o.cancelLabel || 'Cancel';
  // Auto-flag destructive confirms (red button) from the wording unless told explicitly.
  const danger = (o.danger!==undefined) ? !!o.danger
    : /\b(delete|remove|cannot be undone|permanently|revert|draw now)\b/i.test(body);
  return new Promise(resolve=>{
    let settled=false;
    const settle=(val)=>{ if(settled) return; settled=true; _modalOnClose=null; resolve(val); };
    showModal(`
      <div class="modal-title">${esc(title)}</div>
      <div style="font-size:var(--text-md);color:var(--fg);line-height:1.6;margin-bottom:28px;">${esc(body)}</div>
      <div style="display:flex;gap:10px;">
        <button class="btn ${danger?'btn-red':'btn-black'}" id="cm-yes">${esc(confirmLabel)}</button>
        <button class="btn btn-outline" id="cm-no">${esc(cancelLabel)}</button>
      </div>`);
    _modalOnClose = ()=>settle(false);   // Esc / × / dismiss = cancel
    const yes=document.getElementById('cm-yes'), no=document.getElementById('cm-no');
    if(yes) yes.onclick=()=>{ settle(true); closeModal(); };
    if(no)  no.onclick=()=>{ settle(false); closeModal(); };
    // Default focus to Cancel so a stray Enter never confirms a destructive action.
    setTimeout(()=>{ if(no) try{no.focus();}catch(e){} },0);
  });
}

// Global keyboard accessibility: Esc closes modals, Tab is trapped inside an
// open modal, and Enter/Space activate role="button" elements (the clickable divs).
document.addEventListener('keydown', e=>{
  const overlay=document.getElementById('modal-overlay');
  const modalOpen=overlay&&overlay.classList.contains('open');
  if(modalOpen && e.key==='Escape'){ e.preventDefault(); closeModal(); return; }
  if(modalOpen && e.key==='Tab'){
    const box=document.getElementById('modal-box');
    if(box){
      const f=[...box.querySelectorAll('a[href],button,input,select:not(.cs-native),textarea,[tabindex]:not([tabindex="-1"])')]
        .filter(el=>!el.disabled && el.offsetParent!==null);
      if(f.length){
        const first=f[0], last=f[f.length-1];
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
      }
    }
  }
  if((e.key==='Enter'||e.key===' ')){
    const t=e.target;
    if(t && t.getAttribute && t.getAttribute('role')==='button' && t.tabIndex>=0 && t.tagName!=='BUTTON'){
      e.preventDefault(); t.click();
    }
  }
});

function lotteryCardHtml(l) {

  const myWin=pkgs.find(p=>p.winner&&p.winner.id===u._id);
  const myHatCount=pkgs.filter(p=>(p.interested||[]).some(i=>i.id===u._id)).length;
  let statusBadge=l.status;
  let statusExtra='';
  if(l.status==='open'&&myHatCount>0) statusExtra=`<span style="font-size:var(--text-md);font-weight:700;color:#22c55e;">(entered in ${myHatCount} package${myHatCount!==1?'s':''})</span>`;
  if(l.status==='drawn'&&myWin) statusExtra=`<span style="font-size:var(--text-md);font-weight:700;color:#22c55e;">(you won Package ${myWin.pkgId.replace('pkg_','')})</span>`;
  return `<div class="lottery-card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:20px;">
      <div style="flex:1;">
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">

          <span>${l.items.length} component${l.items.length!==1?'s':''}</span>
          ${pkgs.length?`<span>${pkgs.length} packages${l.status==='drawn'?' &middot; '+winnerCount+' winners':''}</span>`:''}

        ${pkgs.map(pkg=>renderPackageCard(pkg,l,true)).join('')}

function renderCompCatalogList(lotteryId) {
  let filtered=COMPONENTS_CATALOG;
  if(lotteryCompTypeFilter!=='all') filtered=filtered.filter(c=>c.type===lotteryCompTypeFilter);
  if(lotteryCompSizeFilter!=='all') filtered=filtered.filter(c=>c.size===parseInt(lotteryCompSizeFilter));
  if(lotteryCompGradeFilter!=='all') filtered=filtered.filter(c=>c.tier===lotteryCompGradeFilter);
  if(lotteryCompClassFilter!=='all') filtered=filtered.filter(c=>c.grade===lotteryCompClassFilter);
  if(lotteryCompSearch.trim()) {
    const q=lotteryCompSearch.trim().toLowerCase();
    filtered=filtered.filter(c=>c.name.toLowerCase().includes(q)||c.gradeName.toLowerCase().includes(q));
  }
  if(!filtered.length) return `<div style="padding:20px;font-size:var(--text-md);color:var(--fg);">No components match.</div>`;
  return filtered.map(c=>{
    const itemId=`${c.type}_${c.name.replace(/\s+/g,'_')}_${c.grade}_${c.size}_${c.tier}`;
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border-m);">
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;">
          <span style="font-size:var(--text-md);font-weight:700;color:var(--fg);" class="comp-grade-${c.grade.toLowerCase()}">${esc(c.name)}</span>
          <span style="font-size:var(--text-md);color:var(--fg);">S${c.size}<span class="tier-${c.tier.toLowerCase()}"> ${c.tier}</span></span>
        </div>
        <div style="font-size:var(--text-md);color:var(--fg);opacity:.7;">${esc(c.typeName)} &middot; ${esc(c.gradeName)}</div>
      </div>
      <button class="btn btn-black btn-sm" style="white-space:nowrap;" onclick="addLotteryItem('${esc(lotteryId)}','${esc(itemId)}','${esc(c.name)}','${esc(c.type)}','${esc(c.typeName)}','${esc(c.grade)}',${c.size},'${esc(c.tier)}')">Add</button>
    </div>`;
  }).join('');
}

      <div style="margin-top:6px;font-size:var(--text-md);color:var(--fg);"><span id="lottery-open-status">${totalHats} entr${totalHats!==1?'ies':'y'} across ${pkgs.length} packages.</span></div>

      <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
        <input type="text" id="ext-name-input" placeholder="Member name (not signed up)…" style="max-width:300px;margin:0;">
        <button class="btn btn-black btn-sm" onclick="doAddExternalName('${esc(l._id)}')">Add</button>
        ${extNames.length?`<button class="btn btn-black btn-sm" style="margin-left:8px;" onclick="doEnterAllNamesAllPackages('${esc(l._id)}')">Enter All Names in All Packages</button>`:''}

          <textarea id="ext-bulk-input" placeholder="One name per line…" style="width:300px;height:100px;resize:vertical;border:1.5px solid #000;padding:8px 12px;font-size:var(--text-md);font-family:inherit;background:var(--bg);color:var(--fg);"></textarea>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button class="btn btn-black btn-sm" onclick="doBulkAddNames('${esc(l._id)}')">Import Pasted List</button>

function renderExtNameRow(l, pkgs, name) {
  const entered=pkgs.filter(p=>(p.interested||[]).some(i=>i.id==='ext_'+name));
  const notEntered=pkgs.filter(p=>!(p.interested||[]).some(i=>i.id==='ext_'+name));
  return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-m);flex-wrap:wrap;">
    <span style="font-size:var(--text-md);font-weight:700;min-width:160px;">${esc(name)}</span>
    <span style="font-size:var(--text-md);color:var(--fg);">${entered.length?'Entered: '+entered.map(p=>'Pkg '+p.pkgId.replace('pkg_','')).join(', '):'Not entered yet'}</span>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;">
      ${notEntered.length?`<button class="btn btn-black btn-sm" onclick="doEnterAllPackages('${esc(l._id)}','${escJs(name)}')">Enter All</button>`:''}
      ${pkgs.map(p=>{
        const isIn=(p.interested||[]).some(i=>i.id==='ext_'+name);
        const n=p.pkgId.replace('pkg_','');
        return isIn
          ? `<button class="btn-del" style="padding:3px 8px;" onclick="doRemoveHat('${esc(l._id)}','${esc(p.pkgId)}','ext_${escJs(name)}')">Leave Pkg ${n}</button>`
          : `<button class="btn-ghost btn-sm" onclick="doThrowHat('${esc(l._id)}','${esc(p.pkgId)}','${escJs(name)}')">Enter Pkg ${n}</button>`;
      }).join('')}
      <button class="btn-del" onclick="doRemoveExternalName('${esc(l._id)}','${escJs(name)}')">Remove</button>
    </div>
  </div>`;
}

// Targeted refresh for the open lottery view — preserves scroll and focus
function refreshLotteryOpenView(lotteryId) {
  const l=state.lotteries.find(x=>x._id===lotteryId);
  if(!l) return;
  const pkgs=(l.packages||[]).slice().sort((a,b)=>b.totalValue-a.totalValue);
  const extNames=l.externalNames||[];
  const u=state.user;

  // Update packages grid
  const pkgsEl=document.getElementById('lottery-open-pkgs');
  if(pkgsEl) pkgsEl.innerHTML=pkgs.map(pkg=>renderPackageCard(pkg,l,false)).join('');

  // Update external participants list
  const extEl=document.getElementById('lottery-ext-list');
  if(extEl) extEl.innerHTML=extNames.length?`
    <div style="margin-bottom:24px;">
      ${extNames.map(name=>renderExtNameRow(l,pkgs,name)).join('')}
    </div>`:`<div style="font-size:var(--text-md);color:var(--fg);padding:12px 0;">No external participants added.</div>`;

  // Update status bar entry count
  const totalEntries=pkgs.reduce((s,p)=>s+(p.interested||[]).length,0);
  const statusEl=document.getElementById('lottery-open-status');
  if(statusEl) statusEl.textContent=`${totalEntries} entr${totalEntries!==1?'ies':'y'} across ${pkgs.length} packages.`;

function renderLotteryDrawnDetail(l) {
  const pkgs=(l.packages||[]).slice().sort((a,b)=>b.totalValue-a.totalValue);
  const winnerCount=pkgs.filter(p=>p.winner).length;
  // Collect all participants who entered but didn't win
  const allParticipantIds=new Set();
  pkgs.forEach(p=>(p.interested||[]).forEach(i=>allParticipantIds.add(i.id)));
  const winnerIds=new Set(pkgs.filter(p=>p.winner).map(p=>p.winner.id));
  const noWinners=[];
  pkgs.forEach(p=>(p.interested||[]).forEach(i=>{
    if(!winnerIds.has(i.id)&&!noWinners.some(x=>x.id===i.id)) noWinners.push(i);
  }));

  return `
    <div style="margin-bottom:24px;padding:20px;background:var(--bg2);border-left:4px solid #22c55e;">
      <div style="font-size:var(--text-md);font-weight:700;">Draw complete. ${winnerCount} of ${pkgs.length} packages assigned.</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:40px;">
      ${pkgs.map(pkg=>renderPackageCard(pkg,l,true)).join('')}
    </div>
    ${noWinners.length?`
    <div style="margin-top:8px;padding:16px 20px;background:var(--bg2);border:1.5px solid var(--border-l);">
      <div style="font-size:var(--text-md);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;">No Package Assigned</div>
      ${noWinners.map(p=>`<div style="font-size:var(--text-md);padding:4px 0;">${esc(p.name)} — no package won</div>`).join('')}
    </div>`:''}`;
}

function renderLotteryClosedDetail(l) {
  const pkgs=(l.packages||[]).slice().sort((a,b)=>b.totalValue-a.totalValue);
  const winnerCount=pkgs.filter(p=>p.winner).length;

  return `
    <div style="margin-bottom:24px;padding:20px;background:var(--bg2);border-left:4px solid #555;">
      <div style="font-size:var(--text-md);font-weight:700;">Lottery closed. ${winnerCount} of ${pkgs.length} packages assigned.</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;">
      ${pkgs.map(pkg=>renderPackageCard(pkg,l,true)).join('')}
    </div>`;
}

function renderPackageCard(pkg, lottery, readOnly) {
  const u=state.user; const admin=canManageLottery(u);
  const interested=pkg.interested||[];
  const iHaveHat=interested.some(i=>i.id===u._id);
  const isOpen=lottery.status==='open';
  const isDrawn=lottery.status==='drawn'||lottery.status==='closed';
  const winner=pkg.winner||null;
  const iWon=winner&&winner.id===u._id;
  let cardClass='pkg-card';
  if(iWon) cardClass+=' mine';
  else if(winner) cardClass+=' picked';

  return `<div class="${cardClass}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
      <div>
        <span style="font-size:var(--text-md);font-weight:900;">Package ${pkg.pkgId.replace('pkg_','')}</span>
        <span style="font-size:var(--text-md);margin-left:8px;font-weight:700;">${pkg.totalValue.toLocaleString()} pts</span>
      </div>
      ${isDrawn&&winner?`<span style="font-size:var(--text-md);font-weight:700;color:#22c55e;">${esc(winner.name)}</span>`:''}
      ${isDrawn&&!winner?`<span style="font-size:var(--text-md);color:var(--fg);opacity:.6;">Unassigned</span>`:''}
    </div>
    <div style="margin-bottom:10px;">
      ${pkg.items.map(item=>`
        <div class="pkg-item-row">
          <span class="comp-type-badge" style="font-size:var(--text-xs);">${esc(item.typeName)}</span>
          <span style="font-weight:700;flex:1;font-size:var(--text-md);" class="comp-grade-${item.grade.toLowerCase()}">${esc(item.name)}</span>
          <span style="font-size:var(--text-md);color:var(--fg);">S${item.size}<span class="tier-${item.tier.toLowerCase()}"> ${item.tier}</span></span>
          <span style="font-size:var(--text-md);color:var(--fg);">${item.value} pts</span>
        </div>`).join('')}
    </div>
    ${isOpen&&!readOnly?`
    <div style="margin-top:8px;">
      <div style="font-size:var(--text-md);margin-bottom:8px;color:var(--fg);">${interested.length} interested${interested.length?': '+interested.map(i=>esc(i.name)).join(', '):''}.</div>
      ${iHaveHat
        ?`<button class="btn btn-outline btn-sm" style="width:100%;justify-content:center;" onclick="doRemoveHat('${esc(lottery._id)}','${esc(pkg.pkgId)}','${u._id}')">Leave</button>`
        :`<button class="btn btn-black" style="width:100%;justify-content:center;" onclick="doThrowHat('${esc(lottery._id)}','${esc(pkg.pkgId)}')">Enter</button>`}
    </div>`:''}
    ${isDrawn&&interested.length?`
    <div style="margin-top:8px;font-size:var(--text-md);color:var(--fg);">
      ${interested.map(i=>{
        const won=winner&&winner.id===i.id;
        return `<span style="${won?'color:#22c55e;font-weight:700;':'opacity:.7;'}">${esc(i.name)}${won?' (winner)':''}</span>`;
      }).join(', ')}
    </div>`:''}
  </div>`;
}

function openCreateLotteryModal() {
  showModal(`
    <div class="modal-title">New Lottery</div>
    <div class="field">

async function confirmCreateLottery() {
  const title=(document.getElementById('nl-title')||{value:''}).value.trim();
  if(!title){toast('Enter a lottery title');return;}
  try {
    const id=await convexMutation('lotteries:create',{sessionToken:state.sessionToken,title});
    closeModal();
    toast('Lottery created');
    await refreshAll();
    lotteryDetailId=id;
    lotteryView='detail';
    renderPage();
  } catch(e){notifyError(e);}
}

async function addLotteryItem(lotteryId, itemId, name, type, typeName, grade, size, tier) {
  const comp={type,grade,size:parseInt(size),tier};
  const value=compDefaultValue(comp);
  const item={id:itemId+'_'+Date.now(),name,type,typeName,grade,size:parseInt(size),tier,value};
  try {
    await convexMutation('lotteries:addItem',{sessionToken:state.sessionToken,lotteryId,item});
    toast(`${name} added`);
    await refreshAll();
    // Re-render the detail page in place
    const pw=document.getElementById('page-wrap');
    if(pw) pw.innerHTML=`<div class="page">${pageLottery()}</div>`;
  } catch(e){notifyError(e);}
}

async function removeLotteryItem(lotteryId, itemId) {
  try {
    await convexMutation('lotteries:removeItem',{sessionToken:state.sessionToken,lotteryId,itemId});
    await refreshAll();
    const pw=document.getElementById('page-wrap');
    if(pw) pw.innerHTML=`<div class="page">${pageLottery()}</div>`;
  } catch(e){notifyError(e);}
}


async function doGeneratePackages(lotteryId) {
  const n=lotteryPkgCount;
  if(n<2||n>20){toast('Package count must be 2–20');return;}
  try {
    await convexMutation('lotteries:generatePackages',{sessionToken:state.sessionToken,lotteryId,packageCount:n});
    toast(`${n} packages generated`);
    await refreshAll();
    // Only update the packages preview section, preserving the pkg-count input
    const preview=document.getElementById('lottery-pkgs-preview');
    if(preview){
      const l=state.lotteries.find(x=>x._id===lotteryId);
      const pkgs=l?l.packages||[]:[];
      preview.innerHTML=pkgs.length?`
        <div style="font-size:var(--text-md);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--border);">Generated Packages Preview</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;">
          ${pkgs.map(pkg=>renderPackageCard(pkg,l,true)).join('')}
        </div>`:'';
      // Update the "X packages generated" status line inside the generate box
      const genStatus=document.getElementById('lottery-gen-status');
      if(genStatus) genStatus.innerHTML=pkgs.length?`<div style="margin-top:10px;font-size:var(--text-md);color:#22c55e;font-weight:700;">${pkgs.length} packages generated</div>`:'';
    } else {
      const pw=document.getElementById('page-wrap');
      if(pw) pw.innerHTML=`<div class="page">${pageLottery()}</div>`;
    }
  } catch(e){notifyError(e);}
}

async function doAddExternalName(lotteryId) {
  const inp=document.getElementById('ext-name-input');
  const name=inp?inp.value.trim():'';
  if(!name){toast('Enter a name');return;}
  try {
    await convexMutation('lotteries:addExternalName',{sessionToken:state.sessionToken,lotteryId,name});
    if(inp) inp.value='';
    await refreshAll();
    refreshLotteryOpenView(lotteryId);
  } catch(e){notifyError(e);}
}

async function doBulkAddNames(lotteryId, rawText) {
  const text = rawText !== undefined ? rawText : (document.getElementById('ext-bulk-input')?.value || '');
  const names = text.split('\n').map(n => n.trim()).filter(n => n.length > 0);
  if(!names.length){ toast('No names found.'); return; }
  try {
    const added = await convexMutation('lotteries:bulkAddExternalNames', {sessionToken:state.sessionToken, lotteryId, names});
    const inp = document.getElementById('ext-bulk-input');
    if(inp) inp.value = '';
    await refreshAll();
    refreshLotteryOpenView(lotteryId);
    toast(`Added ${added} name${added!==1?'s':''}.`);
  } catch(e){ notifyError(e); }
}

async function doBulkAddFromFile(lotteryId, input) {
  const file = input.files?.[0];
  if(!file) return;
  const text = await file.text();
  input.value = '';
  await doBulkAddNames(lotteryId, text);
}

async function doRemoveExternalName(lotteryId, name) {
  try {
    await convexMutation('lotteries:removeExternalName',{sessionToken:state.sessionToken,lotteryId,name});
    await refreshAll();
    refreshLotteryOpenView(lotteryId);
  } catch(e){notifyError(e);}
}

async function doEnterAllPackages(lotteryId, externalName) {
  const l=state.lotteries.find(x=>x._id===lotteryId);
  if(!l) return;
  const pkgs=(l.packages||[]);
  const notEntered=pkgs.filter(p=>!(p.interested||[]).some(i=>i.id==='ext_'+externalName));
  for(const p of notEntered){
    try {
      await convexMutation('lotteries:throwHat',{sessionToken:state.sessionToken,lotteryId,pkgId:p.pkgId,externalName});
    } catch(e){ /* skip if already entered */ }
  }
  await refreshAll();
  refreshLotteryOpenView(lotteryId);
}

async function doEnterAllNamesAllPackages(lotteryId) {
  const l=state.lotteries.find(x=>x._id===lotteryId);
  if(!l) return;
  const pkgs=(l.packages||[]);
  const extNames=(l.externalNames||[]);
  for(const name of extNames){
    const notEntered=pkgs.filter(p=>!(p.interested||[]).some(i=>i.id==='ext_'+name));
    for(const p of notEntered){
      try {
        await convexMutation('lotteries:throwHat',{sessionToken:state.sessionToken,lotteryId,pkgId:p.pkgId,externalName:name});
      } catch(e){ /* skip if already entered */ }
    }
  }
  await refreshAll();
  refreshLotteryOpenView(lotteryId);
}

  if(!await confirmModal('Run the lottery draw now? This will randomly assign winners to packages. This cannot be undone.')) return;
  try {
    await convexMutation('lotteries:runDraw',{sessionToken:state.sessionToken,lotteryId});
    toast('Lottery draw complete');
    await refreshAll();
    renderPage();
  } catch(e){notifyError(e);}
}

async function deleteLottery(lotteryId) {
  if(!await confirmModal('Delete this lottery? This cannot be undone.')) return;
  try {
    await convexMutation('lotteries:remove',{sessionToken:state.sessionToken,lotteryId});
    toast('Lottery deleted');
    lotteryView='list'; lotteryDetailId=null;
    await refreshAll();
