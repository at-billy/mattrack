<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATTRACK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#e50000;--mid:#999;}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:#fff;color:#000;font-size:14px;line-height:1.4;}

/* NAV */
#nav{display:flex;align-items:baseline;border-bottom:2px solid #000;padding:0 40px;flex-wrap:wrap;}
#nav .brand{font-size:30px;font-weight:900;letter-spacing:-1px;padding:18px 40px 18px 0;}
.nav-item{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:22px 18px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;user-select:none;}
.nav-item:hover{color:#555;}
.nav-item.active{border-bottom-color:#000;}
#nav .user-area{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;padding:0 0 0 20px;}
.role-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid #000;}
.role-tag.crafter{border-color:var(--red);color:var(--red);}
.live-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:4px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* LAYOUT */
.page{padding:40px 40px 80px;max-width:1400px;}
.page-title{font-size:52px;font-weight:900;letter-spacing:-2px;margin-bottom:6px;line-height:1;}
.page-sub{font-size:13px;color:var(--mid);margin-bottom:40px;}
hr.thick{border:none;border-top:2px solid #000;margin:32px 0;}
hr.thin{border:none;border-top:1px solid #e0e0e0;margin:0;}

/* BUTTONS */
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:9px 18px;}
.btn-black{background:#000;color:#fff;}
.btn-black:hover{background:#222;}
.btn-outline{background:#fff;color:#000;border:1.5px solid #000;}
.btn-outline:hover{background:#f5f5f5;}
.btn-red{background:var(--red);color:#fff;}
.btn-red:hover{background:#c00;}
.btn-sm{padding:5px 10px;font-size:10px;}
.btn-ghost{background:none;color:var(--mid);border:1px solid #ddd;padding:5px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.btn-ghost:hover{border-color:#000;color:#000;}

/* FORMS */
label.lbl{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;color:#555;}
input[type=text],input[type=password],input[type=email],input[type=number],select,textarea{
  display:block;width:100%;border:1.5px solid #000;padding:9px 12px;font-size:13px;font-family:inherit;background:#fff;appearance:none;-webkit-appearance:none;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--red);}
input::placeholder{color:#bbb;}
.field{margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;}

/* PANEL */
.panel{border:1.5px solid #000;padding:28px;}
.collapsible{display:none;}
.collapsible.open{display:block;}

/* TABLE */
table{width:100%;border-collapse:collapse;}
thead th{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;border-bottom:2px solid #000;text-align:left;white-space:nowrap;}
tbody td{padding:11px 12px;border-bottom:1px solid #e8e8e8;vertical-align:top;}
tbody tr:hover{background:#fafafa;}
.empty{padding:60px 0;text-align:center;color:var(--mid);font-size:13px;}

/* QUALITY */
.q{display:inline-block;padding:2px 7px;font-size:11px;font-weight:700;background:#000;color:#fff;}

/* CRAFT */
.craft-box{border:2px solid #000;padding:24px;margin-bottom:32px;}
.craft-box.err{border-color:var(--red);}
.q-big{font-size:52px;font-weight:900;letter-spacing:-2px;line-height:1;}

/* LOG BADGES */
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;}
.badge-crafted{background:var(--red);color:#fff;}
.badge-material_added{background:#000;color:#fff;}
.badge-material_removed,.badge-item_created{background:#888;color:#fff;}
.badge-user_joined{background:#e8e8e8;color:#555;}

/* AUTH / SETUP */
.center-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;}
.auth-box{width:100%;max-width:380px;}
.auth-logo{font-size:40px;font-weight:900;letter-spacing:-2px;text-align:center;margin-bottom:48px;}
.tabs{display:flex;border-bottom:2px solid #000;margin-bottom:28px;}
.tab-btn{flex:1;padding:12px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;color:var(--mid);}
.tab-btn.active{border-bottom-color:#000;color:#000;}
.err-msg{font-size:12px;color:var(--red);margin-bottom:12px;display:none;}
.chk-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer;}
.chk-row input{width:auto;flex-shrink:0;}
.chk-row span{font-size:13px;}

/* SETUP */
.setup-note{font-size:12px;color:#888;margin-top:8px;line-height:1.6;}
.code-block{background:#f5f5f5;border:1px solid #ddd;padding:10px 14px;font-family:monospace;font-size:12px;margin:12px 0;}

/* TOAST */
#toast{position:fixed;bottom:28px;right:28px;background:#000;color:#fff;padding:12px 20px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:none;z-index:999;}

/* SEARCH */
.search-row{display:flex;gap:12px;align-items:center;margin-bottom:24px;}
.search-row input{max-width:280px;margin:0;}
</style>
</head>
<body>

<div id="root"></div>
<div id="toast"></div>

<script>
// ─── CONFIG / STATE ──────────────────────────────────────────────────────────
let CONVEX_URL = localStorage.getItem('mattrack_url') || '';
let currentPage = 'materials';
const state = { user: null, stock: [], craftItems: [], archive: [], catalog: [] };
let craftState = { itemId: null, mode: 'best', qMin: 0, qMax: 1000, plan: null };
let pollTimer = null;
let _reqCount = 0;

// ─── CONVEX HTTP HELPERS ─────────────────────────────────────────────────────
async function convexQuery(path, args = {}) {
  const r = await fetch(`${CONVEX_URL}/api/query`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path, args, format: 'json' }),
  });
  const d = await r.json();
  if (d.status !== 'success') throw new Error(d.errorMessage || 'Query failed');
  return d.value;
}
async function convexMutation(path, args = {}) {
  const r = await fetch(`${CONVEX_URL}/api/mutation`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path, args, format: 'json' }),
  });
  const d = await r.json();
  if (d.status !== 'success') throw new Error(d.errorMessage || 'Mutation failed');
  return d.value;
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
async function hashPwd(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw + '|mattrack_v1'));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtDate = d => new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const fmtDT   = d => new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function toast(msg, dur=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  clearTimeout(t._t); t._t = setTimeout(()=>t.style.display='none', dur);
}
function showErr(id, msg) {
  const el = document.getElementById(id);
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

// ─── POLLING / DATA ──────────────────────────────────────────────────────────
async function refreshAll(silent = false) {
  try {
    const [stock, items, archive, catalog] = await Promise.all([
      convexQuery('materials:getAvailable'),
      convexQuery('craftItems:getAll'),
      convexQuery('archive:getAll'),
      convexQuery('materials:getCatalog'),
    ]);
    state.stock      = stock      || [];
    state.craftItems = items      || [];
    state.archive    = archive    || [];
    state.catalog    = (catalog   || []).map(c => c.name).sort();
    updateLiveView();
  } catch(e) {
    if (!silent) console.warn('Refresh error:', e.message);
  }
}
function startPolling() {
  refreshAll();
  pollTimer = setInterval(() => refreshAll(true), 5000);
  document.getElementById('live-dot')?.setAttribute('title','Live — syncing every 5s');
}
function stopPolling() { if (pollTimer) clearInterval(pollTimer); }

function updateLiveView() {
  // Targeted DOM updates so open forms aren't disrupted
  if (currentPage === 'materials') {
    const t = document.getElementById('mat-table');
    const s = document.getElementById('mat-count');
    const av = state.stock.filter(m => m.status === 'available');
    if (t) t.innerHTML = renderMatTable(av);
    if (s) s.textContent = `${av.length} entr${av.length===1?'y':'ies'} in stock`;
  }
  if (currentPage === 'items') {
    const el = document.getElementById('items-list');
    if (el) el.innerHTML = renderItemsList();
    const s = document.getElementById('items-count');
    if (s) s.textContent = `${state.craftItems.length} item${state.craftItems.length!==1?'s':''} defined`;
  }
  if (currentPage === 'archive') {
    const el = document.getElementById('archive-table');
    if (el) el.innerHTML = renderArchiveTable();
  }
  if (currentPage === 'craft' && craftState.itemId) {
    recomputePlan();
  }
}

// ─── ROUTER ──────────────────────────────────────────────────────────────────
function goTo(tab) {
  currentPage = tab;
  renderNav();
  renderPage();
}

// ─── SETUP SCREEN ────────────────────────────────────────────────────────────
function showSetup() {
  stopPolling();
  document.getElementById('root').innerHTML = `
    <div class="center-screen">
      <div class="auth-box" style="max-width:480px;">
        <div class="auth-logo">MATTRACK</div>
        <div style="font-size:13px;color:#555;margin-bottom:24px;text-align:center;">
          Connect to your Convex backend to get started.
        </div>
        <div class="field">
          <label class="lbl">Convex Deployment URL</label>
          <input type="text" id="setup-url" placeholder="https://happy-animal-123.convex.cloud" value="${esc(CONVEX_URL)}">
        </div>
        <div class="err-msg" id="setup-err"></div>
        <button class="btn btn-black" style="width:100%;justify-content:center;" onclick="saveSetup()">Connect</button>
        <div class="setup-note">
          <strong>How to get your URL:</strong><br>
          1. In the <code>material-tracker/</code> folder, run:<br>
          <div class="code-block">npm install &amp;&amp; npx convex dev</div>
          2. Log in to Convex, create a project.<br>
          3. Copy the URL shown as <strong>CONVEX_URL</strong> — looks like:<br>
          <div class="code-block">https://happy-animal-123.convex.cloud</div>
          4. Paste it above and click Connect.
        </div>
      </div>
    </div>`;
  document.getElementById('setup-url').addEventListener('keydown', e => { if(e.key==='Enter') saveSetup(); });
}

async function saveSetup() {
  const url = document.getElementById('setup-url').value.trim().replace(/\/$/, '');
  if (!url.startsWith('https://')) { showErr('setup-err', 'URL must start with https://'); return; }
  // Quick connectivity check
  try {
    document.getElementById('setup-err').style.display = 'none';
    await fetch(`${url}/api/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: 'materials:getCatalog', args: {}, format: 'json' }),
    });
    CONVEX_URL = url;
    localStorage.setItem('mattrack_url', url);
    // Seed default catalog
    await convexMutation('materials:seedCatalog');
    showAuth();
  } catch(e) {
    showErr('setup-err', 'Could not connect. Check the URL and try again.');
  }
}

// ─── AUTH ────────────────────────────────────────────────────────────────────
function showAuth(tab = 'signin') {
  stopPolling();
  document.getElementById('root').innerHTML = `
    <div class="center-screen">
      <div class="auth-box">
        <div class="auth-logo">MATTRACK</div>
        <div class="tabs">
          <button class="tab-btn${tab==='signin'?' active':''}" onclick="showAuth('signin')">Sign In</button>
          <button class="tab-btn${tab==='signup'?' active':''}" onclick="showAuth('signup')">Sign Up</button>
        </div>
        ${tab === 'signin' ? `
          <div class="field"><label class="lbl">Username</label><input id="si-user" type="text" autocomplete="username" placeholder="username"></div>
          <div class="field"><label class="lbl">Password</label><input id="si-pass" type="password" autocomplete="current-password" placeholder="password"></div>
          <div class="err-msg" id="si-err"></div>
          <button class="btn btn-black" style="width:100%;justify-content:center;" onclick="doSignIn()">Sign In</button>
          <div style="margin-top:12px;font-size:11px;color:#999;text-align:center;">
            Wrong URL? <span style="cursor:pointer;text-decoration:underline;" onclick="showSetup()">Change setup</span>
          </div>
        ` : `
          <div class="field"><label class="lbl">Username</label><input id="su-user" type="text" placeholder="choose a username"></div>
          <div class="field"><label class="lbl">Email</label><input id="su-email" type="email" placeholder="your@email.com"></div>
          <div class="field"><label class="lbl">Password</label><input id="su-pass" type="password" placeholder="create a password"></div>
          <div class="field">
            <label class="lbl">Roles</label>
            <label class="chk-row"><input type="checkbox" id="su-prov" checked><span>Material Provider</span></label>
            <label class="chk-row"><input type="checkbox" id="su-craft"><span>Crafter</span></label>
          </div>
          <div class="err-msg" id="su-err"></div>
          <button class="btn btn-black" style="width:100%;justify-content:center;" onclick="doSignUp()">Create Account</button>
        `}
      </div>
    </div>`;
  // Enter key
  setTimeout(() => {
    const pass = document.getElementById(tab==='signin'?'si-pass':'su-pass');
    if (pass) pass.addEventListener('keydown', e => { if(e.key==='Enter') tab==='signin'?doSignIn():doSignUp(); });
  }, 0);
}

async function doSignIn() {
  const username = (document.getElementById('si-user')||{value:''}).value.trim();
  const password = (document.getElementById('si-pass')||{value:''}).value;
  if (!username||!password) { showErr('si-err','Fill in all fields'); return; }
  try {
    const ph = await hashPwd(password);
    const user = await convexQuery('users:authenticate', { username, passwordHash: ph });
    if (!user) { showErr('si-err','Invalid username or password'); return; }
    state.user = user;
    localStorage.setItem('mattrack_uid', user._id);
    showApp();
  } catch(e) { showErr('si-err', e.message); }
}

async function doSignUp() {
  const username = (document.getElementById('su-user')||{value:''}).value.trim();
  const email    = (document.getElementById('su-email')||{value:''}).value.trim();
  const password = (document.getElementById('su-pass')||{value:''}).value;
  const isProv   = (document.getElementById('su-prov')||{checked:true}).checked;
  const isCraft  = (document.getElementById('su-craft')||{checked:false}).checked;
  if (!username||!email||!password) { showErr('su-err','Fill in all fields'); return; }
  if (!isProv&&!isCraft) { showErr('su-err','Select at least one role'); return; }
  try {
    const ph    = await hashPwd(password);
    const roles = [...(isProv?['provider']:[]),...(isCraft?['crafter']:[])];
    const user  = await convexMutation('users:signUp', { username, email, passwordHash: ph, roles });
    await convexMutation('archive:addLog', { type:'user_joined', userId:user._id, userName:username, details:{roles} });
    state.user = user;
    localStorage.setItem('mattrack_uid', user._id);
    showApp();
  } catch(e) {
    const msg = e.message.includes('USERNAME_TAKEN') ? 'Username already taken' : e.message;
    showErr('su-err', msg);
  }
}

async function doLogout() {
  stopPolling();
  state.user = null;
  localStorage.removeItem('mattrack_uid');
  showAuth();
}

// ─── APP SHELL ───────────────────────────────────────────────────────────────
function showApp() {
  document.getElementById('root').innerHTML = `
    <div id="nav"></div>
    <div id="page-wrap"></div>`;
  renderNav();
  renderPage();
  startPolling();
}

function renderNav() {
  const u = state.user;
  if (!u) return;
  const tabs = [['materials','Materials'],['craft','Craft'],['items','Items'],['archive','Log']];
  document.getElementById('nav').innerHTML = `
    <div class="brand">MATTRACK</div>
    ${tabs.map(([id,lbl])=>`<div class="nav-item${currentPage===id?' active':''}" onclick="goTo('${id}')">${lbl}</div>`).join('')}
    <div class="user-area">
      <span class="live-dot" id="live-dot"></span>
      <span style="font-weight:700;">${esc(u.username)}</span>
      ${u.roles.map(r=>`<span class="role-tag${r==='crafter'?' crafter':''}">${r}</span>`).join('')}
      <button class="btn-ghost" onclick="doLogout()">Sign out</button>
    </div>`;
}

function renderPage() {
  const pages = { materials: pageMaterials, craft: pageCraft, items: pageItems, archive: pageArchive };
  const pw = document.getElementById('page-wrap');
  if (pw) pw.innerHTML = `<div class="page">${(pages[currentPage]||pageMaterials)()}</div>`;
  attachPageEvents();
}

// ─── MATERIALS PAGE ──────────────────────────────────────────────────────────
function pageMaterials() {
  const u = state.user;
  const stock = state.stock.filter(m => m.status === 'available');
  const isProv = u.roles.includes('provider');
  return `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;">
      <div>
        <div class="page-title">MATERIALS</div>
        <div class="page-sub" id="mat-count">${stock.length} entr${stock.length===1?'y':'ies'} in stock</div>
      </div>
      ${isProv?`<button class="btn btn-black" onclick="togglePanel('add-mat-panel')">+ Add Material</button>`:''}
    </div>

    <div id="add-mat-panel" class="collapsible" style="margin-bottom:32px;">
      <div class="panel">
        <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:20px;">Add Material</div>
        <div class="grid2">
          <div>
            <div class="field">
              <label class="lbl">Material Name</label>
              <select id="mat-name-sel" onchange="onMatNameChange()">
                <option value="">Select material…</option>
                ${state.catalog.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}
                <option value="__new__">+ Add new type…</option>
              </select>
            </div>
            <div class="field" id="mat-new-field" style="display:none;">
              <label class="lbl">New Material Name</label>
              <input type="text" id="mat-new-name" placeholder="Enter name">
            </div>
            <div class="field">
              <label class="lbl">Quality (0–1000)</label>
              <input type="number" id="mat-quality" min="0" max="1000" placeholder="e.g. 850">
            </div>
          </div>
          <div>
            <div class="field">
              <label class="lbl">Quantity</label>
              <input type="number" id="mat-qty" min="1" placeholder="e.g. 50">
            </div>
            <div class="field">
              <label class="lbl">Storage Location</label>
              <input type="text" id="mat-loc" placeholder="e.g. Shelf A3, Warehouse B">
            </div>
          </div>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-black" onclick="addMaterial()">Add to Database</button>
          <button class="btn btn-outline" onclick="togglePanel('add-mat-panel')">Cancel</button>
        </div>
      </div>
    </div>

    <div class="search-row">
      <span style="font-size:10px;font-weight:700;letter-spacing:.1em;">FILTER</span>
      <input type="text" id="mat-search" placeholder="Search name, location, owner…" oninput="filterMaterials()">
      <label class="chk-row" style="margin:0;white-space:nowrap;">
        <input type="checkbox" id="mat-mine" style="width:auto;" onchange="filterMaterials()">
        <span style="font-size:12px;">My entries only</span>
      </label>
    </div>
    <div id="mat-table">${renderMatTable(stock)}</div>`;
}

function renderMatTable(stock) {
  if (!stock.length) return `<div class="empty">No materials in stock yet.</div>`;
  const u = state.user;
  return `<table>
    <thead><tr><th>Material</th><th>Quality</th><th>Quantity</th><th>Location</th><th>Owner</th><th>Added</th><th></th></tr></thead>
    <tbody>${stock.map(m=>`<tr>
      <td style="font-weight:600;">${esc(m.materialName)}</td>
      <td><span class="q">${m.quality}</span></td>
      <td>${m.quantity}</td>
      <td style="color:#555;font-size:12px;">${esc(m.location)}</td>
      <td style="font-size:12px;">${esc(m.ownerName)}${m.ownerId===u._id?' <span style="color:#bbb;">(you)</span>':''}</td>
      <td style="font-size:11px;color:#999;">${fmtDate(m._creationTime)}</td>
      <td>${m.ownerId===u._id?`<button class="btn-ghost btn-sm" onclick="removeMaterial('${esc(m._id)}')">Remove</button>`:''}</td>
    </tr>`).join('')}</tbody></table>`;
}

function filterMaterials() {
  const q    = (document.getElementById('mat-search')||{value:''}).value.toLowerCase();
  const mine = (document.getElementById('mat-mine')||{checked:false}).checked;
  let stock  = state.stock.filter(m => m.status === 'available');
  if (mine) stock = stock.filter(m => m.ownerId === state.user._id);
  if (q)    stock = stock.filter(m =>
    m.materialName.toLowerCase().includes(q) ||
    m.location.toLowerCase().includes(q) ||
    m.ownerName.toLowerCase().includes(q));
  const el = document.getElementById('mat-table');
  if (el) el.innerHTML = renderMatTable(stock);
}

async function addMaterial() {
  const u = state.user;
  let name = (document.getElementById('mat-name-sel')||{value:''}).value;
  const qual = parseInt((document.getElementById('mat-quality')||{value:''}).value);
  const qty  = parseInt((document.getElementById('mat-qty')||{value:''}).value);
  const loc  = (document.getElementById('mat-loc')||{value:''}).value.trim();
  if (name === '__new__') {
    name = (document.getElementById('mat-new-name')||{value:''}).value.trim();
    if (!name) { alert('Enter material name'); return; }
  }
  if (!name||isNaN(qual)||isNaN(qty)||!loc) { alert('Fill in all fields'); return; }
  if (qual < 0 || qual > 1000) { alert('Quality must be 0–1000'); return; }
  if (qty < 1) { alert('Quantity must be at least 1'); return; }
  try {
    if (name && !(state.catalog.includes(name))) await convexMutation('materials:addToCatalog', { name });
    await convexMutation('materials:add', { materialName:name, quality:qual, quantity:qty, location:loc, ownerId:u._id, ownerName:u.username });
    await convexMutation('archive:addLog', { type:'material_added', userId:u._id, userName:u.username, details:{ materialName:name, quality:qual, quantity:qty, location:loc } });
    toast('Material added');
    togglePanel('add-mat-panel');
    await refreshAll();
  } catch(e) { alert(e.message); }
}

async function removeMaterial(id) {
  if (!confirm('Remove this material from the database?')) return;
  try {
    await convexMutation('materials:remove', { id, userId: state.user._id });
    toast('Removed');
    await refreshAll();
  } catch(e) { alert(e.message); }
}

// ─── ITEMS PAGE ──────────────────────────────────────────────────────────────
function pageItems() {
  return `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;">
      <div>
        <div class="page-title">ITEMS</div>
        <div class="page-sub" id="items-count">${state.craftItems.length} item${state.craftItems.length!==1?'s':''} defined</div>
      </div>
      <button class="btn btn-black" onclick="togglePanel('add-item-panel')">+ Add Item</button>
    </div>

    <div id="add-item-panel" class="collapsible" style="margin-bottom:32px;">
      <div class="panel">
        <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:20px;">Define Craftable Item</div>
        <div class="field" style="max-width:420px;">
          <label class="lbl">Item Name</label>
          <input type="text" id="item-name-inp" placeholder="e.g. Carbon Frame, Steel Housing…">
        </div>
        <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:20px 0 12px;">Required Materials</div>
        <div id="req-rows"></div>
        <button class="btn btn-outline btn-sm" style="margin-bottom:20px;" onclick="addReqRow()">+ Add Requirement</button>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-black" onclick="addItem()">Save Item</button>
          <button class="btn btn-outline" onclick="togglePanel('add-item-panel')">Cancel</button>
        </div>
      </div>
    </div>

    <div id="items-list">${renderItemsList()}</div>`;
}

function renderItemsList() {
  if (!state.craftItems.length) return `<div class="empty">No craftable items defined. Add your first above.</div>`;
  return state.craftItems.map(item => `
    <div style="border-bottom:1px solid #e8e8e8;padding:24px 0;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div style="font-size:20px;font-weight:700;margin-bottom:12px;">${esc(item.name)}</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            ${item.requirements.map(r=>`<span style="font-size:12px;padding:4px 12px;border:1px solid #000;">${esc(r.materialName)} &times; ${r.quantity}</span>`).join('')}
          </div>
        </div>
        <div style="text-align:right;font-size:11px;color:#999;flex-shrink:0;margin-left:24px;">
          ${esc(item.createdByName)}<br>${fmtDate(item._creationTime)}
        </div>
      </div>
    </div>`).join('');
}

function addReqRow() {
  const container = document.getElementById('req-rows');
  if (!container) return;
  const div = document.createElement('div');
  div.className = 'req-row';
  div.style.cssText = 'display:flex;gap:10px;margin-bottom:8px;align-items:center;';
  div.innerHTML = `
    <select class="req-mat" style="flex:2;margin:0;">
      <option value="">Select material…</option>
      ${state.catalog.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}
    </select>
    <input type="number" class="req-qty" placeholder="Qty" min="1" style="flex:1;margin:0;">
    <button class="btn-ghost btn-sm" onclick="this.parentNode.remove()">✕</button>`;
  container.appendChild(div);
}

async function addItem() {
  const u    = state.user;
  const name = (document.getElementById('item-name-inp')||{value:''}).value.trim();
  if (!name) { alert('Enter item name'); return; }
  const rows = document.querySelectorAll('.req-row');
  const reqs = [];
  rows.forEach(r => {
    const mat = r.querySelector('.req-mat')?.value;
    const qty = parseInt(r.querySelector('.req-qty')?.value);
    if (mat && !isNaN(qty) && qty > 0) reqs.push({ materialName: mat, quantity: qty });
  });
  if (!reqs.length) { alert('Add at least one material requirement'); return; }
  try {
    await convexMutation('craftItems:add', { name, requirements: reqs, userId: u._id, userName: u.username });
    toast('Item saved');
    togglePanel('add-item-panel');
    await refreshAll();
  } catch(e) { alert(e.message); }
}

// ─── CRAFT PAGE ──────────────────────────────────────────────────────────────
function pageCraft() {
  const u = state.user;
  if (!u.roles.includes('crafter')) return `
    <div class="page-title">CRAFT</div>
    <div style="margin-top:24px;max-width:480px;">
      <p style="color:#555;margin-bottom:20px;">Your account doesn't have the Crafter role.</p>
      <button class="btn btn-black" onclick="enableCrafter()">Enable Crafter Role</button>
    </div>`;

  const cs = craftState;
  return `
    <div class="page-title" style="margin-bottom:40px;">CRAFT</div>
    <div class="grid2" style="margin-bottom:0;">
      <div>
        <div class="field">
          <label class="lbl">Item to Craft</label>
          <select id="craft-sel" onchange="onCraftItemChange()">
            <option value="">Choose item…</option>
            ${state.craftItems.map(i=>`<option value="${esc(i._id)}"${cs.itemId===i._id?' selected':''}>${esc(i.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="lbl">Quality Mode</label>
          <select id="mode-sel" onchange="onModeChange()">
            <option value="best"${cs.mode==='best'?' selected':''}>Best Available Quality</option>
            <option value="range"${cs.mode==='range'?' selected':''}>Quality Range</option>
          </select>
        </div>
        <div id="range-wrap" style="${cs.mode==='range'?'':'display:none;'}">
          <div class="grid2" style="gap:12px;">
            <div class="field"><label class="lbl">Min Quality</label>
              <input type="number" id="q-min" min="0" max="1000" placeholder="e.g. 700" value="${cs.qMin||''}" oninput="schedulePlan()"></div>
            <div class="field"><label class="lbl">Max Quality</label>
              <input type="number" id="q-max" min="0" max="1000" placeholder="e.g. 950" value="${cs.qMax||''}" oninput="schedulePlan()"></div>
          </div>
        </div>
      </div>
      <div id="craft-summary-area">
        ${cs.plan ? renderCraftSummary(cs.plan) : `<div style="padding:32px;border:1px solid #e8e8e8;text-align:center;color:#bbb;font-size:13px;">Select an item to see crafting details.</div>`}
      </div>
    </div>
    <div id="craft-detail-area" style="margin-top:32px;">
      ${cs.plan ? renderCraftDetail(cs.plan) : ''}
    </div>`;
}

async function enableCrafter() {
  try {
    await convexMutation('users:addRole', { userId: state.user._id, role: 'crafter' });
    state.user.roles.push('crafter');
    localStorage.setItem('mattrack_uid', state.user._id); // refresh on next load
    toast('Crafter role enabled');
    renderNav();
    renderPage();
  } catch(e) { alert(e.message); }
}

function onCraftItemChange() {
  craftState.itemId = (document.getElementById('craft-sel')||{value:''}).value || null;
  recomputePlan();
}
function onModeChange() {
  craftState.mode = (document.getElementById('mode-sel')||{value:'best'}).value;
  const rw = document.getElementById('range-wrap');
  if (rw) rw.style.display = craftState.mode === 'range' ? 'block' : 'none';
  recomputePlan();
}
let _planTimer = null;
function schedulePlan() { clearTimeout(_planTimer); _planTimer = setTimeout(recomputePlan, 300); }

function recomputePlan() {
  if (!craftState.itemId) return;
  const item = state.craftItems.find(i => i._id === craftState.itemId);
  if (!item) return;
  if (craftState.mode === 'range') {
    craftState.qMin = parseInt((document.getElementById('q-min')||{value:'0'}).value) || 0;
    craftState.qMax = parseInt((document.getElementById('q-max')||{value:'1000'}).value) || 1000;
  } else { craftState.qMin = 0; craftState.qMax = 1000; }
  craftState.plan = calcPlan(item, state.stock, craftState.mode, craftState.qMin, craftState.qMax);
  const sa = document.getElementById('craft-summary-area');
  const da = document.getElementById('craft-detail-area');
  if (sa) sa.innerHTML = renderCraftSummary(craftState.plan);
  if (da) da.innerHTML = renderCraftDetail(craftState.plan);
}

function calcPlan(item, stock, mode, qMin, qMax) {
  const plan = { item, canCraft: true, requirements: [], avgQuality: 0, _qSum: 0, _qUsed: 0 };
  for (const req of item.requirements) {
    let pool = stock.filter(m => m.materialName === req.materialName && m.status === 'available');
    if (mode === 'range') pool = pool.filter(m => m.quality >= qMin && m.quality <= qMax);
    pool.sort((a, b) => b.quality - a.quality);
    let needed = req.quantity;
    const batches = [];
    let qSum = 0;
    for (const b of pool) {
      if (needed <= 0) break;
      const use = Math.min(needed, b.quantity);
      batches.push({ stockId: b._id, materialName: b.materialName, quality: b.quality, quantityUse: use, quantityAvail: b.quantity, location: b.location, ownerName: b.ownerName, ownerId: b.ownerId });
      qSum += b.quality * use;
      needed -= use;
    }
    const fulfilled = req.quantity - needed;
    const avgQ = fulfilled > 0 ? Math.round(qSum / fulfilled) : 0;
    plan.requirements.push({ materialName: req.materialName, needed: req.quantity, fulfilled, shortfall: needed, batches, avgQuality: avgQ, ok: needed === 0 });
    if (needed > 0) plan.canCraft = false;
    plan._qSum  += qSum;
    plan._qUsed += fulfilled;
  }
  plan.avgQuality = plan._qUsed > 0 ? Math.round(plan._qSum / plan._qUsed) : 0;
  return plan;
}

function qualLabel(q) { if(q>=900)return'Exceptional';if(q>=750)return'High';if(q>=500)return'Standard';if(q>=250)return'Low';return'Poor'; }

function renderCraftSummary(plan) {
  const ok = plan.canCraft;
  return `<div class="craft-box${ok?'':' err'}">
    <div style="font-size:22px;font-weight:700;margin-bottom:6px;">${esc(plan.item.name)}</div>
    <div style="font-size:11px;font-weight:700;letter-spacing:.1em;color:${ok?'#000':'var(--red)'};margin-bottom:${ok?'16px':'0'};">${ok?'CRAFTABLE':'INSUFFICIENT MATERIALS'}</div>
    ${ok?`<hr class="thin" style="margin:16px 0;"><div style="font-size:10px;font-weight:700;letter-spacing:.1em;color:#999;margin-bottom:4px;text-transform:uppercase;">Avg. Craft Quality</div>
    <div class="q-big">${plan.avgQuality}</div>
    <div style="font-size:11px;color:#999;margin-top:4px;">${qualLabel(plan.avgQuality)}</div>`:''}
  </div>`;
}

function renderCraftDetail(plan) {
  let html = `<hr class="thick"><div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:24px;">Material Requirements</div>`;
  for (const req of plan.requirements) {
    const clr = req.ok ? '#000' : 'var(--red)';
    html += `<div style="border-bottom:1px solid #e8e8e8;padding:20px 0;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">
        <div style="font-size:17px;font-weight:700;">${esc(req.materialName)}</div>
        <div style="font-size:12px;color:${clr};">${req.ok
          ? `${req.fulfilled}&thinsp;/&thinsp;${req.needed} &nbsp;&middot;&nbsp; avg quality <strong>${req.avgQuality}</strong>`
          : `${req.fulfilled}&thinsp;/&thinsp;${req.needed} available &mdash; short <strong>${req.shortfall}</strong>`}</div>
      </div>`;
    if (req.batches.length) {
      html += `<table style="font-size:12px;">
        <thead><tr><th>Quality</th><th>Use</th><th>Available</th><th>Location</th><th>Owner</th></tr></thead>
        <tbody>${req.batches.map(b=>`<tr>
          <td><span class="q">${b.quality}</span></td>
          <td style="font-weight:600;">${b.quantityUse}</td>
          <td style="color:#999;">${b.quantityAvail} total</td>
          <td style="color:#555;">${esc(b.location)}</td>
          <td>${esc(b.ownerName)}</td>
        </tr>`).join('')}</tbody></table>`;
    } else {
      html += `<div style="font-size:12px;color:var(--red);">No suitable materials found.</div>`;
    }
    html += `</div>`;
  }
  if (plan.canCraft) {
    html += `<div style="margin-top:28px;padding-top:24px;border-top:1px solid #000;">
      <button class="btn btn-red" onclick="executeCraft()">Mark Materials as Used for Crafting</button>
      <div style="font-size:11px;color:#999;margin-top:8px;">Consumes the listed materials and records this in the log.</div>
    </div>`;
  }
  return html;
}

async function executeCraft() {
  const plan = craftState.plan;
  if (!plan || !plan.canCraft) return;
  if (!confirm(`Confirm crafting "${plan.item.name}"?\n\nThe listed materials will be consumed.`)) return;
  const u = state.user;
  const batches = plan.requirements.flatMap(r => r.batches.map(b => ({ stockId: b.stockId, quantityUse: b.quantityUse })));
  const materialsDetail = plan.requirements.flatMap(r => r.batches.map(b => ({
    materialName: b.materialName, quality: b.quality, quantityUsed: b.quantityUse,
    location: b.location, ownerName: b.ownerName,
  })));
  try {
    await convexMutation('materials:executeCraft', {
      batches, itemName: plan.item.name, avgQuality: plan.avgQuality,
      userId: u._id, userName: u.username, materialsDetail,
    });
    craftState = { itemId: null, mode: 'best', qMin: 0, qMax: 1000, plan: null };
    toast('Crafted! Materials logged.');
    await refreshAll();
    goTo('archive');
  } catch(e) { alert(e.message); }
}

// ─── ARCHIVE PAGE ────────────────────────────────────────────────────────────
function pageArchive() {
  return `
    <div class="page-title">LOG</div>
    <div class="page-sub">${state.archive.length} action${state.archive.length!==1?'s':''} recorded</div>
    <div id="archive-table">${renderArchiveTable()}</div>`;
}

function renderArchiveTable() {
  if (!state.archive.length) return `<div class="empty">No actions logged yet.</div>`;
  const labels = { crafted:'Crafted', material_added:'Added', material_removed:'Removed', item_created:'New Item', user_joined:'Joined' };
  return `<table>
    <thead><tr><th>Date</th><th>Action</th><th>User</th><th>Details</th></tr></thead>
    <tbody>${state.archive.map(e=>`<tr>
      <td style="font-size:11px;color:#999;white-space:nowrap;">${fmtDT(e._creationTime)}</td>
      <td><span class="badge badge-${e.type}">${labels[e.type]||e.type}</span></td>
      <td style="font-weight:600;font-size:13px;">${esc(e.userName)}</td>
      <td style="font-size:12px;color:#555;">${fmtArchiveDetails(e)}</td>
    </tr>`).join('')}</tbody></table>`;
}

function fmtArchiveDetails(e) {
  const d = e.details || {};
  switch(e.type) {
    case 'material_added':
      return `${esc(d.materialName)} &middot; qty ${d.quantity} &middot; quality ${d.quality} &middot; ${esc(d.location)}`;
    case 'material_removed':
      return `${esc(d.materialName)} &middot; qty ${d.quantity} &middot; ${esc(d.location)}`;
    case 'crafted':
      const lines = (d.materialsUsed||[]).map(m=>`${esc(m.materialName)} &times;${m.quantityUsed} (q${m.quality}, ${esc(m.ownerName)}, ${esc(m.location)})`).join(' &nbsp;|&nbsp; ');
      return `<strong>${esc(d.itemName)}</strong> &middot; avg q${d.avgQuality}<br><span style="font-size:11px;color:#aaa;">${lines}</span>`;
    case 'item_created':
      return `${esc(d.itemName)} &middot; ${(d.requirements||[]).map(r=>`${esc(r.materialName)}&times;${r.quantity}`).join(', ')}`;
    case 'user_joined':
      return `Roles: ${(d.roles||[]).join(', ')}`;
    default:
      return JSON.stringify(d);
  }
}

// ─── SHARED HELPERS ──────────────────────────────────────────────────────────
function togglePanel(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const wasOpen = el.classList.contains('open');
  el.classList.toggle('open');
  if (!wasOpen && id === 'add-item-panel') {
    _reqCount = 0;
    const rr = document.getElementById('req-rows');
    if (rr) { rr.innerHTML = ''; addReqRow(); }
  }
}

function onMatNameChange() {
  const sel = document.getElementById('mat-name-sel');
  const fg  = document.getElementById('mat-new-field');
  if (sel && fg) fg.style.display = sel.value === '__new__' ? 'block' : 'none';
}

function attachPageEvents() { /* hooks for keyboard nav etc — extended as needed */ }

// ─── INIT ────────────────────────────────────────────────────────────────────
async function init() {
  if (!CONVEX_URL) { showSetup(); return; }
  // Try to restore session
  const uid = localStorage.getItem('mattrack_uid');
  if (uid) {
    try {
      const user = await convexQuery('users:getById', { userId: uid });
      if (user) { state.user = user; showApp(); return; }
    } catch(e) { /* fall through to auth */ }
  }
  showAuth();
}

init();
</script>
