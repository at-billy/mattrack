<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATTRACK</title>
<style>
/*
  ╔═══════════════════════════════════════════════════════════════════╗
  ║  MATTRACK — OMA EDITION                                           ║
  ║  Full redesign after oma.com: extreme type, strict B/W/R palette, ║
  ║  sticky clipping nav, full-invert hovers, architectural spacing.  ║
  ║  Zero logic changes — CSS only.                                   ║
  ╚═══════════════════════════════════════════════════════════════════╝
*/

/* ─── RESET + ROOT ──────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --red:#e50000;
  --black:#000;
  --white:#fff;
  --rule:#000;          /* all dividing lines */
  --light-rule:#e0e0e0; /* secondary lines */
  --mid:#888;
}
html{scroll-behavior:auto;}
body{
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  background:#fff;color:#000;
  font-size:14px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
}

/* ─── THE NAV ───────────────────────────────────────────────────────────────
   OMA effect: nav bar clips at its own height. Inactive tabs are positioned
   below the clip boundary — only the very top few pixels peek above the line.
   The active tab snaps up to full height. Hover slides any tab into view.
   The result: only what matters is visible; everything else almost disappears.
──────────────────────────────────────────────────────────────────────────── */
#nav{
  position:sticky;top:0;z-index:200;
  display:flex;
  align-items:flex-end;   /* items hang from the bottom of the bar */
  height:52px;
  overflow:hidden;        /* THE CLIP — this is what creates the slide effect */
  border-bottom:2px solid #000;
  background:#fff;
}
#nav .brand{
  font-size:17px;font-weight:900;letter-spacing:-.5px;
  padding:0 28px;
  height:52px;
  display:flex;align-items:center;
  border-right:2px solid #000;
  flex-shrink:0;cursor:pointer;white-space:nowrap;
  transition:background .1s,color .1s;
}
#nav .brand:hover{background:#000;color:#fff;}

/* Each nav item is taller than the nav bar.
   By default it's shifted DOWN so only its top peeks above the clip line.
   Active and hovered items translate back to show the full tab.         */
.nav-item{
  font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  padding:0 22px;
  height:80px;           /* taller than nav's 52px */
  display:flex;
  align-items:flex-start; /* text at the top of the tall item */
  padding-top:14px;       /* positions text ~14px from item top */
  cursor:pointer;user-select:none;white-space:nowrap;
  border-right:1px solid var(--light-rule);
  flex-shrink:0;
  /* Start position: item shifted so its text is just below the nav clip     */
  /* With align-items:flex-start + padding-top:14px, text is at item-y≈14px  */
  /* translate(+38px): text lands at nav-y≈52px = exactly at the border      */
  /* → inactive tabs show only the very top edge of their text                */
  transform:translateY(38px);
  transition:transform .32s cubic-bezier(.16,1,.3,1),background .12s,color .12s;
}
.nav-item:hover{
  transform:translateY(0);  /* full item visible, text at nav-y≈14px from top */
}
.nav-item.active{
  transform:translateY(0);
  background:#000;color:#fff;
  border-right:1px solid #333;
  align-items:center;        /* re-center text in full-height visible state */
  padding-top:0;
}
#nav .user-area{
  margin-left:auto;
  display:flex;align-items:center;gap:10px;
  font-size:11px;padding:0 24px;
  border-left:1px solid var(--light-rule);
  height:52px;flex-shrink:0;
}

/* ─── ROLE + STATUS TAGS ───────────────────────────────────────────────── */
.role-tag{
  font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 6px;border:1px solid #000;
}
.role-tag.admin{background:#000;color:#fff;}
.role-tag.crafter{border-color:var(--red);color:var(--red);}
.role-tag.crafter_pending{border-color:#f59e0b;color:#f59e0b;}
.role-tag.provider{border-color:#aaa;color:#888;}
.role-tag.logistics{border-color:#000;color:#000;}  /* blue → black in OMA */
.role-tag.logistics_pending{border-color:#888;color:#888;opacity:.7;}
.role-tag.removed{border-color:var(--red);color:var(--red);}

/* Live dot: a ticking black square, no colour */
.live-dot{
  width:5px;height:5px;
  background:#000;display:inline-block;
  /* no border-radius = square dot */
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0;}}
.live-dot{animation:pulse 1.6s infinite;}

/* ─── PAGE SHELL ────────────────────────────────────────────────────────── */
.page{padding:64px 64px 120px;max-width:none;}
/* The page title IS the page. Make it graphic. */
.page-title{
  font-size:clamp(80px,12vw,200px);
  font-weight:900;
  letter-spacing:-0.05em;
  line-height:.86;
  margin-bottom:0;
  text-transform:uppercase;
}
.page-sub{
  font-size:10px;color:var(--mid);
  margin:18px 0 56px;
  letter-spacing:.18em;text-transform:uppercase;
}
hr.thick{border:none;border-top:2px solid #000;margin:48px 0;}
hr.thin{border:none;border-top:1px solid #e0e0e0;margin:0;}

/* ─── BUTTONS ───────────────────────────────────────────────────────────── */
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  padding:12px 24px;
  transition:background .1s,color .1s,border-color .1s;
}
.btn-black{background:#000;color:#fff;}
.btn-black:hover{background:var(--red);}
.btn-outline{background:#fff;color:#000;border:1.5px solid #000;}
.btn-outline:hover{background:#000;color:#fff;border-color:#000;}
.btn-red{background:var(--red);color:#fff;}
.btn-red:hover{background:#000;}
.btn-sm{padding:6px 14px;font-size:8px;}
.btn-ghost{
  background:none;color:var(--mid);border:1px solid #ccc;
  padding:6px 14px;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  transition:all .1s;
}
.btn-ghost:hover{border-color:#000;background:#000;color:#fff;}
.btn-max{
  height:100%;background:#000;color:#fff;padding:0 22px;
  font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  border:1.5px solid #000;white-space:nowrap;
  transition:background .1s;
}
.btn-max:hover{background:var(--red);border-color:var(--red);}

/* ─── FORMS — underline only, no box ────────────────────────────────────── */
label.lbl{
  display:block;font-size:8px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;
  margin-bottom:10px;color:var(--mid);
}
input[type=text],input[type=password],input[type=number],select{
  display:block;width:100%;
  border:none;
  border-bottom:1.5px solid #000;
  padding:10px 0;
  font-size:14px;font-family:inherit;
  background:transparent;
  appearance:none;-webkit-appearance:none;outline:none;
  border-radius:0;
  transition:border-color .12s;
}
input:focus,select:focus{border-bottom-color:var(--red);}
input::placeholder{color:#ccc;}
.field{margin-bottom:28px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;}

/* ─── PANEL ─────────────────────────────────────────────────────────────── */
.panel{border:1.5px solid #000;padding:40px;}
.collapsible{display:none;}
.collapsible.open{display:block;}

/* ─── TABLES — full row invert on hover ─────────────────────────────────── */
table{width:100%;border-collapse:collapse;}
thead th{
  font-size:8px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  padding:14px 18px;
  border-top:2px solid #000;border-bottom:2px solid #000;
  text-align:left;white-space:nowrap;background:#fff;
}
tbody td{
  padding:16px 18px;
  border-bottom:1px solid #ebebeb;
  vertical-align:middle;
}
tbody tr{transition:background .08s,color .08s;}
/* OMA-style: rows invert on hover — black background, white text */
tbody tr:hover{background:#000;color:#fff;}
tbody tr:hover .q{background:#fff;color:#000;}
tbody tr:hover .unit-tag{border-color:#444;color:#aaa;}
tbody tr:hover .cat-tag{background:#222;color:#bbb;}
tbody tr:hover .sys-badge{background:#fff;color:#000;}
tbody tr:hover .loc-display{color:#ccc;}
tbody tr:hover .btn-ghost,
tbody tr:hover .btn-outline{border-color:#fff;color:#fff;background:transparent;}
tbody tr:hover .btn-del{border-color:var(--red);color:var(--red);}
tbody tr:hover .role-tag{border-color:#fff;color:#fff;}
tbody tr:hover .role-tag.admin{background:#fff;color:#000;}
.empty{
  padding:100px 0;text-align:center;
  color:#ccc;font-size:9px;letter-spacing:.24em;text-transform:uppercase;
}

/* ─── INLINE TAGS ────────────────────────────────────────────────────────── */
.q{display:inline-block;padding:2px 7px;font-size:9px;font-weight:700;background:#000;color:#fff;transition:background .08s,color .08s;}
.unit-tag{display:inline-block;padding:1px 5px;font-size:8px;font-weight:700;letter-spacing:.08em;border:1px solid #ccc;color:#888;margin-left:4px;}
.cat-tag{display:inline-block;padding:1px 5px;font-size:8px;font-weight:700;letter-spacing:.08em;background:#f0f0f0;color:#666;}
.item-cat-tag{display:inline-block;padding:2px 8px;font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:#000;color:#fff;}

/* ─── CRAFT ──────────────────────────────────────────────────────────────── */
.craft-box{border:2px solid #000;padding:36px;margin-bottom:40px;}
.craft-box.err{border-color:var(--red);}
/* Quality display: large graphic number */
.q-big{
  font-size:clamp(72px,10vw,160px);
  font-weight:900;letter-spacing:-0.05em;line-height:.85;
}

/* ─── LOG BADGES — black/red only, no other colours ────────────────────── */
.badge{display:inline-block;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;}
.badge-crafted{background:var(--red);color:#fff;}
.badge-material_added,.badge-material_moved,.badge-material_removed,
.badge-item_created,.badge-item_deleted,.badge-item_handed_out,
.badge-task_created,.badge-task_accepted,.badge-task_completed,
.badge-crafter_approved,.badge-role_approved,.badge-admin_granted{background:#000;color:#fff;}
.badge-member_removed{background:var(--red);color:#fff;}
.badge-crafter_denied,.badge-role_denied{background:#555;color:#fff;}
.badge-user_joined{background:#e8e8e8;color:#555;}

/* ─── INVENTORY CARDS ────────────────────────────────────────────────────── */
.inv-quality{
  font-size:clamp(52px,8vw,120px);
  font-weight:900;letter-spacing:-0.05em;line-height:.86;
}
.inv-row{padding:32px 0;border-bottom:1px solid #ebebeb;}
.inv-row:last-child{border-bottom:none;}

/* ─── TASK CARDS ─────────────────────────────────────────────────────────── */
/* Stripped back: all priorities are black-bordered, urgent gets the red stripe */
.task-card{
  padding:24px 32px;
  border:1.5px solid #e0e0e0;margin-bottom:4px;
  border-left:4px solid transparent;
  transition:border-color .1s,background .1s;
}
.task-card:hover{border-color:#000;background:#fafafa;}
.task-card.urgent{border-left-color:var(--red);}
.task-card.high,.task-card.normal{border-left-color:#000;}
.task-card.whenever{border-left-color:#ccc;}
.task-card.completed{opacity:.3;}
.task-card.cancelled{opacity:.18;}
/* Priority badges: urgent=red, everything else=black */
.p-badge{display:inline-block;padding:2px 8px;font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-right:4px;}
.p-urgent{background:var(--red);color:#fff;}
.p-high,.p-normal{background:#000;color:#fff;}
.p-whenever{background:#e8e8e8;color:#555;}
/* Role badges: all black outlines, no colour mixing */
.role-badge{display:inline-block;padding:1px 6px;font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid #000;margin-right:3px;}
.rb-provider{border-color:#bbb;color:#999;}
.rb-crafter{border-color:var(--red);color:var(--red);}
.rb-logistics,.rb-admin{background:#000;color:#fff;border-color:#000;}
.btn-del{
  background:none;border:1px solid #ddd;color:#888;
  padding:4px 10px;font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;transition:all .1s;
}
.btn-del:hover{background:var(--red);color:#fff;border-color:var(--red);}
.pending-note{background:#fffbeb;border-left:2px solid #f59e0b;padding:12px 16px;font-size:12px;color:#92400e;margin-top:10px;line-height:1.6;display:none;}

/* ─── AUTH SCREEN ────────────────────────────────────────────────────────── */
.center-screen{
  min-height:100vh;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:40px;background:#fff;
}
.auth-box{width:100%;max-width:380px;}
/* Auth logo: use the same extreme sizing as page titles */
.auth-logo{
  font-size:clamp(72px,14vw,160px);
  font-weight:900;letter-spacing:-0.05em;
  text-align:left;margin-bottom:80px;line-height:.85;
}
.tabs{display:flex;border-bottom:2px solid #000;margin-bottom:40px;}
.tab-btn{
  flex:1;padding:16px;
  font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  text-align:center;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-2px;
  background:none;color:#bbb;transition:all .12s;
}
.tab-btn.active{border-bottom-color:#000;color:#000;}
.err-msg{font-size:11px;color:var(--red);margin-bottom:12px;display:none;}
.chk-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer;}
.chk-row input{width:auto;flex-shrink:0;}
.chk-row span{font-size:13px;}

/* ─── SETUP ──────────────────────────────────────────────────────────────── */
.setup-note{font-size:12px;color:#888;margin-top:16px;line-height:1.7;}
.code-block{background:#f5f5f5;border-left:2px solid #000;padding:10px 14px;font-family:monospace;font-size:12px;margin:8px 0;}

/* ─── TOAST + MODAL ──────────────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:20px;right:20px;
  background:#000;color:#fff;
  padding:12px 22px;font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  display:none;z-index:999;
}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:center;justify-content:center;padding:24px;}
#modal-overlay.open{display:flex;}
.modal-box{
  background:#fff;
  padding:64px;
  width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
  /* No rounded corners, no shadow — clean block */
  border-left:4px solid #000;
}
.modal-title{
  font-size:clamp(32px,5vw,56px);
  font-weight:900;letter-spacing:-0.04em;
  margin-bottom:40px;line-height:.88;
}
.search-row{display:flex;gap:12px;align-items:center;margin-bottom:32px;}
.search-row input{max-width:300px;margin:0;}

/* ─── MISC INLINE ELEMENTS ───────────────────────────────────────────────── */
.unit-inline{font-size:9px;font-weight:700;color:#999;margin-left:4px;letter-spacing:.1em;}
.loc-display{font-size:12px;color:#555;transition:color .08s;}
/* System badges: black=Stanton, red=Pyro, dark=Nyx — no blue */
.sys-badge{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:#000;padding:1px 6px;margin-right:4px;}
.sys-badge.pyro{background:var(--red);}
.sys-badge.nyx{background:#444;}

/* ─── FILTER TABS — joined, architectural ───────────────────────────────── */
.filter-tabs{display:flex;gap:0;flex-wrap:wrap;margin-bottom:36px;}
.filter-tab{
  padding:8px 18px;
  font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  border:1.5px solid #000;border-right:none;
  background:#fff;color:#000;cursor:pointer;
  transition:background .1s,color .1s;
}
.filter-tab:last-child{border-right:1.5px solid #000;}
.filter-tab.active{background:#000;color:#fff;}
.filter-tab:hover:not(.active){background:#f0f0f0;}

/* Sub-tabs inside craft page */
.sub-tabs{display:flex;border-bottom:2px solid #000;margin-bottom:52px;}
.sub-tab{
  padding:18px 40px 18px 0;
  font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;
  background:none;color:#aaa;transition:color .12s;
}
.sub-tab.active{border-bottom-color:#000;color:#000;}
.sub-tab:hover:not(.active){color:#555;}

/* ─── HINT BOX ───────────────────────────────────────────────────────────── */
.hint-box{background:#f5f5f5;border-left:2px solid #000;padding:14px 18px;font-size:11px;color:#555;margin-top:8px;line-height:1.7;}
.hint-box strong{color:#000;}

/* ─── OVERVIEW PAGE ──────────────────────────────────────────────────────── */
/* No max-width: let the numbers breathe full viewport width */
.ov-wrap{padding:0;}
.ov-header{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:56px 64px 40px;
  border-bottom:2px solid #000;
}
/* The title IS the graphic — let it be huge */
.ov-title{
  font-size:clamp(100px,18vw,320px);
  font-weight:900;letter-spacing:-0.06em;line-height:.84;
  text-transform:uppercase;
}
.ov-date{
  font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:#999;text-align:right;line-height:2.6;
  padding-bottom:8px;  /* aligns with title baseline */
}
.ov-greeting{font-size:10px;color:#888;margin-top:12px;letter-spacing:.12em;}

/* Stats strip: numbers fill the column */
.ov-stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:2px solid #000;}
.ov-stat{
  padding:40px 0 40px 64px;
  border-right:1px solid #e0e0e0;
  cursor:default;
}
.ov-stat:last-child{border-right:none;}
/* Stat number: a raw typographic mass */
.ov-stat-num{
  font-size:clamp(72px,10vw,160px);
  font-weight:900;letter-spacing:-0.06em;line-height:.86;
  margin-bottom:12px;
  transition:color .15s;
}
.ov-stat-num.red{color:var(--red);}
.ov-stat-label{font-size:8px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#999;}
.ov-stat-sub{font-size:10px;color:#bbb;margin-top:6px;}

/* Two-column body */
.ov-body{
  display:grid;grid-template-columns:3fr 2fr;
  border-bottom:2px solid #000;
}
.ov-col{padding:40px 64px;}
.ov-col+.ov-col{border-left:1px solid #e0e0e0;padding-left:48px;}
.ov-col-head{
  font-size:8px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
  margin-bottom:28px;padding-bottom:16px;border-bottom:2px solid #000;
}
.ov-entry{
  display:grid;grid-template-columns:60px 1fr auto;gap:12px;
  padding:14px 0;border-bottom:1px solid #f0f0f0;align-items:baseline;
}
.ov-entry:last-child{border-bottom:none;}
.ov-entry-date{font-size:8px;color:#ccc;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;}
.ov-entry-body{font-size:12px;line-height:1.5;}
.ov-entry-who{font-size:8px;color:#aaa;font-weight:700;letter-spacing:.06em;white-space:nowrap;}
.ov-task-row{padding:14px 0;border-bottom:1px solid #f0f0f0;}
.ov-task-row:last-child{border-bottom:none;}
.ov-task-title{font-size:13px;font-weight:700;margin-bottom:4px;}
.ov-task-meta{font-size:11px;color:#999;}

/* Bottom two-column */
.ov-bottom{display:grid;grid-template-columns:3fr 2fr;}
.ov-empty{color:#ccc;font-size:9px;padding:24px 0;letter-spacing:.2em;text-transform:uppercase;}

/* ─── ARCHIVE MONTHS ──────────────────────────────────────────────────────── */
details.log-month{border-bottom:1px solid #e0e0e0;}
details.log-month>summary{
  display:flex;align-items:center;gap:16px;
  padding:22px 0;cursor:pointer;user-select:none;list-style:none;
}
details.log-month>summary::-webkit-details-marker{display:none;}
details.log-month>summary::marker{display:none;}
details.log-month>summary:hover{background:#fafafa;padding-left:8px;transition:padding .15s;}
.log-month-arrow{font-size:8px;color:#999;transition:transform .15s;display:inline-block;flex-shrink:0;}
details.log-month[open] .log-month-arrow{transform:rotate(90deg);}
.log-month-name{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.log-month-count{font-size:10px;color:#bbb;margin-left:auto;letter-spacing:.06em;}
details.log-month>div{padding-bottom:32px;}
</style>
</head>

<!-- Version switcher -->
<div style="position:fixed;bottom:20px;left:20px;z-index:9999;display:flex;gap:6px;">

  <span style="background:#000;color:#fff;border:1.5px solid #000;padding:5px 12px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;">OMA</span>
</div>

<div id="root"></div>
<div id="toast"></div>
<div id="modal-overlay" onclick="modalOverlayClick(event)"><div class="modal-box" id="modal-box"></div></div>

<script>
// ─── STATIC DATA ─────────────────────────────────────────────────────────────
const SC_CATALOG = [
  // Ores — SCU (decimals allowed)
  { cat:'Ores', name:'Agricium',      unit:'SCU' },
  { cat:'Ores', name:'Aluminium',     unit:'SCU' },

// ─── CONVEX HTTP HELPERS ──────────────────────────────────────────────────────
async function convexQuery(path, args = {}) {
  const r = await fetch(`${CONVEX_URL}/api/query`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ path, args, format:'json' }),
  });
  const d = await r.json();
  if (d.status !== 'success') throw new Error(d.errorMessage || 'Query failed');
  return d.value;
}
async function convexMutation(path, args = {}) {
  const r = await fetch(`${CONVEX_URL}/api/mutation`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ path, args, format:'json' }),
  });
  const d = await r.json();
  if (d.status !== 'success') throw new Error(d.errorMessage || 'Mutation failed');
  return d.value;
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
async function hashPwd(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw+'|mattrack_v1'));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtDate = d => new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const fmtDT   = d => new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function toast(msg, dur=2800) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',dur);
}
function showErr(id, msg) { const el=document.getElementById(id); if(el){el.textContent=msg;el.style.display='block';} }

async function refreshAll(silent=false) {
  try {
    const [stock, items, archive, allUsers, inventory, tasks] = await Promise.all([
      convexQuery('materials:getAvailable'),
      convexQuery('craftItems:getAll'),
      convexQuery('archive:getAll'),
      convexQuery('users:getAllUsers'),
      convexQuery('inventory:getAll'),
      convexQuery('tasks:getAll'),
    ]);
    state.stock      = stock     || [];
    state.craftItems = items     || [];
    state.archive    = archive   || [];
    state.allUsers   = allUsers  || [];
    state.inventory  = inventory || [];
    state.tasks      = tasks     || [];
    // Sync logged-in user's roles from server
    if(state.user) {
      const fresh=state.allUsers.find(u=>u._id===state.user._id);
      if(fresh) state.user=fresh;
    }
    updateLiveView();
  } catch(e) { if(!silent) console.warn('Refresh:', e.message); }
}
function startPolling() { refreshAll(); pollTimer=setInterval(()=>refreshAll(true),5000); }
function stopPolling()  { if(pollTimer) clearInterval(pollTimer); }

function updateLiveView() {
  if (currentPage==='materials') {
    const av=state.stock.filter(m=>m.status==='available');
    const t=document.getElementById('mat-table'); if(t) t.innerHTML=renderMatTable(av);
    const s=document.getElementById('mat-count'); if(s) s.textContent=`${av.length} entr${av.length===1?'y':'ies'} in stock`;
  }
  if (currentPage==='inventory') {
    const el=document.getElementById('inv-list'); if(el) el.innerHTML=renderInvList();
    const avail=state.inventory.filter(i=>i.status==='available').length;
    const s=document.getElementById('inv-count'); if(s) s.textContent=`${avail} item${avail!==1?'s':''} in stock`;
  }
  if (currentPage==='craft') {
    if(craftSubTab==='items') {
      const el=document.getElementById('items-list'); if(el) el.innerHTML=renderItemsList();
      const s=document.getElementById('items-count'); if(s) s.textContent=`${state.craftItems.length} item${state.craftItems.length!==1?'s':''} defined`;
    } else {
      const sel=document.getElementById('craft-sel');
      if(sel) { const prev=sel.value; sel.innerHTML=craftItemOptgroups(); if(prev) sel.value=prev; }
    }
  }
  if (currentPage==='archive') {
    // Re-render grouped archive; preserve open/closed state of months
    const openMonths=new Set([...document.querySelectorAll('details.log-month[open]')].map(d=>d.dataset.key));
    const el=document.getElementById('archive-table');
    if(el) el.innerHTML=renderArchiveTable(openMonths);
    const s=document.getElementById('archive-count'); if(s) s.textContent=`${state.archive.length} action${state.archive.length!==1?'s':''} recorded`;
  }
  if (currentPage==='craft' && craftState.itemId) recomputePlan();
  if (currentPage==='admin') {
    const el=document.getElementById('admin-wrap'); if(el) el.innerHTML=renderAdminContent();
  }
  if (currentPage==='tasks') {
    const el=document.getElementById('tasks-list'); if(el) el.innerHTML=renderTasksList();
  }
  if (currentPage==='overview') {
    const pw=document.getElementById('page-wrap');
    if(pw) pw.innerHTML=`<div class="page" style="padding:0;">${pageOverview()}</div>`;
  }
  // Sync nav for role changes (e.g. crafter approved)
  renderNav();
}

async function doSignIn() {
  const username=(document.getElementById('si-user')||{value:''}).value.trim();
  const password=(document.getElementById('si-pass')||{value:''}).value;
  if(!username||!password){showErr('si-err','Fill in all fields');return;}
  try {
    const ph=await hashPwd(password);
    const user=await convexQuery('users:authenticate',{username,passwordHash:ph});
    if(!user){showErr('si-err','Invalid username or password');return;}
    state.user=user; localStorage.setItem('mattrack_uid',user._id); showApp();
  } catch(e){showErr('si-err',e.message);}
}

function toggleCrafterNote() {
  const chk=(document.getElementById('su-craft')||{checked:false});
  const note=document.getElementById('crafter-pending-note');
  if(note) note.style.display=chk.checked?'block':'none';
}
function toggleLogisticsNote() {
  const chk=(document.getElementById('su-logi')||{checked:false});
  const note=document.getElementById('logistics-pending-note');
  if(note) note.style.display=chk.checked?'block':'none';
}

async function doSignUp() {
  const username=(document.getElementById('su-user')||{value:''}).value.trim();
  const password=(document.getElementById('su-pass')||{value:''}).value;
  const isProv=(document.getElementById('su-prov')||{checked:true}).checked;
  const isCraft=(document.getElementById('su-craft')||{checked:false}).checked;
  const isLogi=(document.getElementById('su-logi')||{checked:false}).checked;
  if(!username||!password){showErr('su-err','Fill in all fields');return;}
  if(!isProv&&!isCraft&&!isLogi){showErr('su-err','Select at least one role');return;}
  try {
    const ph=await hashPwd(password);
    const roles=[...(isProv?['provider']:[]),...(isCraft?['crafter_pending']:[]),...(isLogi?['logistics_pending']:[])];
    const user=await convexMutation('users:signUp',{username,passwordHash:ph,roles});
    await convexMutation('archive:addLog',{type:'user_joined',userId:user._id,userName:username,details:{roles}});
    state.user=user; localStorage.setItem('mattrack_uid',user._id); showApp();
  } catch(e){
    showErr('su-err',e.message.includes('USERNAME_TAKEN')?'Username already taken':e.message);
  }
}

  const openTasks  = state.tasks.filter(t=>t.status==='open');
  const urgentCnt  = openTasks.filter(t=>t.priority==='urgent').length;
  const memberCnt  = state.allUsers.filter(u=>!u.roles.includes('removed')).length;
  const pendingCnt = state.allUsers.filter(u=>u.roles.some(r=>r.endsWith('_pending'))).length;

  // Recent log (last 7)
  const recentLog = state.archive.slice(0,7);

  const prioOrder = {urgent:0,high:1,normal:2,whenever:3};
  const topTasks = openTasks.slice().sort((a,b)=>(prioOrder[a.priority]??2)-(prioOrder[b.priority]??2)).slice(0,6);

  // Stock breakdown
  const oreEntries = matAvail.filter(m=>m.category==='Ores');
  const gemEntries = matAvail.filter(m=>m.category==='Gems');

  // Inventory breakdown
  const recentCrafted = state.inventory.slice().sort((a,b)=>b._creationTime-a._creationTime).slice(0,5);

  // Log entry formatting (compact)
  const logLabels = {crafted:'Crafted',material_added:'Added',material_removed:'Removed',material_moved:'Moved',item_created:'Item Def.',item_deleted:'Deleted',item_handed_out:'Handed Out',user_joined:'Joined',role_approved:'Approved',role_denied:'Denied',admin_granted:'Admin',member_removed:'Removed',task_created:'Task',task_accepted:'Accepted',task_completed:'Completed'};
  function fmtLogCompact(e) {
    const d=e.details||{};
    switch(e.type){
      case 'material_added':   return `${esc(d.materialName)} &times;${d.quantity} ${esc(d.unit||'')} &middot; q${d.quality} &middot; ${esc(d.location||'')}`;
      case 'material_removed': return `${esc(d.materialName)} &times;${d.quantity} ${esc(d.unit||'')}`;

      case 'user_joined':      return `Roles: ${(d.roles||[]).join(', ')}`;
      case 'role_approved':    return `${esc(d.targetUsername)} &rarr; ${esc(d.role||'')}`;
      case 'task_created':     return esc(d.title||'');
      case 'task_accepted':    return esc(d.title||'');
      case 'task_completed':   return esc(d.title||'');
      default: return '';
    }
  }
  function shortDate(ts) {
    const d=new Date(ts);
    return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  }

  return `<div class="ov-wrap">

    <div class="ov-header">

        <div class="ov-title">OVERVIEW</div>

      <td><span class="q">${m.quality}</span></td>

      <td style="font-size:12px;">${esc(m.ownerName)}${m.ownerId===u._id?' <span style="color:#bbb;">(you)</span>':''}</td>

      <td style="white-space:nowrap;">
        ${(m.ownerId===u._id||admin)?`<button class="btn-ghost btn-sm" style="margin-right:4px;" onclick="openMoveModal('${esc(m._id)}')">Move</button>`:''}
        ${(m.ownerId===u._id||admin)?`<button class="${admin&&m.ownerId!==u._id?'btn-del':'btn-ghost btn-sm'}" onclick="removeMaterial('${esc(m._id)}')">${admin&&m.ownerId!==u._id?'✕':'Remove'}</button>`:''}

function onMatCatChange() {
  const cat=(document.getElementById('mat-cat-sel')||{value:'Ores'}).value;
  const nameSel=document.getElementById('mat-name-sel');
  if(nameSel) nameSel.innerHTML=matNameOptions(cat);
  const newWrap=document.getElementById('mat-new-wrap'); if(newWrap) newWrap.style.display='none';
  updateMatQtyUnit(cat);
}
function onMatNameChange() {
  const val=(document.getElementById('mat-name-sel')||{value:''}).value;
  const newWrap=document.getElementById('mat-new-wrap');
  if(newWrap) newWrap.style.display=(val==='__new__'?'block':'none');
}
function updateMatQtyUnit(cat) {
  const u=cat==='Gems'?'UNIT':'SCU';
  const lbl=document.getElementById('mat-qty-lbl'); if(lbl) lbl.textContent=`Quantity (${u})`;
  const hint=document.getElementById('mat-qty-hint');
  if(hint) hint.textContent=u==='SCU'?'0.01 SCU increments':'Whole amounts only (1 unit minimum)';
  const inp=document.getElementById('mat-qty');
  if(inp){ inp.step=u==='SCU'?'0.01':'1'; inp.min=u==='SCU'?'0.01':'1'; }
}
function onSystemChange() {
  const sys=(document.getElementById('mat-system')||{value:''}).value;
  const locSel=document.getElementById('mat-location');
  if(locSel) locSel.innerHTML=sys?locationOptions(sys):'<option value="">Select system first…</option>';
}

function filterMaterials() {
  const q=(document.getElementById('mat-search')||{value:''}).value.toLowerCase();
  const mine=(document.getElementById('mat-mine')||{checked:false}).checked;
  const typeF=(document.getElementById('mat-type-filter')||{value:'all'}).value;
  let stock=state.stock.filter(m=>m.status==='available');
  if(mine) stock=stock.filter(m=>m.ownerId===state.user._id);
  if(typeF!=='all') stock=stock.filter(m=>m.category===typeF);
  if(q) stock=stock.filter(m=>
    m.materialName.toLowerCase().includes(q)||
    m.location.toLowerCase().includes(q)||
    m.system.toLowerCase().includes(q)||
    m.ownerName.toLowerCase().includes(q)||
    m.category.toLowerCase().includes(q));
  const el=document.getElementById('mat-table');
  if(el) el.innerHTML=renderMatTable(stock);
}

async function addMaterial() {
  const u=state.user;
  const category=(document.getElementById('mat-cat-sel')||{value:'Ores'}).value;
  let name=(document.getElementById('mat-name-sel')||{value:''}).value;
  let unit=category==='Gems'?'UNIT':'SCU';
  if (name==='__new__') {
    name=(document.getElementById('mat-new-name')||{value:''}).value.trim();
    if(!name){alert('Enter material name');return;}
  } else if (!name) {
    alert('Select a material'); return;
  } else {
    const entry=catLookup(name);
    if(entry){ unit=entry.unit; }
  }
  const qual=parseInt((document.getElementById('mat-quality')||{value:''}).value);
  const qty=parseFloat((document.getElementById('mat-qty')||{value:''}).value);
  const system=(document.getElementById('mat-system')||{value:''}).value;
  const location=(document.getElementById('mat-location')||{value:''}).value;
  if(!name||isNaN(qual)||isNaN(qty)||!system||!location){alert('Fill in all fields');return;}
  if(qual<0||qual>1000){alert('Quality must be 0–1000');return;}
  if(qty<=0){alert('Quantity must be greater than 0');return;}
  try {
    if(!SC_CATALOG.find(m=>m.name===name))
      await convexMutation('materials:addToCatalog',{name,category,unit});
    await convexMutation('materials:add',{materialName:name,category,unit,quality:qual,quantity:qty,system,location,ownerId:u._id,ownerName:u.username});
    await convexMutation('archive:addLog',{type:'material_added',userId:u._id,userName:u.username,details:{materialName:name,category,unit,quality:qual,quantity:qty,system,location}});
    toast('Material added');
    togglePanel('add-mat-panel');
    await refreshAll();
  } catch(e){alert(e.message);}
}

async function removeMaterial(id) {
  if(!confirm('Remove this material from stock?')) return;
  try {
    await convexMutation('materials:remove',{id,userId:state.user._id});
    toast('Removed');
    await refreshAll();
  } catch(e){alert(e.message);}
}

function setItemsFilter(f) {
  itemsFilter=f;

    const isActive=(f==='all'&&match==='All')||ITEM_CATEGORIES.some(c=>c.id===f&&c.label===match);
    btn.classList.toggle('active',isActive);
  });

function renderItemsList() {
  const u=state.user; const admin=isAdmin(u);

  if(!items.length) return `<div class="empty">No craftable items defined${itemsFilter!=='all'?' in this category':''}.</div>`;
  return items.map(item=>`

function addReqRow() {
  const container=document.getElementById('req-rows'); if(!container) return;
  const div=document.createElement('div');
  div.className='req-row';
  div.style.cssText='display:flex;gap:10px;margin-bottom:8px;align-items:center;';
  div.innerHTML=`
    <select class="req-mat" style="flex:2;margin:0;" onchange="onReqMatChange(this)">
      ${catalogOptgroups()}
    </select>
    <input type="number" class="req-qty" placeholder="Qty" min="0.01" step="0.01" style="flex:1;margin:0;">
    <span class="req-unit unit-inline" style="min-width:32px;"></span>
    <button class="btn-ghost btn-sm" onclick="this.parentNode.remove()">✕</button>`;
  container.appendChild(div);
}
function onReqMatChange(sel) {
  const span=sel.parentNode.querySelector('.req-unit');
  const qtyInp=sel.parentNode.querySelector('.req-qty');
  const u=sel.value?unitFor(sel.value):'';
  if(span) span.textContent=u;
  if(qtyInp&&u) { qtyInp.step=u==='SCU'?'0.01':'1'; qtyInp.min=u==='SCU'?'0.01':'1'; }
}

async function addItem() {
  const u=state.user;
  const name=(document.getElementById('item-name-inp')||{value:''}).value.trim();
  const category=(document.getElementById('item-cat-sel')||{value:''}).value;
  if(!name){alert('Enter item name');return;}
  if(!category){alert('Select a category');return;}
  const rows=document.querySelectorAll('.req-row');
  const reqs=[];
  rows.forEach(r=>{
    const mat=r.querySelector('.req-mat')?.value;
    const qty=parseFloat(r.querySelector('.req-qty')?.value);
    if(mat&&!isNaN(qty)&&qty>0) reqs.push({materialName:mat,quantity:qty,unit:unitFor(mat)});
  });
  if(!reqs.length){alert('Add at least one requirement');return;}
  try {
    await convexMutation('craftItems:add',{name,requirements:reqs,category,userId:u._id,userName:u.username});
    toast('Item saved');
    const ep=document.getElementById('add-item-panel'); if(ep) ep.classList.remove('open');
    await refreshAll();
  } catch(e){alert(e.message);}
}

function craftItemOptgroups() {
  const cs=craftState;
  let html=`<option value="">Choose item…</option>`;
  ITEM_CATEGORIES.forEach(cat=>{
    const items=state.craftItems.filter(i=>i.category===cat.id);
    if(!items.length) return;

function recomputePlan() {
  if(!craftState.itemId) return;
  const item=state.craftItems.find(i=>i._id===craftState.itemId); if(!item) return;
  if(craftState.mode==='range'){
    craftState.qMin=parseInt((document.getElementById('q-min')||{value:'0'}).value)||0;
    craftState.qMax=parseInt((document.getElementById('q-max')||{value:'1000'}).value)||1000;
  } else {
    craftState.qMin=0; craftState.qMax=1000; // best mode uses per-material threshold
  }
  const qty=Math.max(1,parseInt((document.getElementById('craft-qty')||{value:'1'}).value)||1);
  craftState.quantity=qty;
  craftState.plan=calcPlan(item,state.stock,craftState.mode,craftState.qMin,craftState.qMax,qty);
  // Update MAX button with live count
  const maxCount=calcMaxCrafts(item,state.stock,craftState.mode,craftState.qMin,craftState.qMax);
  const maxBtn=document.getElementById('max-btn');
  if(maxBtn) maxBtn.textContent=maxCount>0?`↑ MAX (${maxCount})`:'↑ MAX';
  const sa=document.getElementById('craft-summary-area'); if(sa) sa.innerHTML=renderCraftSummary(craftState.plan,maxCount);
  const da=document.getElementById('craft-detail-area'); if(da) da.innerHTML=renderCraftDetail(craftState.plan);
}

// Calculate max complete crafts available with current quality filter
function calcMaxCrafts(item, stock, mode, qMin, qMax) {
  if(!item.requirements.length) return 0;
  let maxCrafts = Infinity;
  for(const req of item.requirements){
    let pool=stock.filter(m=>m.materialName===req.materialName&&m.status==='available');
    if(mode==='range') {
      pool=pool.filter(m=>m.quality>=qMin&&m.quality<=qMax);
    } else {
      // best mode: within 50 of the best in this pool
      const best=pool.length>0?Math.max(...pool.map(m=>m.quality)):0;
      pool=pool.filter(m=>m.quality>=best-50);
    }
    const totalAvail=pool.reduce((s,m)=>s+m.quantity,0);
    if(req.quantity>0) maxCrafts=Math.min(maxCrafts, Math.floor(totalAvail/req.quantity));
    else maxCrafts=0;
  }
  return maxCrafts===Infinity?0:Math.max(0,maxCrafts);
}

function setMaxCrafts() {
  if(!craftState.itemId){ toast('Select an item first.'); return; }
  const item=state.craftItems.find(i=>i._id===craftState.itemId); if(!item) return;
  if(craftState.mode==='range'){
    craftState.qMin=parseInt((document.getElementById('q-min')||{value:'0'}).value)||0;
    craftState.qMax=parseInt((document.getElementById('q-max')||{value:'1000'}).value)||1000;
  }
  const max=calcMaxCrafts(item,state.stock,craftState.mode,craftState.qMin,craftState.qMax);
  if(max<=0){ toast('Not enough materials for even 1 craft with current quality settings.'); return; }
  const el=document.getElementById('craft-qty');
  if(el) el.value=max;
  craftState.quantity=max;
  recomputePlan();
}

function calcPlan(item, stock, mode, qMin, qMax, quantity=1) {
  const plan={item,quantity,canCraft:true,requirements:[],avgQuality:0,_qSum:0,_qUsed:0};
  for(const req of item.requirements){
    const totalNeeded=req.quantity*quantity;
    let pool=stock.filter(m=>m.materialName===req.materialName&&m.status==='available');
    if(mode==='range') {
      pool=pool.filter(m=>m.quality>=qMin&&m.quality<=qMax);
    } else {
      // best mode: within 50 of the best in this pool
      const best=pool.length>0?Math.max(...pool.map(m=>m.quality)):0;
      pool=pool.filter(m=>m.quality>=best-50);
    }
    pool.sort((a,b)=>b.quality-a.quality);
    let needed=totalNeeded;
    const batches=[];
    let qSum=0;
    for(const b of pool){
      if(needed<=0) break;
      const use=Math.min(needed,b.quantity);
      batches.push({stockId:b._id,materialName:b.materialName,unit:b.unit,quality:b.quality,quantityUse:use,quantityAvail:b.quantity,system:b.system,location:b.location,ownerName:b.ownerName,ownerId:b.ownerId});
      qSum+=b.quality*use; needed-=use;
    }
    const fulfilled=totalNeeded-needed;
    const avgQ=fulfilled>0?Math.round(qSum/fulfilled):0;
    plan.requirements.push({materialName:req.materialName,unit:req.unit,needed:totalNeeded,fulfilled,shortfall:needed,batches,avgQuality:avgQ,ok:needed<=0.0001});
    if(needed>0.0001) plan.canCraft=false;
    plan._qSum+=qSum; plan._qUsed+=fulfilled;
  }
  plan.avgQuality=plan._qUsed>0?Math.round(plan._qSum/plan._qUsed):0;
  return plan;
}

async function confirmCraft() {
  const plan=craftState.plan; if(!plan||!plan.canCraft) return;
  const system=(document.getElementById('cl-sys')||{value:''}).value;
  const location=(document.getElementById('cl-loc')||{value:''}).value;
  if(!system||!location){alert('Select a system and location');return;}
  const qty=plan.quantity||1;
  const u=state.user;
  const batches=plan.requirements.flatMap(r=>r.batches.map(b=>({stockId:b.stockId,quantityUse:b.quantityUse})));
  const materialsDetail=plan.requirements.flatMap(r=>r.batches.map(b=>({
    materialName:b.materialName,unit:b.unit,quality:b.quality,quantityUsed:b.quantityUse,
    system:b.system,location:b.location,ownerName:b.ownerName,
  })));
  try {
    closeModal();
    await convexMutation('materials:executeCraft',{
      batches,itemName:plan.item.name,avgQuality:plan.avgQuality,
      userId:u._id,userName:u.username,materialsDetail,
    });
    await convexMutation('inventory:add',{
      itemName:plan.item.name,
      itemId:plan.item._id,
      category:plan.item.category,
      quantity:qty,
      avgQuality:plan.avgQuality,
      craftedBy:u._id,
      craftedByName:u.username,
      system,
      location,
    });
    craftState={itemId:null,mode:'best',qMin:850,qMax:1000,quantity:1,plan:null};
    toast(`${qty>1?qty+'× ':''}${plan.item.name} crafted and added to inventory!`);
    await refreshAll();
    goTo('inventory');
  } catch(e){alert(e.message);}
}

function pageArchive(){
  return `
    <div class="page-title">LOG</div>
    <div class="page-sub" id="archive-count">${state.archive.length} action${state.archive.length!==1?'s':''} recorded</div>
    <div id="archive-table">${renderArchiveTable()}</div>`;
}

function renderArchiveTable(openMonths){
  if(!state.archive.length) return `<div class="empty">No actions logged yet.</div>`;

  const groups = {};
  const now = new Date();
  const currentKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  for(const e of state.archive){
    const d = new Date(e._creationTime);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(!groups[key]){
      groups[key] = {
        label: d.toLocaleDateString('en-GB',{month:'long',year:'numeric'}),
        entries: []
      };
    }
    groups[key].entries.push(e);
  }

  return Object.keys(groups).sort().reverse().map(key=>{
    const {label,entries} = groups[key];
    // Open if: current month, OR was manually opened before re-poll
    const isOpen = key===currentKey || (openMonths&&openMonths.has(key));
    return `<details class="log-month"${isOpen?' open':''} data-key="${key}">
      <summary>
        <span class="log-month-arrow">▶</span>
        <span class="log-month-name">${label}</span>
        <span class="log-month-count">${entries.length} entr${entries.length===1?'y':'ies'}</span>
      </summary>
      <div>${renderMonthRows(entries)}</div>
    </details>`;
  }).join('');
}

function renderMonthRows(entries){
  const admin=isAdmin(state.user);
  const labels={crafted:'Crafted',material_added:'Added',material_removed:'Removed',material_moved:'Moved',item_created:'New Item',item_deleted:'Deleted Item',item_handed_out:'Handed Out',user_joined:'Joined',role_approved:'Role Approved',role_denied:'Role Denied',crafter_approved:'Crafter Approved',crafter_denied:'Crafter Denied',admin_granted:'Admin Granted',member_removed:'Member Removed',task_created:'Task Created',task_accepted:'Task Accepted',task_completed:'Task Completed'};
  return `<table>
    <thead><tr><th>Date</th><th>Action</th><th>User</th><th>Details</th>${admin?'<th></th>':''}</tr></thead>
    <tbody>${entries.map(e=>`<tr>
      <td style="font-size:11px;color:#999;white-space:nowrap;">${fmtDT(e._creationTime)}</td>
      <td><span class="badge badge-${e.type}">${labels[e.type]||e.type}</span></td>
      <td style="font-weight:600;font-size:13px;">${esc(e.userName)}</td>
      <td style="font-size:12px;color:#555;">${fmtArchiveDetails(e)}</td>
      ${admin?`<td><button class="btn-del" onclick="adminDeleteLog('${esc(e._id)}')">✕</button></td>`:''}
    </tr>`).join('')}</tbody></table>`;
}
function fmtArchiveDetails(e){
  const d=e.details||{};
  switch(e.type){
    case 'material_added':
      return `${esc(d.materialName)} &middot; ${d.quantity} ${esc(d.unit||'')} &middot; q${d.quality} &middot; ${sysBadge(d.system)}${esc(d.location)}`;
    case 'material_removed':
      return `${esc(d.materialName)} &middot; ${d.quantity} ${esc(d.unit||'')} &middot; ${sysBadge(d.system)}${esc(d.location)}`;
    case 'crafted': {
      const lines=(d.materialsUsed||[]).map(m=>`${esc(m.materialName)} &times;${m.quantityUsed}${esc(m.unit||'')} (q${m.quality}, ${esc(m.ownerName)}, ${sysBadge(m.system)}${esc(m.location)})`).join(' | ');
      return `<strong>${esc(d.itemName)}</strong> &middot; avg q${d.avgQuality}<br><span style="font-size:11px;color:#aaa;">${lines}</span>`; }
    case 'item_created':
      return `${esc(d.itemName)} &middot; ${(d.requirements||[]).map(r=>`${esc(r.materialName)}&times;${r.quantity}${esc(r.unit||'')}`).join(', ')}`;
    case 'item_deleted':
      return `${esc(d.itemName)}`;
    case 'user_joined':
      return `Roles: ${(d.roles||[]).join(', ')}`;
    case 'role_approved':    return `Approved <strong>${esc(d.targetUsername)}</strong> as ${esc(d.role||'?')}`;
    case 'role_denied':      return `Denied <strong>${esc(d.targetUsername)}</strong> ${esc(d.role||'?')} request`;
    case 'crafter_approved': return `Approved <strong>${esc(d.targetUsername)}</strong> as Crafter`;
    case 'crafter_denied':   return `Denied <strong>${esc(d.targetUsername)}</strong> crafter request`;
    case 'admin_granted':    return `Granted admin to <strong>${esc(d.targetUsername)}</strong>`;
    case 'item_handed_out':  return `${esc(d.itemName)}${d.quantity>1?` &times;${d.quantity}`:''} &middot; avg q${d.avgQuality} &middot; to <strong>${esc(d.handedOutTo)}</strong>`;
    case 'material_moved':   return `${esc(d.materialName)} &middot; ${d.quantity} ${esc(d.unit||'')} &middot; ${sysBadge(d.fromSystem)}${esc(d.fromLocation)} &rarr; ${sysBadge(d.toSystem)}${esc(d.toLocation)}`;
    case 'member_removed':   return `Removed <strong>${esc(d.targetUsername)}</strong>`;
    case 'task_created':     return `<strong>${esc(d.title)}</strong> &middot; ${esc(d.type)} &middot; ${esc(d.priority)}`;

const TASK_PRIORITIES = [

  {id:'craft',   label:'Craft Item'},
  {id:'deliver', label:'Deliver'},

  {id:'logistics', label:'Logistics'},

function taskRoleBadge(role) {
  const map={provider:'rb-provider',crafter:'rb-crafter',logistics:'rb-logistics',admin:'rb-admin'};
  const labels={provider:'Provider',crafter:'Crafter',logistics:'Logistics',admin:'Admin'};
  return `<span class="role-badge ${map[role]||''}">${labels[role]||role}</span>`;
}

function taskTypeDesc(t) {
  switch(t.type) {
    case 'gather':  {
      let s=`Gather <strong>${esc(t.materialName||'?')}</strong>`;
      if(t.quantity) s+=` &times;${t.quantity}${t.unit?` ${esc(t.unit)}`:''}`;
      if(t.qualityMin||t.qualityMax) s+=` &middot; quality ${t.qualityMin||0}–${t.qualityMax||1000}`;
      return s; }
    case 'craft':   {
      let s=`Craft <strong>${esc(t.itemName||'?')}</strong>`;
      if(t.quantity) s+=` &times;${t.quantity}`;
      if(t.qualityMin||t.qualityMax) s+=` &middot; quality ${t.qualityMin||0}–${t.qualityMax||1000}`;
      return s; }
    case 'deliver': {
      let s=`Deliver`;
      if(t.materialName) s+=` <strong>${esc(t.materialName)}</strong>`;
      if(t.quantity) s+=` &times;${t.quantity}${t.unit?` ${esc(t.unit)}`:''}`;
      if(t.fromSystem) s+=` &mdash; from ${sysBadge(t.fromSystem)}${esc(t.fromLocation||'')}`;
      if(t.toSystem) s+=` to ${sysBadge(t.toSystem)}${esc(t.toLocation||'')}`;
      return s; }
    default: return esc(t.description||'');
  }
}

function renderTasksList() {
  const u=state.user; const admin=isAdmin(u);
  let tasks=state.tasks.filter(t=>t.status===tasksFilter);
  // Non-admins only see tasks targeted at their roles
  if(!admin) tasks=tasks.filter(t=>t.targetRoles.some(r=>u.roles.includes(r)));
  if(!tasks.length) return `<div class="empty">No ${tasksFilter} tasks${!admin?' for your role':''} yet.</div>`;
  tasks=tasks.slice().sort((a,b)=>{
    const po={urgent:0,high:1,normal:2,whenever:3};
    return (po[a.priority]??2)-(po[b.priority]??2)||b._creationTime-a._creationTime;
  });
  return tasks.map(t=>{
    const myAcceptee=t.acceptees.find(a=>a.userId===u._id);
    const activeSlots=t.acceptees.filter(a=>a.status!=='completed').length;
    const slotsLeft=t.slots-activeSlots;
    const isFull=slotsLeft<=0;
    const pb=TASK_PRIORITIES.find(p=>p.id===t.priority)||TASK_PRIORITIES[2];
    return `<div class="task-card ${t.priority} ${t.status}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;">
        <div style="flex:1;">
          <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
            <span class="p-badge ${pb.cls}">${pb.label}</span>
            ${t.targetRoles.map(r=>taskRoleBadge(r)).join('')}
            <span style="font-size:16px;font-weight:700;margin-left:4px;">${esc(t.title)}</span>
          </div>
          <div style="font-size:13px;color:#555;margin-bottom:10px;">${taskTypeDesc(t)}</div>
          <div style="font-size:11px;color:#999;">
            ${t.acceptees.length?`<span>Accepted by: ${t.acceptees.map(a=>`<strong style="color:${a.status==='completed'?'#16a34a':'#000'}">${esc(a.userName)}${a.status==='completed'?' ✓':''}</strong>`).join(', ')}</span>`:'<span>No acceptees yet</span>'}
            &nbsp;&middot;&nbsp; ${activeSlots}/${t.slots} slots filled
            &nbsp;&middot;&nbsp; by ${esc(t.createdByName)}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0;">
          ${t.status==='open'&&!myAcceptee&&!isFull?`<button class="btn btn-black btn-sm" onclick="acceptTask('${esc(t._id)}')">Accept</button>`:''}
          ${t.status==='open'&&myAcceptee&&myAcceptee.status!=='completed'?`<button class="btn btn-outline btn-sm" onclick="completeTask('${esc(t._id)}')">Mark Done</button>`:''}
          ${t.status==='open'&&myAcceptee&&myAcceptee.status!=='completed'?`<button class="btn-ghost btn-sm" onclick="unacceptTask('${esc(t._id)}')">Withdraw</button>`:''}
          ${admin&&t.status==='open'?`<button class="btn btn-red btn-sm" onclick="adminCompleteTask('${esc(t._id)}')">Complete Task</button>`:''}
          ${admin&&t.status==='open'?`<button class="btn-ghost btn-sm" onclick="adminCancelTask('${esc(t._id)}')">Cancel</button>`:''}
          ${admin?`<button class="btn-del" onclick="adminDeleteTask('${esc(t._id)}')">✕</button>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

async function acceptTask(taskId) {
  try {
    await convexMutation('tasks:accept',{taskId,userId:state.user._id});
    toast('Task accepted');
    await refreshAll();
  } catch(e){alert(e.message);}
}
async function completeTask(taskId) {
  try {
    await convexMutation('tasks:complete',{taskId,userId:state.user._id});
    toast('Marked as done');
    await refreshAll();
  } catch(e){alert(e.message);}
}
async function unacceptTask(taskId) {
  if(!confirm('Withdraw from this task?')) return;
  try {
    await convexMutation('tasks:unaccept',{taskId,userId:state.user._id});
    toast('Withdrawn');
    await refreshAll();
  } catch(e){alert(e.message);}
}
async function adminCompleteTask(taskId) {
  if(!confirm('Mark this entire task as completed?')) return;
  try {
    await convexMutation('tasks:complete',{taskId,userId:state.user._id});
    toast('Task completed');
    await refreshAll();
  } catch(e){alert(e.message);}
}
async function adminCancelTask(taskId) {
  if(!confirm('Cancel this task?')) return;
  try {
    await convexMutation('tasks:cancel',{taskId,adminId:state.user._id});
    toast('Task cancelled');
    await refreshAll();
  } catch(e){alert(e.message);}
}
async function adminDeleteTask(taskId) {
  if(!confirm('Delete this task permanently?')) return;
  try {
    await convexMutation('tasks:remove',{taskId,adminId:state.user._id});
    toast('Task deleted');
    await refreshAll();
  } catch(e){alert(e.message);}
}

function openCreateTaskModal() {
  showModal(`
    <div class="modal-title">Create Task</div>
    <div class="field">
      <label class="lbl">Title</label>
      <input type="text" id="ct-title" placeholder="Short task title…">
    </div>
    <div class="field">
      <label class="lbl">Type</label>
      <select id="ct-type" onchange="onCTTypeChange()">
        ${TASK_TYPES.map(t=>`<option value="${t.id}">${t.label}</option>`).join('')}
      </select>
    </div>
    <div id="ct-type-fields">${renderCTTypeFields('gather')}</div>
    <div class="field">
      <label class="lbl">Priority</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
        ${TASK_PRIORITIES.map((p,i)=>`<label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
          <input type="radio" name="ct-priority" value="${p.id}"${i===2?' checked':''}> <span class="p-badge ${p.cls}">${p.label}</span>
        </label>`).join('')}
      </div>
    </div>
    <div class="field">
      <label class="lbl">Visible to (roles)</label>
      <div style="display:flex;gap:12px;margin-top:4px;flex-wrap:wrap;">
        ${TASK_TARGET_ROLES.map(r=>`<label class="chk-row" style="margin:0;"><input type="checkbox" class="ct-role" value="${r.id}" style="width:auto;"> <span style="font-size:12px;">${r.label}</span></label>`).join('')}
      </div>
    </div>
    <div class="field">
      <label class="lbl">Available Slots <span style="font-weight:400;color:#999;">(how many members can accept)</span></label>
      <input type="number" id="ct-slots" value="1" min="1" step="1" style="max-width:100px;">
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-black" onclick="confirmCreateTask()">Create Task</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>`);
}

function renderCTTypeFields(type) {
  switch(type) {
    case 'gather': return `
      <div class="field"><label class="lbl">Material</label>
        <select id="ct-material"><option value="">Select material…</option>
          ${SC_CATALOG.map(m=>`<option value="${esc(m.name)}">${esc(m.name)}</option>`).join('')}
          <option value="__custom__">Other…</option>
        </select>
      </div>
      <div id="ct-mat-custom" style="display:none;" class="field"><input type="text" id="ct-material-custom" placeholder="Material name"></div>
      <div class="grid2" style="gap:12px;">
        <div class="field"><label class="lbl">Quantity</label><input type="number" id="ct-qty" min="0.01" step="0.01" placeholder="e.g. 100"></div>
        <div class="field"><label class="lbl">Unit</label><select id="ct-unit"><option value="SCU">SCU</option><option value="UNIT">UNIT</option></select></div>
      </div>
      <div class="grid2" style="gap:12px;">
        <div class="field"><label class="lbl">Min Quality (opt)</label><input type="number" id="ct-qmin" min="0" max="1000" placeholder="0"></div>
        <div class="field"><label class="lbl">Max Quality (opt)</label><input type="number" id="ct-qmax" min="0" max="1000" placeholder="1000"></div>
      </div>`;
    case 'craft': return `
      <div class="field"><label class="lbl">Item to Craft</label>
        <select id="ct-item"><option value="">Select item…</option>
          ${state.craftItems.map(i=>`<option value="${esc(i.name)}">${esc(i.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label class="lbl">Quantity</label><input type="number" id="ct-qty" min="1" step="1" placeholder="e.g. 5" style="max-width:120px;"></div>
      <div class="grid2" style="gap:12px;">
        <div class="field"><label class="lbl">Min Quality (opt)</label><input type="number" id="ct-qmin" min="0" max="1000" placeholder="0"></div>
        <div class="field"><label class="lbl">Max Quality (opt)</label><input type="number" id="ct-qmax" min="0" max="1000" placeholder="1000"></div>
      </div>`;
    case 'deliver': return `
      <div class="field"><label class="lbl">What (material/item name)</label><input type="text" id="ct-deliver-what" placeholder="e.g. Iron, P6-LR Sniper Rifle"></div>
      <div class="grid2" style="gap:12px;">
        <div class="field"><label class="lbl">Quantity</label><input type="number" id="ct-qty" min="0.01" step="0.01" placeholder="e.g. 50"></div>
        <div class="field"><label class="lbl">Unit</label><select id="ct-unit"><option value="SCU">SCU</option><option value="UNIT">UNIT</option></select></div>
      </div>
      <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:12px 0 8px;color:#555;">From</div>
      <div class="grid2" style="gap:12px;">
        <div class="field"><select id="ct-from-sys" onchange="onCTFromSysChange()"><option value="">System…</option>${Object.keys(SYSTEMS).map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>
        <div class="field"><select id="ct-from-loc"><option value="">Location…</option></select></div>
      </div>
      <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:12px 0 8px;color:#555;">To</div>
      <div class="grid2" style="gap:12px;">
        <div class="field"><select id="ct-to-sys" onchange="onCTToSysChange()"><option value="">System…</option>${Object.keys(SYSTEMS).map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>
        <div class="field"><select id="ct-to-loc"><option value="">Location…</option></select></div>
      </div>`;
    default: return `
      <div class="field"><label class="lbl">Description</label>
        <textarea id="ct-desc" rows="3" style="width:100%;border:1.5px solid #000;padding:9px 12px;font-size:13px;font-family:inherit;resize:vertical;" placeholder="Describe the task…"></textarea>
      </div>`;
  }
}

function onCTTypeChange() {
  const type=(document.getElementById('ct-type')||{value:'gather'}).value;
  const wrap=document.getElementById('ct-type-fields');
  if(wrap) wrap.innerHTML=renderCTTypeFields(type);
}
function onCTFromSysChange() {
  const s=(document.getElementById('ct-from-sys')||{value:''}).value;
  const l=document.getElementById('ct-from-loc'); if(l) l.innerHTML=s?locationOptions(s):'<option value="">Location…</option>';
}
function onCTToSysChange() {
  const s=(document.getElementById('ct-to-sys')||{value:''}).value;
  const l=document.getElementById('ct-to-loc'); if(l) l.innerHTML=s?locationOptions(s):'<option value="">Location…</option>';
}

async function confirmCreateTask() {
  const title=(document.getElementById('ct-title')||{value:''}).value.trim();
  const type=(document.getElementById('ct-type')||{value:'gather'}).value;
  const priorityEl=document.querySelector('input[name="ct-priority"]:checked');
  const priority=priorityEl?priorityEl.value:'normal';
  const targetRoles=[...document.querySelectorAll('.ct-role:checked')].map(c=>c.value);
  const slots=parseInt((document.getElementById('ct-slots')||{value:'1'}).value)||1;
  if(!title){alert('Enter a task title');return;}
  if(!targetRoles.length){alert('Select at least one target role');return;}
  const args={adminId:state.user._id,title,type,priority,targetRoles,slots};
  // Type-specific fields
  if(type==='gather'){
    let matSel=(document.getElementById('ct-material')||{value:''}).value;
    if(matSel==='__custom__') matSel=(document.getElementById('ct-material-custom')||{value:''}).value.trim();
    if(!matSel){alert('Select a material');return;}
    args.materialName=matSel;
    const q=parseFloat((document.getElementById('ct-qty')||{value:''}).value);
    if(!isNaN(q)&&q>0){args.quantity=q;args.unit=(document.getElementById('ct-unit')||{value:'SCU'}).value;}
    const qmin=parseInt((document.getElementById('ct-qmin')||{value:''}).value);
    const qmax=parseInt((document.getElementById('ct-qmax')||{value:''}).value);
    if(!isNaN(qmin)&&qmin>0) args.qualityMin=qmin;
    if(!isNaN(qmax)&&qmax>0) args.qualityMax=qmax;
  } else if(type==='craft'){
    args.itemName=(document.getElementById('ct-item')||{value:''}).value;
    if(!args.itemName){alert('Select an item');return;}
    const q=parseInt((document.getElementById('ct-qty')||{value:''}).value);
    if(!isNaN(q)&&q>0) args.quantity=q;
    const qmin=parseInt((document.getElementById('ct-qmin')||{value:''}).value);
    const qmax=parseInt((document.getElementById('ct-qmax')||{value:''}).value);
    if(!isNaN(qmin)&&qmin>0) args.qualityMin=qmin;
    if(!isNaN(qmax)&&qmax>0) args.qualityMax=qmax;
  } else if(type==='deliver'){
    args.materialName=(document.getElementById('ct-deliver-what')||{value:''}).value.trim();
    const q=parseFloat((document.getElementById('ct-qty')||{value:''}).value);
    if(!isNaN(q)&&q>0){args.quantity=q;args.unit=(document.getElementById('ct-unit')||{value:'SCU'}).value;}
    args.fromSystem=(document.getElementById('ct-from-sys')||{value:''}).value||undefined;
    args.fromLocation=(document.getElementById('ct-from-loc')||{value:''}).value||undefined;
    args.toSystem=(document.getElementById('ct-to-sys')||{value:''}).value||undefined;
    args.toLocation=(document.getElementById('ct-to-loc')||{value:''}).value||undefined;
  } else {
    args.description=(document.getElementById('ct-desc')||{value:''}).value.trim();
  }
  try {
    await convexMutation('tasks:create',args);
    closeModal();
    toast('Task created');
    tasksFilter='open';
    await refreshAll();
    goTo('tasks');
  } catch(e){alert(e.message);}
}

async function claimBootstrapAdmin() {
  if(hasAdmin()) { toast('An admin already exists.'); renderNav(); return; }
  if(!confirm(`Claim admin role for "${state.user.username}"? This is only possible while no admins exist.`)) return;
  try {
    const updated=await convexMutation('users:claimBootstrapAdmin',{userId:state.user._id});
    state.user=updated;
    toast('Admin role claimed!');
    await refreshAll();
    goTo('admin');
  } catch(e){
    if(e.message.includes('ADMIN_EXISTS')) toast('An admin already exists — cannot claim.');
    else alert(e.message);
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  if(!CONVEX_URL){showSetup();return;}
  const uid=localStorage.getItem('mattrack_uid');
  if(uid){
    try{
      const user=await convexQuery('users:getById',{userId:uid});
      if(user){state.user=user;showApp();return;}
    }catch(e){/* fall through */}
  }
  showAuth();
}
init();
</script>
